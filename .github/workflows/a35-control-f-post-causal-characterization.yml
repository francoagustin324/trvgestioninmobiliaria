name: A3.5 Control F POST Causal Characterization

on:
  push:
    branches: [validation/a35-control-f-post-causal-characterization]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE: beb8876c4fd72f9c73f0a01b8022970a720d4581
  PARENT: 295fd37f1b0a6229176b66ed25a74ca45c52b291
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Phase 0 exact base proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo "Expected detached candidate checkout"
            exit 1
          fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          echo "PHASE0_HEAD=$CANDIDATE"
          echo "PHASE0_PARENT=$PARENT"
          echo "PHASE0_WORKTREE=CLEAN"
          echo "PHASE0_PRODUCT_BRANCH_IMMUTABLE=YES"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build exact candidate
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium
          npm run build --silent

      - name: Install validation-only preload instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a35cf"
          cat > "$RUNNER_TEMP/a35-control-f-preload.mjs" <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { chromium } from 'playwright';

          const realLaunch = chromium.launch.bind(chromium);
          const OUTPUT = process.env.A35_PROBE_OUTPUT || '';
          const LABEL = process.env.A35_PROBE_LABEL || 'unlabeled';
          const freshBrowserPerContext = process.env.A35_PROBE_FRESH_BROWSER_PER_CONTEXT === '1';
          const SESSION_KEY = 'propcontrol-cloud-session-v1';
          const TENANT_KEY = 'trv-crm-basico:user:a35-downgrade-user:org:a35-downgrade-org';
          const SYNC_KEY = `${TENANT_KEY}:sync`;
          const CLOUD_ALLOWED = 'A35_CLOUD_ALLOWED_AGENT_LEAD';
          const STALE_OWNER = 'A35_STALE_OWNER_LOCAL_DATA';
          const STALE_SENTINEL = 'A35_STALE_OTHER_AGENT_SENTINEL';
          const expectedCloudPayload = {
            id: 3500,
            name: CLOUD_ALLOWED,
            phone: '3515553500',
            interest: 'Current cloud-authorized lead',
            status: 'Lead',
            temperature: 'Tibio',
            pipeline: 'Nuevo',
            assignedToId: 35,
            createdById: 35,
          };

          function stable(value) {
            if (Array.isArray(value)) return value.map(stable);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]));
            }
            return value;
          }

          function exactEqual(left, right) {
            return JSON.stringify(stable(left)) === JSON.stringify(stable(right));
          }

          function classifyPost(body) {
            let parsed = null;
            try { parsed = typeof body === 'string' ? JSON.parse(body) : body; } catch {}
            const rows = Array.isArray(parsed) ? parsed : parsed ? [parsed] : [];
            const names = rows.map((row) => row?.payload?.name).filter(Boolean);
            if (names.includes(STALE_OWNER) || names.includes(STALE_SENTINEL)) {
              return { class: 'STALE_LOCAL', semanticIdempotent: false, differences: [] };
            }
            const current = rows.find((row) => row?.payload?.name === CLOUD_ALLOWED);
            if (current) {
              const expectedShape = {
                organization_id: 'a35-downgrade-org',
                entity_type: 'client',
                entity_key: 'a35-downgrade-org:3500',
                assigned_member_id: 35,
                payload: expectedCloudPayload,
                created_by: 'a35-downgrade-user',
              };
              const actualShape = {
                organization_id: current.organization_id,
                entity_type: current.entity_type,
                entity_key: current.entity_key,
                assigned_member_id: current.assigned_member_id,
                payload: current.payload,
                created_by: current.created_by,
              };
              const differences = [];
              for (const key of Object.keys(expectedShape)) {
                if (!exactEqual(actualShape[key], expectedShape[key])) {
                  differences.push({ key, expected: expectedShape[key], actual: actualShape[key] });
                }
              }
              return {
                class: differences.length ? 'NORMALIZED_CURRENT' : 'CLOUD_CURRENT',
                semanticIdempotent: differences.length === 0,
                differences,
              };
            }
            return { class: 'OTHER', semanticIdempotent: false, differences: [] };
          }

          async function dumpContext(context, cdpEvents) {
            for (const page of context.pages()) {
              let snapshot;
              try {
                snapshot = await page.evaluate(async ({ sessionKey, syncKey }) => {
                  const session = JSON.parse(localStorage.getItem(sessionKey) || '{}');
                  const sync = JSON.parse(localStorage.getItem(syncKey) || '{}');
                  let runtime = null;
                  try {
                    const { state } = await import('/dist/store.js');
                    runtime = {
                      organizationId: state.crm.organization.id,
                      activeMemberId: state.activeMemberId,
                      members: state.crm.teamMembers.map((m) => ({ id: m.id, userId: m.userId || '', role: m.role, status: m.status })),
                      clients: state.crm.clients.map((c) => ({ id: c.id, name: c.name, assignedToId: c.assignedToId, createdById: c.createdById })),
                    };
                  } catch (error) {
                    runtime = { importError: String(error) };
                  }
                  let serviceWorkers = [];
                  try {
                    serviceWorkers = 'serviceWorker' in navigator
                      ? (await navigator.serviceWorker.getRegistrations()).map((registration) => registration.scope)
                      : [];
                  } catch {}
                  return {
                    generation: String(session.__propcontrolAuthGeneration || ''),
                    sync,
                    runtime,
                    serviceWorkers,
                    trace: globalThis.__a35cfTrace || null,
                    localStorageKeys: Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index)).filter(Boolean),
                  };
                }, { sessionKey: SESSION_KEY, syncKey: SYNC_KEY });
              } catch (error) {
                snapshot = { generation: '', evaluationError: String(error), trace: null };
              }
              if (snapshot?.generation !== 'a35-control-f') continue;
              const traceEvents = snapshot.trace?.events || [];
              const posts = traceEvents.filter((event) => event.type === 'fetch-start'
                && event.method === 'POST'
                && String(event.url || '').includes('/rest/v1/propcontrol_records'));
              const fetchEnds = new Map(traceEvents.filter((event) => event.type === 'fetch-end').map((event) => [event.requestId, event]));
              const replacements = traceEvents.filter((event) => event.type === 'storage-set'
                && String(event.stack || '').includes('replaceDataForTenant'));
              const timerEvents = traceEvents.filter((event) => event.type === 'timer-700-schedule' || event.type === 'timer-700-fire');
              const syncReads = traceEvents.filter((event) => event.type === 'sync-dirty-read');
              const enrichedPosts = posts.map((post) => {
                const classification = classifyPost(post.body);
                const response = fetchEnds.get(post.requestId);
                const precedingReplace = replacements.filter((event) => event.seq < post.seq).at(-1) || null;
                const followingReplace = replacements.find((event) => event.seq > post.seq) || null;
                const cdp = cdpEvents.find((event) => event.type === 'request'
                  && event.method === 'POST'
                  && String(event.url || '').includes('/rest/v1/propcontrol_records')
                  && event.postData === post.body) || null;
                return {
                  ...post,
                  responseStatus: response?.status ?? null,
                  payloadClass: classification.class,
                  semanticIdempotent: classification.semanticIdempotent,
                  payloadDifferences: classification.differences,
                  replaceRelation: precedingReplace ? 'AFTER_REPLACE' : followingReplace ? 'BEFORE_REPLACE' : 'NO_REPLACE_TRACE',
                  precedingReplace,
                  followingReplace,
                  cdpInitiator: cdp?.initiator ?? null,
                };
              });
              const result = {
                label: LABEL,
                generation: snapshot.generation,
                postCount: enrichedPosts.length,
                posts: enrichedPosts,
                replacements,
                timerEvents,
                syncReads,
                runtime: snapshot.runtime,
                finalSync: snapshot.sync,
                serviceWorkers: snapshot.serviceWorkers,
                localStorageKeys: snapshot.localStorageKeys,
                cdpEvents,
                fullTrace: traceEvents,
              };
              if (OUTPUT) appendFileSync(OUTPUT, `${JSON.stringify(result)}\n`, 'utf8');
              console.log(`A35_CONTROL_F_CAUSAL_RESULT=${JSON.stringify({
                label: LABEL,
                postCount: result.postCount,
                payloadClasses: enrichedPosts.map((post) => post.payloadClass),
                dirtyBefore: enrichedPosts.map((post) => post.dirtyBefore),
                replaceRelations: enrichedPosts.map((post) => post.replaceRelation),
                origins: enrichedPosts.map((post) => String(post.stack || '').split('\n').slice(1, 7)),
                cdpInitiators: enrichedPosts.map((post) => post.cdpInitiator),
                timers700: timerEvents,
                finalDirty: snapshot.sync?.dirty,
                serviceWorkerCount: snapshot.serviceWorkers.length,
              })}`);
            }
          }

          async function instrumentContext(context, childBrowser = null) {
            const cdpEvents = [];
            await context.addInitScript(({ tenantKey, syncKey }) => {
              const originalFetch = window.fetch.bind(window);
              const storageProto = Storage.prototype;
              const originalSetItem = storageProto.setItem;
              const originalGetItem = storageProto.getItem;
              const originalSetTimeout = window.setTimeout.bind(window);
              let seq = 0;
              let requestId = 0;
              let timerId = 0;
              const events = [];
              const startedAtEpochMs = Date.now();
              const record = (type, data = {}) => {
                events.push({ seq: ++seq, monoMs: Number(performance.now().toFixed(3)), type, ...data });
              };
              const rawGet = (key) => originalGetItem.call(window.localStorage, key);
              const parse = (raw) => {
                try { return raw ? JSON.parse(raw) : null; } catch { return null; }
              };
              const dirty = () => parse(rawGet(syncKey))?.dirty === true;
              const snapshotSummary = () => {
                const crm = parse(rawGet(tenantKey));
                if (!crm) return null;
                return {
                  organizationId: crm.organization?.id || '',
                  clients: Array.isArray(crm.clients) ? crm.clients.map((client) => client?.name || '') : [],
                  members: Array.isArray(crm.teamMembers) ? crm.teamMembers.map((member) => ({ id: member?.id, userId: member?.userId || '', role: member?.role, status: member?.status })) : [],
                };
              };
              globalThis.__a35cfTrace = { startedAtEpochMs, events };
              record('bootstrap-init', { dirty: dirty(), snapshot: snapshotSummary() });

              storageProto.setItem = function(key, value) {
                const isLocal = this === window.localStorage;
                const stack = isLocal && (key === tenantKey || key === syncKey)
                  ? new Error('A35_STORAGE_SET').stack || ''
                  : '';
                const beforeDirty = isLocal ? dirty() : null;
                const result = originalSetItem.call(this, key, value);
                if (isLocal && (key === tenantKey || key === syncKey)) {
                  record('storage-set', {
                    key,
                    beforeDirty,
                    afterDirty: dirty(),
                    value: key === syncKey ? parse(String(value)) : snapshotSummary(),
                    stack,
                  });
                }
                return result;
              };

              storageProto.getItem = function(key) {
                const value = originalGetItem.call(this, key);
                if (this === window.localStorage && key === syncKey) {
                  const stack = new Error('A35_SYNC_READ').stack || '';
                  if (stack.includes('tenantHasPendingLocalChanges') || stack.includes('hasPendingLocalChanges') || stack.includes('queueCloudSave')) {
                    record('sync-dirty-read', { dirty: parse(value)?.dirty === true, stack });
                  }
                }
                return value;
              };

              window.setTimeout = function(callback, delay = 0, ...args) {
                if (Number(delay) !== 700) return originalSetTimeout(callback, delay, ...args);
                const id = ++timerId;
                const stack = new Error('A35_TIMER_700').stack || '';
                record('timer-700-schedule', { timerId: id, delay: Number(delay), dirty: dirty(), snapshot: snapshotSummary(), stack });
                return originalSetTimeout(() => {
                  record('timer-700-fire', { timerId: id, dirty: dirty(), snapshot: snapshotSummary() });
                  if (typeof callback === 'function') return callback(...args);
                  return Function(String(callback))();
                }, delay);
              };

              window.fetch = async function(input, init) {
                const id = ++requestId;
                const url = typeof input === 'string' || input instanceof URL ? String(input) : input.url;
                const method = String(init?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
                let body = null;
                if (typeof init?.body === 'string') body = init.body;
                const stack = new Error('A35_FETCH_ORIGIN').stack || '';
                record('fetch-start', { requestId: id, method, url, body, dirtyBefore: dirty(), snapshot: snapshotSummary(), stack });
                try {
                  const response = await originalFetch(input, init);
                  record('fetch-end', { requestId: id, method, url, status: response.status, dirtyAfter: dirty(), snapshot: snapshotSummary() });
                  return response;
                } catch (error) {
                  record('fetch-error', { requestId: id, method, url, error: String(error), dirtyAfter: dirty() });
                  throw error;
                }
              };

              document.addEventListener('DOMContentLoaded', () => {
                record('domcontentloaded', { dirty: dirty(), snapshot: snapshotSummary() });
                let completed = false;
                const inspect = () => {
                  if (completed) return;
                  if (document.querySelector('#crm.active')) {
                    completed = true;
                    record('bootstrap-complete-crm-active', { dirty: dirty(), snapshot: snapshotSummary() });
                  } else if (document.querySelector('[data-bootstrap-error]')) {
                    completed = true;
                    record('bootstrap-complete-error', { dirty: dirty(), snapshot: snapshotSummary() });
                  }
                };
                inspect();
                const observer = new MutationObserver(inspect);
                observer.observe(document.documentElement, { subtree: true, childList: true, attributes: true });
              }, { once: true });
            }, { tenantKey: TENANT_KEY, syncKey: SYNC_KEY });

            const originalNewPage = context.newPage.bind(context);
            context.newPage = async (...args) => {
              const page = await originalNewPage(...args);
              try {
                const session = await context.newCDPSession(page);
                await session.send('Network.enable');
                session.on('Network.requestWillBeSent', (event) => {
                  const url = event.request?.url || '';
                  if (!url.includes('/rest/v1/') && !url.includes('/api/cloud-config')) return;
                  cdpEvents.push({
                    type: 'request',
                    requestId: event.requestId,
                    timestamp: event.timestamp,
                    wallTime: event.wallTime,
                    method: event.request.method,
                    url,
                    postData: event.request.postData || null,
                    initiator: event.initiator || null,
                  });
                });
                session.on('Network.responseReceived', (event) => {
                  const url = event.response?.url || '';
                  if (!url.includes('/rest/v1/') && !url.includes('/api/cloud-config')) return;
                  cdpEvents.push({
                    type: 'response',
                    requestId: event.requestId,
                    timestamp: event.timestamp,
                    status: event.response.status,
                    url,
                  });
                });
              } catch (error) {
                cdpEvents.push({ type: 'cdp-error', error: String(error) });
              }
              return page;
            };

            const originalClose = context.close.bind(context);
            context.close = async (...args) => {
              await dumpContext(context, cdpEvents);
              const result = await originalClose(...args);
              if (childBrowser) await childBrowser.close();
              return result;
            };
          }

          async function wrapBrowser(browser, launchArgs) {
            const originalNewContext = browser.newContext.bind(browser);
            browser.newContext = async (...contextArgs) => {
              if (freshBrowserPerContext) {
                const child = await realLaunch(...launchArgs);
                const context = await child.newContext(...contextArgs);
                await instrumentContext(context, child);
                return context;
              }
              const context = await originalNewContext(...contextArgs);
              await instrumentContext(context);
              return context;
            };
            return browser;
          }

          Object.defineProperty(chromium, 'launch', {
            configurable: true,
            value: async (...args) => wrapBrowser(await realLaunch(...args), args),
          });
          EOF
          echo "PRELOAD=$RUNNER_TEMP/a35-control-f-preload.mjs" >> "$GITHUB_ENV"
          echo "TRACE_DIR=$RUNNER_TEMP/a35cf" >> "$GITHUB_ENV"
          echo "INSTRUMENTATION=TEST_HARNESS_ONLY"

      - name: Case 1 isolated F fresh process browser context x10
        shell: bash
        run: |
          set -u
          for n in $(seq 1 10); do
            label="case1-isolated-$n"
            out="$TRACE_DIR/$label.jsonl"
            log="$TRACE_DIR/$label.log"
            echo "RUN=$label"
            set +e
            A35_PROBE_LABEL="$label" A35_PROBE_OUTPUT="$out" NODE_OPTIONS="--import=$PRELOAD" \
              node --test --test-concurrency=1 --test-name-pattern='A3\.5 F:' \
              dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js >"$log" 2>&1
            rc=$?
            set -e
            echo "RESULT=$label RC=$rc"
            grep -E 'CONTROL_F_|A35_CONTROL_F_CAUSAL_RESULT=' "$log" || true
          done

      - name: Case 2 A-E then F shared browser fresh contexts x5
        shell: bash
        run: |
          set -u
          for n in $(seq 1 5); do
            label="case2-ae-then-f-$n"
            out="$TRACE_DIR/$label.jsonl"
            log="$TRACE_DIR/$label.log"
            echo "RUN=$label"
            set +e
            A35_PROBE_LABEL="$label" A35_PROBE_OUTPUT="$out" NODE_OPTIONS="--import=$PRELOAD" \
              node --test --test-concurrency=1 \
              dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js >"$log" 2>&1
            rc=$?
            set -e
            echo "RESULT=$label RC=$rc"
            grep -E 'CONTROL_F_|A35_CONTROL_F_CAUSAL_RESULT=' "$log" || true
          done

      - name: Case 3 A-E then F fresh browser per context x5
        shell: bash
        run: |
          set -u
          for n in $(seq 1 5); do
            label="case3-fresh-browser-per-context-$n"
            out="$TRACE_DIR/$label.jsonl"
            log="$TRACE_DIR/$label.log"
            echo "RUN=$label"
            set +e
            A35_PROBE_FRESH_BROWSER_PER_CONTEXT=1 A35_PROBE_LABEL="$label" A35_PROBE_OUTPUT="$out" NODE_OPTIONS="--import=$PRELOAD" \
              node --test --test-concurrency=1 \
              dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js >"$log" 2>&1
            rc=$?
            set -e
            echo "RESULT=$label RC=$rc"
            grep -E 'CONTROL_F_|A35_CONTROL_F_CAUSAL_RESULT=' "$log" || true
          done

      - name: Case 4 exact Full Closure architecture x5
        shell: bash
        run: |
          set -u
          for n in $(seq 1 5); do
            label="case4-full-closure-architecture-$n"
            out="$TRACE_DIR/$label.jsonl"
            log="$TRACE_DIR/$label.log"
            echo "RUN=$label"
            set +e
            A35_PROBE_LABEL="$label" A35_PROBE_OUTPUT="$out" NODE_OPTIONS="--import=$PRELOAD" \
              node --test --test-concurrency=1 \
              dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js \
              dist/tests/sec-fix-a3-5-ownerless-normalization.test.js >"$log" 2>&1
            rc=$?
            set -e
            echo "RESULT=$label RC=$rc"
            grep -E 'CONTROL_F_|A35_CONTROL_F_CAUSAL_RESULT=' "$log" || true
          done

      - name: Aggregate causal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os
          from collections import defaultdict

          root = os.environ['TRACE_DIR']
          rows = []
          for path in sorted(glob.glob(os.path.join(root, '*.jsonl'))):
              with open(path, encoding='utf-8') as handle:
                  for line in handle:
                      if line.strip():
                          rows.append(json.loads(line))

          def scenario(label):
              return label.split('-', 2)[0]

          grouped = defaultdict(list)
          for row in rows:
              grouped[scenario(row['label'])].append(row)

          print('=== REPRODUCTION_MATRIX ===')
          for key in ['case1', 'case2', 'case3', 'case4']:
              vals = grouped.get(key, [])
              zero = sum(1 for row in vals if row['postCount'] == 0)
              one = sum(1 for row in vals if row['postCount'] > 0)
              classes = sorted({post['payloadClass'] for row in vals for post in row['posts']})
              print(f'{key}: runs={len(vals)} POST=0:{zero} POST=1+:{one} payload_classes={classes}')

          print('=== PER_RUN ===')
          for row in rows:
              origins = []
              for post in row['posts']:
                  stack = str(post.get('stack') or '').splitlines()
                  origins.append(stack[1:8])
              print(json.dumps({
                  'label': row['label'],
                  'postCount': row['postCount'],
                  'classes': [p['payloadClass'] for p in row['posts']],
                  'dirtyBefore': [p['dirtyBefore'] for p in row['posts']],
                  'replaceRelation': [p['replaceRelation'] for p in row['posts']],
                  'semanticIdempotent': [p['semanticIdempotent'] for p in row['posts']],
                  'finalDirty': row.get('finalSync', {}).get('dirty'),
                  'serviceWorkers': row.get('serviceWorkers', []),
                  'origins': origins,
              }, ensure_ascii=False))

          print('=== EXACT_POST_TRACES ===')
          for row in rows:
              if not row['posts']:
                  continue
              print(f"--- {row['label']} ---")
              for post in row['posts']:
                  print(json.dumps({
                      'seq': post['seq'],
                      'monoMs': post['monoMs'],
                      'method': post['method'],
                      'url': post['url'],
                      'status': post.get('responseStatus'),
                      'dirtyBefore': post.get('dirtyBefore'),
                      'snapshotBefore': post.get('snapshot'),
                      'payloadClass': post.get('payloadClass'),
                      'semanticIdempotent': post.get('semanticIdempotent'),
                      'payloadDifferences': post.get('payloadDifferences'),
                      'payload': post.get('body'),
                      'replaceRelation': post.get('replaceRelation'),
                      'precedingReplace': post.get('precedingReplace'),
                      'followingReplace': post.get('followingReplace'),
                      'stack': post.get('stack'),
                      'cdpInitiator': post.get('cdpInitiator'),
                  }, ensure_ascii=False))
              print('TIMERS700=' + json.dumps(row.get('timerEvents', []), ensure_ascii=False))
              print('SYNC_READS=' + json.dumps(row.get('syncReads', []), ensure_ascii=False))
              print('RUNTIME_FINAL=' + json.dumps(row.get('runtime'), ensure_ascii=False))
              print('FINAL_SYNC=' + json.dumps(row.get('finalSync'), ensure_ascii=False))
              print('SERVICE_WORKERS=' + json.dumps(row.get('serviceWorkers', []), ensure_ascii=False))

          print(f'TOTAL_CONTROL_F_RUNS={len(rows)}')
          print(f'TOTAL_POSTING_RUNS={sum(1 for row in rows if row["postCount"] > 0)}')
          PY

      - name: Final immutability proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          git diff --quiet -- src ':!src/tests'
          git diff --cached --quiet -- src ':!src/tests'
          echo "FINAL_CANDIDATE_SHA=$CANDIDATE"
          echo "RUNTIME_DELTA=0"
          echo "PRODUCT_BRANCH_UNCHANGED=YES"
