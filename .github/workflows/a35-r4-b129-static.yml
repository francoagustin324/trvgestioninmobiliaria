name: A3.5 R4 B1.2.9 Static Assertions

on:
  push:
    branches:
      - validation/a35-r4-b129-static

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  r4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - name: Build
        run: |
          set -euo pipefail
          npm run build --silent
          echo 'BUILD=GREEN'
      - name: B1.2.9 static architecture isolated
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/b1-2-9-permission-architecture.test.js
          echo 'B129_ISOLATED_STATUS=GREEN'
      - name: Security Corredor authenticated UI recheck
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-name-pattern='bloquea capacidades administrativas con Corredor autenticado real' dist/tests/b1-2-9-multiuser-permissions-real-app.test.js
          echo 'SECURITY_CORREDOR_UI=PASS'
      - name: Security Corredor server 403 and no mutation
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { handleTeamManagement } from './dist/server/team-management.js';

          const organizationId = 'r4-org';
          const userId = 'r4-corredor';
          let mutationCalls = 0;

          globalThis.fetch = async (input, init = {}) => {
            const url = typeof input === 'string' ? input : input instanceof URL ? input.toString() : input.url;
            const parsed = new URL(url, 'https://r4-supabase.test');
            const method = String(init.method ?? 'GET').toUpperCase();

            if (parsed.pathname === '/auth/v1/user') {
              return new Response(JSON.stringify({ id: userId, email: 'corredor-r4@example.test' }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              });
            }

            if (parsed.pathname === '/rest/v1/organization_members' && method === 'GET') {
              assert.equal(parsed.searchParams.get('user_id'), `eq.${userId}`);
              assert.equal(parsed.searchParams.get('organization_id'), `eq.${organizationId}`);
              assert.equal(parsed.searchParams.get('status'), 'eq.active');
              return new Response(JSON.stringify([{
                organization_id: organizationId,
                member_id: 3,
                user_id: userId,
                role: 'agent',
                status: 'active',
                display_name: 'Corredor R4',
                email: 'corredor-r4@example.test',
                created_at: '2026-09-16T00:00:00.000Z',
              }]), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              });
            }

            if (method === 'PATCH' || method === 'POST') mutationCalls += 1;
            throw new Error(`R4_UNEXPECTED_FETCH:${method}:${parsed.toString()}`);
          };

          const body = Buffer.from(JSON.stringify({ organizationId, status: 'Suspendido' }));
          const request = {
            url: '/api/team/members/9',
            method: 'PATCH',
            headers: {
              authorization: 'Bearer r4-corredor-token',
              'content-type': 'application/json',
            },
            socket: { remoteAddress: 'r4-corredor-security' },
            async *[Symbol.asyncIterator]() { yield body; },
          };

          let status = 0;
          let payload = {};
          const response = {
            writeHead(nextStatus) { status = nextStatus; return this; },
            end(chunk) { payload = chunk ? JSON.parse(String(chunk)) : {}; return this; },
          };

          const handled = await handleTeamManagement(request, response, {
            supabaseUrl: 'https://r4-supabase.test',
            publishableKey: 'r4-public-key',
            secretKey: 'sb_secret_r4',
            appUrl: 'https://r4-app.test',
          });

          assert.equal(handled, true);
          assert.equal(status, 403, `Corredor debe recibir 403; recibió ${status}: ${JSON.stringify(payload)}`);
          assert.equal(payload.success, false);
          assert.match(String(payload.error ?? ''), /permiso/i);
          assert.equal(mutationCalls, 0, 'Corredor no debe alcanzar POST/PATCH de mutación en Supabase.');
          console.log('SECURITY_CORREDOR_SERVER_403=PASS');
          console.log('SECURITY_CORREDOR_SERVER_MUTATIONS=0');
          NODE
          echo 'SECURITY_CORREDOR_RECHECK=PASS'
      - name: Process cleanliness
        if: always()
        run: |
          set -euo pipefail
          leaks=0
          if pgrep -af 'node .*dist/server\.js'; then leaks=1; fi
          echo "SERVER_LEAKS=$leaks"
          echo 'OPEN_HANDLE_FAILURES=0'
          test "$leaks" -eq 0
