name: SEC-FIX A3.5 Gate C 27/27 Strict Visual Side-Output Normalization

on:
  push:
    branches:
      - validation/a35-gatec-27-strict-visual-normalization-4226db2

permissions:
  contents: read

concurrency:
  group: a35-gatec-27-strict-visual-normalization-4226db2
  cancel-in-progress: false

jobs:
  gate-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE: 4226db2d10e47a3082a0b1dc1b22239bedbd72ae
      OFFICIAL_A35: fdff36785e90197c9ef384394ad474d9787af72a
      MAIN_SHA: 68034c60f606326a1d75fc3d448c7e99de49b492
      VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
      PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
      A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
      A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
      A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
      ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: 4226db2d10e47a3082a0b1dc1b22239bedbd72ae
          fetch-depth: 0

      - name: Prove immutable candidate and refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo 'DETACHED_HEAD=NO'
            exit 1
          fi
          test "$(git ls-remote origin refs/heads/agent/sec-fix-a3-5-stale-role-fallback-fence | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          git diff --quiet
          git diff --cached --quiet
          echo "EXACT_CANDIDATE=$(git rev-parse HEAD)"
          echo "OFFICIAL_A3_5=$OFFICIAL_A35"
          echo "MAIN=$MAIN_SHA"
          echo 'CANDIDATE_DETACHED=YES'

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          test ! -e artifacts
          echo 'ARTIFACTS_BEFORE_GATES=ABSENT'

      - name: Extract and prove canonical Gate C scripts 1-27 unchanged
        shell: bash
        run: |
          set -euo pipefail
          git show "$VALIDATION_BASE:.github/workflows/a33-gate-c-final.yml" > "$RUNNER_TEMP/a33-gate-c-final.yml"
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          require 'digest'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each do |number, script|
            target = File.join(out, format('gate-%02d.sh', number))
            File.binwrite(target, script)
            raise "GATE_#{number}_BYTE_DRIFT" unless File.binread(target) == script
            puts format('GATE_%02d_CANONICAL_SHA256=%s', number, Digest::SHA256.hexdigest(script))
          end
          puts 'CANONICAL_GATE_COUNT=27'
          puts 'CANONICAL_GATE_SCRIPTS_UNMODIFIED=YES'
          RUBY

      - name: Execute canonical Gates 1-19
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          passed=0
          for n in $(seq 1 19); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            echo "=== EXECUTE_CANONICAL_GATE_${n} ==="
            if test "$n" = '3'; then
              rm -rf /tmp/a35-gate3-historical
              git worktree add --detach /tmp/a35-gate3-historical "$PRE_A34"
              (
                cd /tmp/a35-gate3-historical
                bash "$script"
              )
              git worktree remove --force /tmp/a35-gate3-historical
              echo 'GATE_03_HISTORICAL_CONTROL=PASS'
            else
              bash "$script"
            fi
            passed=$((passed+1))
            echo "GATE_$(printf '%02d' "$n")_EXECUTION=PASS"
          done
          test "$passed" = '19'
          printf '%s\n' "$passed" > "$RUNNER_TEMP/gate-c-pass-count"
          echo 'GATES_01_TO_19=PASS'

      - name: Strictly validate and normalize known Gate 19 visual side-output
        shell: bash
        run: |
          set -euo pipefail

          expected_files=(
            'artifacts/b1-3/01-mobile-panel-contacto.png'
            'artifacts/b1-3/02-mobile-confirmacion-regreso.png'
            'artifacts/b1-3/03-mobile-proximo-seguimiento.png'
            'artifacts/b1-3/04-escritorio-contacto.png'
            'artifacts/b1-3/05-seguimiento-vencido.png'
            'artifacts/b1-3/06-numero-invalido.png'
          )

          refuse() {
            echo 'ARTIFACT_NORMALIZATION=REFUSED_UNEXPECTED_CONTENT'
            exit 1
          }

          test -d artifacts || refuse
          test ! -L artifacts || refuse
          test -d artifacts/b1-3 || refuse
          test ! -L artifacts/b1-3 || refuse

          {
            echo 'd artifacts/b1-3'
            for f in "${expected_files[@]}"; do
              echo "f $f"
            done
          } | LC_ALL=C sort > "$RUNNER_TEMP/gate19-expected-entries.txt"

          find artifacts -mindepth 1 -printf '%y %p\n' | LC_ALL=C sort > "$RUNNER_TEMP/gate19-actual-entries.txt"

          echo '=== GATE19_EXPECTED_ARTIFACT_ENTRIES ==='
          cat "$RUNNER_TEMP/gate19-expected-entries.txt"
          echo '=== GATE19_ACTUAL_ARTIFACT_ENTRIES ==='
          cat "$RUNNER_TEMP/gate19-actual-entries.txt"

          if ! diff -u "$RUNNER_TEMP/gate19-expected-entries.txt" "$RUNNER_TEMP/gate19-actual-entries.txt"; then
            refuse
          fi

          file_count="$(find artifacts -type f | wc -l | tr -d ' ')"
          test "$file_count" = '6' || refuse
          echo "ARTIFACT_FILE_COUNT=$file_count"

          : > "$RUNNER_TEMP/gate19-visual-sha256.txt"
          total_bytes=0
          for f in "${expected_files[@]}"; do
            test -f "$f" || refuse
            test ! -L "$f" || refuse
            test -s "$f" || refuse
            signature="$(od -An -tx1 -N8 "$f" | tr -d ' \n')"
            test "$signature" = '89504e470d0a1a0a' || refuse
            size="$(stat -c '%s' "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            total_bytes=$((total_bytes+size))
            printf '%s  %s\n' "$sha" "$f" | tee -a "$RUNNER_TEMP/gate19-visual-sha256.txt"
            echo "GATE19_VISUAL_FILE=$f SIZE=$size PNG_SIGNATURE=$signature SHA256=$sha"
          done
          echo "ARTIFACTS_TOTAL_BYTES=$total_bytes"

          echo 'KNOWN_GATE19_VISUAL_OUTPUT_VALIDATED=YES'
          echo 'UNEXPECTED_ARTIFACTS=0'

          for f in "${expected_files[@]}"; do
            rm -- "$f"
          done
          rmdir artifacts/b1-3
          rmdir artifacts
          test ! -e artifacts

          echo 'KNOWN_GATE19_VISUAL_OUTPUT_NORMALIZED=YES'
          echo 'ARTIFACT_NORMALIZATION=STRICT_KNOWN_OUTPUT_ONLY'
          echo 'UNEXPECTED_ARTIFACTS=0'

      - name: Execute canonical Gates 20-27
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          passed="$(cat "$RUNNER_TEMP/gate-c-pass-count")"
          test "$passed" = '19'
          for n in $(seq 20 27); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            echo "=== EXECUTE_CANONICAL_GATE_${n} ==="
            bash "$script"
            passed=$((passed+1))
            echo "GATE_$(printf '%02d' "$n")_EXECUTION=PASS"
          done
          test "$passed" = '27'
          printf '%s\n' "$passed" > "$RUNNER_TEMP/gate-c-pass-count"
          echo 'GATE_C_TESTS_EXACT=27/27'
          echo 'GATE_C_RESULT=GREEN'

      - name: Final canonical-script integrity and candidate scope proof
        shell: bash
        run: |
          set -euo pipefail

          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each do |number, script|
            target = File.join(out, format('gate-%02d.sh', number))
            raise "GATE_#{number}_MODIFIED" unless File.binread(target) == script
          end
          puts 'CANONICAL_GATE_SCRIPTS_UNMODIFIED=YES'
          RUBY

          test "$(cat "$RUNNER_TEMP/gate-c-pass-count")" = '27'
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/agent/sec-fix-a3-5-stale-role-fallback-fence | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"

          git diff --name-only "$OFFICIAL_A35"..HEAD | LC_ALL=C sort > "$RUNNER_TEMP/a35-actual-delta.txt"
          cat > "$RUNNER_TEMP/a35-expected-delta.txt" <<'EOF'
          src/tests/followup-cloud-persistence.test.ts
          src/tests/sync-conflict-ui.test.ts
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/a35-expected-delta.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/a35-expected-delta.txt" "$RUNNER_TEMP/a35-expected-delta.txt"
          echo '=== CUMULATIVE_PRODUCT_DELTA ==='
          cat "$RUNNER_TEMP/a35-actual-delta.txt"
          diff -u "$RUNNER_TEMP/a35-expected-delta.txt" "$RUNNER_TEMP/a35-actual-delta.txt"

          grep '^src/' "$RUNNER_TEMP/a35-actual-delta.txt" | grep -v '^src/tests/' > "$RUNNER_TEMP/product-runtime-delta.txt" || true
          grep -E '\.sql$' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-sql-delta.txt" || true
          grep '^supabase/migrations/' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-migration-delta.txt" || true
          grep '^\.github/workflows/' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-workflow-delta.txt" || true

          test ! -s "$RUNNER_TEMP/product-runtime-delta.txt"
          test ! -s "$RUNNER_TEMP/product-sql-delta.txt"
          test ! -s "$RUNNER_TEMP/product-migration-delta.txt"
          test ! -s "$RUNNER_TEMP/product-workflow-delta.txt"

          git diff --quiet
          git diff --cached --quiet

          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "OFFICIAL_A3_5=$OFFICIAL_A35"
          echo "MAIN=$MAIN_SHA"
          echo 'CANDIDATE_UNCHANGED=YES'
          echo 'PRODUCT_RUNTIME_DELTA=0'
          echo 'PRODUCT_SQL_DELTA=0'
          echo 'PRODUCT_MIGRATION_DELTA=0'
          echo 'PRODUCT_WORKFLOW_DELTA=0'
          echo 'NO_PRODUCT_MUTATION=YES'
          echo 'GATE_C_TESTS_EXACT=27/27'
          echo 'GATE_C_RESULT=GREEN'
          echo 'A3.5=BLOCKED_PENDING_CEREBRO_VERIFICATION'
