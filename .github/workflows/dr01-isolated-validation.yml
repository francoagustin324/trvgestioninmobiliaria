name: DR01 Isolated Candidate Validation

on:
  push:
    branches:
      - validation/dr01-1ef9db-isolated

permissions:
  contents: read

jobs:
  validate-dr01:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CANDIDATE_SHA: "1ef9db69805407230c72a1781c92df349f6328f3"
    steps:
      - name: Checkout exact DR-01 candidate
        uses: actions/checkout@v7
        with:
          ref: 1ef9db69805407230c72a1781c92df349f6328f3
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CANDIDATE_EXPECTED=$CANDIDATE_SHA"
          echo "CANDIDATE_ACTUAL=$actual"
          test "$actual" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --silent

      - name: TypeScript and build
        run: npm run build --silent

      - name: Property Photo tests full
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/property-photo-direct-upload.test.js \
            dist/tests/property-photo-storage.test.js

      - name: DR-01 explicit tests only
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            --test-name-pattern='^DR-01 ' \
            dist/tests/property-photo-direct-upload.test.js \
            dist/tests/property-photo-storage.test.js

      - name: Targeted accumulated A1 tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find dist/tests -maxdepth 1 -type f -name 'sec-fix-a1*.test.js' -print | sort)
          printf 'TARGETED_A1_FILES=%s\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          if [ "${#tests[@]}" -gt 0 ]; then
            node --test --test-concurrency=1 "${tests[@]}"
          fi

      - name: Confirm candidate worktree unchanged by validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "FINAL_CANDIDATE_SHA=$(git rev-parse HEAD)"
