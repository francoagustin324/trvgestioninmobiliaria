name: Temporary PR137 stage contrast repair

on:
  push:
    branches:
      - agent/leads-ux-ui-professional-redesign

permissions:
  contents: write

jobs:
  repair-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leads-ux-ui-professional-redesign
          fetch-depth: 0

      - name: Execute corrected patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/temporary-pr137-stage-contrast.yml').read_text()
          raw_script = workflow.split("python3 <<'PY'", 1)[1].split('\n          PY', 1)[0]
          script = textwrap.dedent(raw_script).lstrip('\n')
          replacement = '''call_marker = "    browser = await chromium.launch({ executablePath, headless: true });\\n"
          if call_marker not in test:
              raise SystemExit('No se encontró el punto de ejecución de la matriz de contraste.')
          test_path.write_text(test.replace(
              call_marker,
              call_marker + "\\n    await validateStageContrastMatrix(browser, started.url);\\n",
              1,
          ))'''
          script, count = re.subn(
              r"call_marker = '''.*?test_path\.write_text\(test\.replace\(call_marker, call_replacement, 1\)\)",
              replacement,
              script,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se pudo reparar el marcador temporal de ejecución.')
          exec(compile(script, '<pr137-stage-contrast>', 'exec'))
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/leads-professional-redesign.css src/tests/leads-professional-redesign.test.ts
          git commit -m "Corregir contraste real de etapas en Leads"
          git push origin HEAD:agent/leads-ux-ui-professional-redesign
