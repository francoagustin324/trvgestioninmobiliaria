name: TRV Daily Use Focused

on:
  push:
    branches:
      - validation/trv-daily-use-gate

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci --silent
      - name: Verify Chromium
        shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$executable"
      - name: Build
        run: npm run build --silent
      - name: Targeted tests
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            dist/tests/trv-daily-use-gate.test.js
            dist/tests/trv-daily-use-browser.test.js
            dist/tests/agenda.test.js
            dist/tests/agenda-related-ui.test.js
            dist/tests/b1-1-leads-pipeline.test.js
            dist/tests/property-matching.test.js
            dist/tests/property-matching-ui.test.js
            dist/tests/p1-4-a1-property-opportunities.test.js
            dist/tests/p1-2-a1-commercial-close-browser.test.js
            dist/tests/team-policy.test.js
            dist/tests/sec-fix-a3-1-lead-explicit-tenant-write-identity.test.js
          )
          tests=()
          for candidate in "${candidates[@]}"; do
            if test -f "$candidate"; then tests+=("$candidate"); fi
          done
          test "${#tests[@]}" -gt 0
          node --test --test-concurrency=1 "${tests[@]}"
