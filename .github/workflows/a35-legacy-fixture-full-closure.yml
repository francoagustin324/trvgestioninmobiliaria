name: SEC-FIX A3.5 GATE C 1-27 EXACT 8e1ee1

on:
  push:
    branches: [validation/a35-full-closure-final-exact-6d2386]

permissions:
  contents: read

concurrency:
  group: sec-fix-a3-5-gate-c-exact-8e1ee1
  cancel-in-progress: false

env:
  CANDIDATE: 8e1ee186c0e34e3bcd93e99d0ac5b21e82234f6c
  PARENT: 6d2386dcc1104a05770d1957cc450f49bf857934
  A35_PARENT: fdff36785e90197c9ef384394ad474d9787af72a
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence
  MAIN_SHA: 68034c60f606326a1d75fc3d448c7e99de49b492
  VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
  PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
  A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
  A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
  A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
  A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
  ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

jobs:
  gate-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout exact detached temporary candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Exact candidate refs and scope before Gate C
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          mapfile -t direct < <(git diff --name-only "$PARENT..$CANDIDATE" | sort)
          test "${#direct[@]}" -eq 1
          test "${direct[0]}" = 'src/tests/followup-cloud-persistence.test.ts'
          mapfile -t cumulative < <(git diff --name-only "$A35_PARENT..$CANDIDATE" | sort)
          test "${#cumulative[@]}" -eq 2
          test "${cumulative[0]}" = 'src/tests/followup-cloud-persistence.test.ts'
          test "${cumulative[1]}" = 'src/tests/sync-conflict-ui.test.ts'
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -Ev '^src/tests/' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '\.sql$' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^supabase/migrations/' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^\.github/workflows/' || true)"
          echo "PRODUCT_CHANGED_FILES=2"
          echo "RUNTIME_DELTA=0"
          echo "SQL_DELTA=0"
          echo "MIGRATION_DELTA=0"
          echo "PRODUCT_WORKFLOW_DELTA=0"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Extract canonical historical Gate C 1-27 scripts
        shell: bash
        run: |
          set -euo pipefail
          git show "$VALIDATION_BASE:.github/workflows/a33-gate-c-final.yml" > "$RUNNER_TEMP/a33-gate-c-final.yml"
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each { |number, script| File.write(File.join(out, format('gate-%02d.sh', number)), script) }
          puts 'CANONICAL_GATE_COUNT=27'
          RUBY

      - name: Execute canonical Gate C 1-27 with historical Gate 3 control
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          bash "$RUNNER_TEMP/gate-01.sh"
          bash "$RUNNER_TEMP/gate-02.sh"
          rm -rf /tmp/a35-gate3-historical
          git worktree add --detach /tmp/a35-gate3-historical "$PRE_A34"
          (
            cd /tmp/a35-gate3-historical
            bash "$RUNNER_TEMP/gate-03.sh"
          )
          git worktree remove --force /tmp/a35-gate3-historical
          for n in $(seq 4 27); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            bash "$script"
          done
          echo "GATE_C_SEQUENCE=1-27_COMPLETE"
          echo "GATE_C_TESTS_EXACT=27/27"
          echo "GATE_C_RESULT=PASS"

      - name: Final exact Gate C candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          mapfile -t cumulative < <(git diff --name-only "$A35_PARENT..$CANDIDATE" | sort)
          test "${#cumulative[@]}" -eq 2
          test "${cumulative[0]}" = 'src/tests/followup-cloud-persistence.test.ts'
          test "${cumulative[1]}" = 'src/tests/sync-conflict-ui.test.ts'
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -Ev '^src/tests/' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '\.sql$' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^supabase/migrations/' || true)"
          test -z "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^\.github/workflows/' || true)"
          echo "GATE_C_FINAL_SCOPE=PASS"
          echo "EXACT_CANDIDATE=$CANDIDATE"
          echo "PRODUCT_CHANGED_FILES=2"
          echo "RUNTIME_DELTA=0"
          echo "SQL_DELTA=0"
          echo "MIGRATION_DELTA=0"
          echo "PRODUCT_WORKFLOW_DELTA=0"
