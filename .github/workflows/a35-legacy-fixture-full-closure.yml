      - name: Security matrix exact candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$A35_PARENT"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          echo "SECURITY_REGRESSION_MATRIX=GREEN"

  gate-c:
    needs: security-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Exact candidate refs before Gate C
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$A35_PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --silent

      - name: Extract canonical historical Gate C 1-27 scripts
        shell: bash
        run: |
          set -euo pipefail
          git show "$VALIDATION_BASE:.github/workflows/a33-gate-c-final.yml" > "$RUNNER_TEMP/a33-gate-c-final.yml"
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each { |number, script| File.write(File.join(out, format('gate-%02d.sh', number)), script) }
          puts 'CANONICAL_GATE_COUNT=27'
          RUBY

      - name: Execute canonical Gate C 1-27 with historical Gate 3 control
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          bash "$RUNNER_TEMP/gate-01.sh"
          bash "$RUNNER_TEMP/gate-02.sh"
          rm -rf /tmp/a35-gate3-historical
          git worktree add --detach /tmp/a35-gate3-historical "$PRE_A34"
          (
            cd /tmp/a35-gate3-historical
            bash "$RUNNER_TEMP/gate-03.sh"
          )
          git worktree remove --force /tmp/a35-gate3-historical
          for n in $(seq 4 27); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            bash "$script"
          done
          echo "GATE_C_SEQUENCE=1-27_COMPLETE"
          echo "GATE_C_TESTS_EXACT=27/27"
          echo "GATE_C_RESULT=PASS"

      - name: Gate C exact candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"

  full-ci-browsers-evidence:
    needs: gate-c
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Exact candidate refs before Full CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$A35_PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Direct asset cache-bust CI check
        run: node scripts/verify-direct-asset-cache-bust.mjs --ci

      - name: Install dependencies
        run: npm ci --silent

      - name: Provision Chromium and WebKit
        shell: bash
        run: |
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          npx playwright install --with-deps chromium webkit

      - name: Build exact candidate
        run: npm run build --silent

      - name: Full CI including Chromium browser flows
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ci --silent 2>&1 | tee "$RUNNER_TEMP/full-ci.tap"
          echo "FULL_CI=PASS"
          echo "CHROMIUM=PASS"

      - name: Explicit WebKit and Leads reconciliation replay
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/leads-mobile-priority-webkit.test.js \
            dist/tests/leads-desktop-zero-training.test.js \
            dist/tests/leads-professional-redesign.test.js \
            dist/tests/direct-asset-cache-bust.test.js \
            2>&1 | tee "$RUNNER_TEMP/webkit-leads.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/webkit-leads.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/webkit-leads.tap"
          echo "WEBKIT=PASS"
          echo "LEADS_RECONCILIATION=PASS"

      - name: Verify mobile responsive generated evidence
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            artifacts/leads-mobile-webkit-validation \
            artifacts/leads-redesign \
            artifacts/leads-zero-training-phase1 \
            artifacts/leads-mobile-real-validation \
            artifacts/leads-desktop-zero-training \
            artifacts/leads-desktop-zero-training-webkit; do
            test -d "$directory"
            test "$(find "$directory" -maxdepth 1 -type f -name '*.png' | wc -l)" -gt 0
          done
          echo "MOBILE_RESPONSIVE_EVIDENCE=PASS"

      - name: Full CI exact candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"

  final-proof:
    needs: full-ci-browsers-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Final exact candidate scope and immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$A35_PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          mapfile -t changed < <(git diff --name-only "$A35_PARENT..$CANDIDATE" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/tests/sync-conflict-ui.test.ts'
          runtime_count="$(printf '%s\n' "${changed[@]}" | grep -Ev '^src/tests/' | wc -l)"
          sql_count="$(printf '%s\n' "${changed[@]}" | grep -E '\.sql$' | wc -l)"
          migration_count="$(printf '%s\n' "${changed[@]}" | grep -E '^supabase/migrations/' | wc -l)"
          workflow_count="$(printf '%s\n' "${changed[@]}" | grep -E '^\.github/workflows/' | wc -l)"
          test "$runtime_count" -eq 0
          test "$sql_count" -eq 0
          test "$migration_count" -eq 0
          test "$workflow_count" -eq 0
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/$A34_BRANCH | awk '{print $1}')" = "$A34_SHA"
          echo "EXACT_CANDIDATE=$CANDIDATE"
          echo "PARENT=$A35_PARENT"
          echo "CHANGED_FILES=src/tests/sync-conflict-ui.test.ts"
          echo "RUNTIME_DELTA=0"
          echo "SQL_DELTA=0"
          echo "MIGRATION_DELTA=0"
          echo "WORKFLOW_DELTA_IN_PRODUCT_CANDIDATE=0"
          echo "OFFICIAL_BRANCH_AFTER=$A35_PARENT"
          echo "MAIN_AFTER=$MAIN_SHA"
          echo "FULL_CLOSURE=GREEN"
          echo "A3.5=BLOCKED_AWAITING_CEREBRO"
          echo "MERGE=NO"
          echo "DEPLOY=NO"
          echo "SUPABASE_WRITE=NO"
          echo "RAILWAY_WRITE=NO"
          echo "SQL_APPLY=NO"
          echo "MIGRATIONS_APPLY=NO"
          echo "CLAUDE=NO"
