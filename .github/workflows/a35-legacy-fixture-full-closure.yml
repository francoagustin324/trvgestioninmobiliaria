name: SEC-FIX A3.5 FULL CLOSURE FINAL

on:
  push:
    branches: [validation/a35-full-closure-final-exact-6d2386]

permissions:
  contents: read

concurrency:
  group: sec-fix-a3-5-full-closure-final-exact-6d2386
  cancel-in-progress: false

env:
  CANDIDATE: 6d2386dcc1104a05770d1957cc450f49bf857934
  A35_PARENT: fdff36785e90197c9ef384394ad474d9787af72a
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence
  MAIN_SHA: 68034c60f606326a1d75fc3d448c7e99de49b492
  RELEASE_BRANCH: release/a34-webkit-572-reconciliation
  RELEASE_SHA: de091b9c98c33a31682cc77ede03313a8a66cb30
  A34_BRANCH: agent/sec-fix-a3-4-hydration-auth-fence
  A34_SHA: 7bb3bdadbe34717cdc8f4d9a6646f8a0b47db1cc
  VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
  PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
  A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
  A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
  A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
  A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
  ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Candidate ref integrity and clean scope precheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$A35_PARENT"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$A35_PARENT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/$A34_BRANCH | awk '{print $1}')" = "$A34_SHA"
          mapfile -t changed < <(git diff --name-only "$A35_PARENT..$CANDIDATE" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/tests/sync-conflict-ui.test.ts'
          test "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -Ev '^src/tests/' | wc -l)" -eq 0
          test "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '\.sql$' | wc -l)" -eq 0
          test "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^supabase/migrations/' | wc -l)" -eq 0
          test "$(git diff --name-only "$A35_PARENT..$CANDIDATE" | grep -E '^\.github/workflows/' | wc -l)" -eq 0
          echo "HEAD_EXACT=$CANDIDATE"
          echo "PARENT_EXACT=$A35_PARENT"
          echo "OFFICIAL_BRANCH_BEFORE=$A35_PARENT"
          echo "MAIN_BEFORE=$MAIN_SHA"
          echo "CHANGED_FILES=src/tests/sync-conflict-ui.test.ts"
          echo "RUNTIME_DELTA=0"
          echo "SQL_DELTA=0"
          echo "MIGRATION_DELTA=0"
          echo "WORKFLOW_DELTA_IN_PRODUCT_CANDIDATE=0"
          echo "INITIAL_CLEAN=PASS"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact candidate
        run: npm run build --silent

      - name: A3.5 A-G plus strict Control F classifier/runtime and ownerless G
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js \
            dist/tests/sec-fix-a3-5-ownerless-normalization.test.js \
            2>&1 | tee "$RUNNER_TEMP/a35.tap"
          grep -q '^# tests 9$' "$RUNNER_TEMP/a35.tap"
          grep -q '^# pass 9$' "$RUNNER_TEMP/a35.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/a35.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_VALID_TELEMETRY=ALLOWED' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_STALE_CRM=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_TENANT=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_ACTOR=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_MEMBER=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_CREATOR=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_CLIENT=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_GENERIC_ACTIVITY=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_MIXED_ROWS=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_A_NORMAL_DOWNGRADE=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_B_TEAM_VIEW_TAMPER_SYNC=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_C1_PRE_PROJECTION_AUTHORITY_FENCE=PASS' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_C2_PRE_PROJECTION_AUTHORITY_FENCE=PASS' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_D_SAME_AUTHORITY_OFFLINE_FALLBACK=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_E=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CRM_SNAPSHOT_POSTS=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_FORBIDDEN_RECORD_POSTS=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'NORMALIZED_ROLE=Corredor' "$RUNNER_TEMP/a35.tap"
          grep -q 'OWNER_COUNT=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_VIEW_ALL=NO' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_ACCESS_SETTINGS=NO' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_ADMINISTER_TEAM=NO' "$RUNNER_TEMP/a35.tap"
          echo "A35_A_G=GREEN"
          echo "CONTROL_F_CLASSIFIER=GREEN"
          echo "CONTROL_F_RUNTIME=GREEN"
          echo "OWNERLESS_G=GREEN"

      - name: A3.5 H-I and fresh empty-roster compatibility
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/tests/a35-owner-preservation-final.mjs <<'EOF'
          import './sec-fix-a1-2-c2-test-setup.js';
          import assert from 'node:assert/strict';
          import { initialData } from '../models.js';
          import { activateStorageForTenant, state } from '../store.js';
          import { canAccessSettings, canAdministerTeam, canViewAll } from '../team-access.js';
          import { writeTenantSnapshot } from '../tenant-storage.js';
          const ORG='00000000-0000-0000-0000-00000000a351';
          const AUTH='a35-preservation-auth';
          const OWNER='a35-preservation-owner';
          const scope=Object.freeze({userId:AUTH,organizationId:ORG});
          const member=(id,userId,role)=>({id,userId,name:userId,email:`${userId}@example.test`,role,status:'Activo',createdAt:'2026-09-14T00:00:00.000Z'});
          function crm(members){const v=structuredClone(initialData);v.organization={id:ORG,name:'A3.5 Preservation',seatLimit:null,planLabel:'validation'};v.teamMembers=members;v.activityLog=[];v.clients=[];v.properties=[];v.visits=[];v.offers=[];v.reservations=[];v.contacts=[];v.reminders=[];v.fichas=[];v.conversations=[];return v;}
          function seed(members){localStorage.clear();writeTenantSnapshot(scope,crm(members),{markDirty:false,reason:'a35-preservation',backup:false});activateStorageForTenant(scope);}
          seed([member(351,AUTH,'Corredor'),member(352,OWNER,'Dueño')]);
          assert.equal(state.crm.teamMembers.find(x=>x.userId===AUTH)?.role,'Corredor');
          assert.equal(state.crm.teamMembers.find(x=>x.userId===OWNER)?.role,'Dueño');
          assert.equal(state.crm.teamMembers.filter(x=>x.role==='Dueño').length,1);
          console.log('CONTROL_H_REAL_OWNER_PRESERVED=PASS_SAFE');
          seed([member(351,AUTH,'Dueño'),member(352,OWNER,'Corredor')]);
          assert.equal(state.crm.teamMembers.find(x=>x.userId===AUTH)?.role,'Dueño');
          assert.equal(state.crm.teamMembers.filter(x=>x.role==='Dueño').length,1);
          assert.equal(state.activeMemberId,351);assert.equal(canViewAll(),true);assert.equal(canAccessSettings(),true);assert.equal(canAdministerTeam(),true);
          console.log('CONTROL_I_REAL_OWNER_PRESERVED=PASS_SAFE');
          localStorage.clear();writeTenantSnapshot(scope,crm([]),{markDirty:false,reason:'a35-empty-roster',backup:false});activateStorageForTenant(scope);
          assert.equal(state.crm.teamMembers.length,initialData.teamMembers.length);
          assert.equal(state.crm.teamMembers[0]?.role,'Dueño');
          assert.equal(state.crm.teamMembers[0]?.userId,undefined);
          console.log('FRESH_EMPTY_ROSTER_INITIALDATA_COMPATIBILITY=PASS_SAFE');
          EOF
          node dist/tests/a35-owner-preservation-final.mjs 2>&1 | tee "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'CONTROL_H_REAL_OWNER_PRESERVED=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'CONTROL_I_REAL_OWNER_PRESERVED=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'FRESH_EMPTY_ROSTER_INITIALDATA_COMPATIBILITY=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          echo "A35_H_I=GREEN"
          echo "FRESH_EMPTY_ROSTER=GREEN"

      - name: A3.4 R1-R12 complete and exact R10
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js 2>&1 | tee "$RUNNER_TEMP/a34.tap"
          grep -q '^# tests 12$' "$RUNNER_TEMP/a34.tap"
          grep -q '^# pass 12$' "$RUNNER_TEMP/a34.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/a34.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/a34.tap"
          grep -Eq '^ok [0-9]+ - A3\.4 R10:' "$RUNNER_TEMP/a34.tap"
          echo "A34_R1_R12=GREEN"
          echo "R10=PASS"

      - name: A3.4 R11 x10 fresh Node processes
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            log="$RUNNER_TEMP/a34-r11-$n.tap"
            node --test --test-concurrency=1 --test-name-pattern='A3.4 R11:' dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js >"$log" 2>&1
            grep -q '^# pass 1$' "$log"
            grep -q '^# fail 0$' "$log"
            grep -Eq '^ok [0-9]+ - A3\.4 R11:' "$log"
            echo "R11_REPLAY=$n PASS"
          done
          echo "R11=10/10 PASS"
          echo "R11_HISTORICAL_RED=NON-REPRODUCED VALIDATION ANOMALY / CAUSE UNRESOLVED"

      - name: Auth and session generation regressions
        run: >-
          node --test --test-concurrency=1
          dist/tests/sec-fix-a1-fdr02-cross-tab-auth-generation.test.js
          dist/tests/sec-fix-a1-dr04-auth-refresh-epoch.test.js

      - name: Tenant hydration storage and async regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/sec-fix-a1-2-c1-tenant-hydration.test.js \
            dist/tests/sec-fix-a1-2-b-tenant-storage.test.js \
            dist/tests/sec-fix-a1-2-b-2-tenant-storage-boundary.test.js \
            dist/tests/sec-fix-a1-2-c2-tenant-async.test.js \
            dist/tests/sec-fix-a1-2-c3-stale-async.test.js \
            2>&1 | tee "$RUNNER_TEMP/tenant-storage.tap"
          grep -q '^# tests 81$' "$RUNNER_TEMP/tenant-storage.tap"
          grep -q '^# pass 81$' "$RUNNER_TEMP/tenant-storage.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/tenant-storage.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/tenant-storage.tap"
          echo "TENANT_HYDRATION_STORAGE=GREEN"

      - name: Tenant cloud context and data regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/cloud-api-compatible.test.js \
            dist/tests/cloud-records.test.js \
            dist/tests/cloud-remote-verification.test.js \
            dist/tests/cloud-save-serial.test.js \
            dist/tests/sec-fix-a1-dr02-cloud-writer-lease.test.js \
            dist/tests/sec-fix-a1-dr03-stale-sync-metadata.test.js \
            dist/tests/sec-fix-a3-2-authenticated-write-identity.test.js \
            dist/tests/sec-fix-a3-2-runtime-wiring.test.js \
            2>&1 | tee "$RUNNER_TEMP/tenant-cloud.tap"
          grep -q '^# tests 58$' "$RUNNER_TEMP/tenant-cloud.tap"
          grep -q '^# pass 58$' "$RUNNER_TEMP/tenant-cloud.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/tenant-cloud.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/tenant-cloud.tap"
          echo "TENANT_CLOUD_CONTEXT_DATA=GREEN"

      - name: DR-02 complete exact
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a1-dr02-cloud-writer-lease.test.js 2>&1 | tee "$RUNNER_TEMP/dr02.tap"
          grep -q '^# tests 12$' "$RUNNER_TEMP/dr02.tap"
          grep -q '^# pass 12$' "$RUNNER_TEMP/dr02.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/dr02.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/dr02.tap"
          echo "DR02=12/12 PASS"

      - name: DR-03 complete exact
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a1-dr03-stale-sync-metadata.test.js 2>&1 | tee "$RUNNER_TEMP/dr03.tap"
          grep -q '^# tests 6$' "$RUNNER_TEMP/dr03.tap"
          grep -q '^# pass 6$' "$RUNNER_TEMP/dr03.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/dr03.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/dr03.tap"
          echo "DR03=6/6 PASS"

      - name: Sync safety reconciliation and recovery aggregate
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/sync-safety.test.js \
            dist/tests/sync-reconciliation.test.js \
            dist/tests/sync-recovery-bootstrap.test.js \
            dist/tests/sec-fix-a1-2-f-recovery-async.test.js \
            dist/tests/sec-fix-a1-2-f-tenant-recovery-cutover.test.js \
            dist/tests/sec-fix-a1-fdr01-recovery-authority.test.js \
            2>&1 | tee "$RUNNER_TEMP/recovery.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/recovery.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/recovery.tap"
          echo "SYNC_SAFETY_RECONCILIATION_RECOVERY=GREEN"

      - name: sync-conflict-ui tenant-aware exact 4 of 4 and adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sync-conflict-ui.test.js 2>&1 | tee "$RUNNER_TEMP/sync-conflict.tap"
          grep -q '^# tests 4$' "$RUNNER_TEMP/sync-conflict.tap"
          grep -q '^# pass 4$' "$RUNNER_TEMP/sync-conflict.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/sync-conflict.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/sync-conflict.tap"
          grep -q 'el contrato estático tenant-aware rechaza regresiones legacy y pérdida de protecciones' "$RUNNER_TEMP/sync-conflict.tap"
          echo "SYNC_CONFLICT_UI=4/4 PASS"
          echo "ADVERSARIAL_MUTATION_CONTRACT=PASS"

      - name: A1.2-F F1-F24 exact
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a1-2-f-tenant-recovery-cutover.test.js 2>&1 | tee "$RUNNER_TEMP/f1-f24.tap"
          grep -q '^# tests 24$' "$RUNNER_TEMP/f1-f24.tap"
          grep -q '^# pass 24$' "$RUNNER_TEMP/f1-f24.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/f1-f24.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/f1-f24.tap"
          echo "A12F_F1_F24=GREEN"

      - name: FDR01 complete exact
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a1-fdr01-recovery-authority.test.js 2>&1 | tee "$RUNNER_TEMP/fdr01.tap"
          grep -q '^# tests 10$' "$RUNNER_TEMP/fdr01.tap"
          grep -q '^# pass 10$' "$RUNNER_TEMP/fdr01.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/fdr01.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/fdr01.tap"
