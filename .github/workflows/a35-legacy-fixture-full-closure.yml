          grep -q '^# tests 113$' "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# pass 113$' "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/gate-a.tap"
