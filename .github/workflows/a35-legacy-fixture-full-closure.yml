      - name: Static anti-bypass firewall exact 12 of 12
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a3-3-anti-bypass-static-guards.test.js 2>&1 | tee "$RUNNER_TEMP/firewall.tap"
          grep -q '^# tests 12$' "$RUNNER_TEMP/firewall.tap"
          grep -q '^# pass 12$' "$RUNNER_TEMP/firewall.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/firewall.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/firewall.tap"
          echo "STATIC_FIREWALL=12/12 PASS"

      - name: Gate B
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/team-management.test.js \
            dist/tests/team-policy.test.js \
            dist/tests/sec-fix-a1-2-e-team-tenant-authority.test.js \
            2>&1 | tee "$RUNNER_TEMP/gate-b.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/gate-b.tap"
          grep -q '^# cancelled 0$' "$RUNNER_TEMP/gate-b.tap"
