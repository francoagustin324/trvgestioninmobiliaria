name: SEC-FIX-A1.1 + C3 Integration Validation

on:
  push:
    branches:
      - validation/sec-fix-a1-1-plus-c3-integration
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  integration-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --silent
      - name: Provisionar WebKit Playwright
        run: |
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          npx playwright install --with-deps webkit
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar SEC-FIX-A1.1 PostgreSQL
        run: |
          set +e
          node --test --test-concurrency=1 \
            dist/tests/sec-fix-a1-1-org-aware-db-compat.test.js > a11-postgresql.log 2>&1
          code=$?
          cat a11-postgresql.log
          exit $code
      - name: Ejecutar targeted A+B+C1+C2+C3
        run: |
          set +e
          node --test --test-concurrency=1 \
            dist/tests/sec-fix-a1-2-c3-stale-async.test.js \
            dist/tests/sec-fix-a1-2-c2-tenant-async.test.js \
            dist/tests/sec-fix-a1-2-c1-gate-closure.test.js \
            dist/tests/sec-fix-a1-2-c1-tenant-hydration.test.js \
            dist/tests/sec-fix-a1-2-a-active-organization.test.js \
            dist/tests/sec-fix-a1-2-b-tenant-storage.test.js \
            dist/tests/sec-fix-a1-2-b-2-tenant-storage-boundary.test.js \
            dist/tests/cloud-save-serial.test.js \
            dist/tests/automatic-save.test.js \
            dist/tests/sync-safety.test.js \
            dist/tests/sync-reconciliation.test.js \
            dist/tests/cloud-api-compatible.test.js \
            dist/tests/cloud-records.test.js \
            dist/tests/sync-recovery-bootstrap.test.js \
            dist/tests/mvp-scope.test.js \
            dist/tests/invitation-auth-flow.test.js \
            dist/tests/b0-1-membership-security.test.js \
            dist/tests/b0-3-user-onboarding.test.js > integration-targeted.log 2>&1
          code=$?
          cat integration-targeted.log
          exit $code
      - name: Guardar diagnósticos integración
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sec-fix-a1-1-plus-c3-integration-diagnostics
          path: |
            a11-postgresql.log
            integration-targeted.log
          if-no-files-found: warn
          retention-days: 3
