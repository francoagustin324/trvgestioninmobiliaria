name: P1.4-A2.1 Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - src/property-opportunities.css
      - src/property-opportunities-ui.ts
      - src/tests/p1-4-a2-1-opportunities-visual-browser.test.ts
      - .github/workflows/p1-4-a2-1-visual-qa.yml
  workflow_dispatch:

concurrency:
  group: p1-4-a2-1-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opportunities-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar QA visual P1.4-A2.1
        run: node --test --test-concurrency=1 dist/tests/p1-4-a2-1-opportunities-visual-browser.test.js
      - name: Verificar capturas P1.4-A2.1
        run: |
          set -euo pipefail
          directory="artifacts/p1-4-a2-1-opportunities"
          expected=(
            desktop-1366x768.png
            desktop-1366x768-full-component.png
            desktop-1440x900.png
            mobile-390x844.png
            mobile-390x844-full-component.png
            mobile-360x800.png
          )
          test -d "$directory"
          test "$(find "$directory" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "$directory/$file"
          done
      - name: Adjuntar capturas P1.4-A2.1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-4-a2-1-opportunities-visual
          path: artifacts/p1-4-a2-1-opportunities
          if-no-files-found: error
          retention-days: 14
