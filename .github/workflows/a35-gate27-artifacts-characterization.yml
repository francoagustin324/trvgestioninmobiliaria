name: SEC-FIX A3.5 Gate 27 Artifacts Causal Characterization

on:
  push:
    branches:
      - validation/a35-gate27-artifacts-characterization

permissions:
  contents: read

concurrency:
  group: a35-gate27-artifacts-characterization
  cancel-in-progress: false

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE: 4226db2d10e47a3082a0b1dc1b22239bedbd72ae
      OFFICIAL_A35: fdff36785e90197c9ef384394ad474d9787af72a
      MAIN_SHA: 68034c60f606326a1d75fc3d448c7e99de49b492
      RELEASE_SHA: de091b9c98c33a31682cc77ede03313a8a66cb30
      VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
      PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
      A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
      A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
      A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
      ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: 4226db2d10e47a3082a0b1dc1b22239bedbd72ae
          fetch-depth: 0

      - name: Prove immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          test "$(git ls-remote origin refs/heads/agent/sec-fix-a3-5-stale-role-fallback-fence | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          git diff --quiet
          git diff --cached --quiet
          echo "EXACT_CANDIDATE=$(git rev-parse HEAD)"
          echo "OFFICIAL_A3_5=$OFFICIAL_A35"
          echo "MAIN=$MAIN_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Exhaustive tracked static inventory before generation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ARTIFACTS_STATIC_REFERENCES ==='
          git grep -n -I -E '(^|[^[:alnum:]_])artifacts/?([^[:alnum:]_]|$)' -- . > /tmp/artifacts-static.txt || true
          cat /tmp/artifacts-static.txt
          echo "ARTIFACTS_STATIC_REFERENCE_COUNT=$(wc -l < /tmp/artifacts-static.txt | tr -d ' ')"
          echo '=== FILESYSTEM_WRITER_REFERENCES ==='
          git grep -n -I -E 'mkdirSync|mkdir\(|writeFileSync|writeFile\(|copyFileSync|copyFile\(|spawnSync|spawn\(|execSync|exec\(|process\.cwd\(\)|(^|[[:space:]])cp[[:space:]]' -- src scripts package.json .github/workflows > /tmp/fs-writers.txt || true
          cat /tmp/fs-writers.txt
          echo "FILESYSTEM_WRITER_REFERENCE_COUNT=$(wc -l < /tmp/fs-writers.txt | tr -d ' ')"
          test ! -e artifacts
          echo 'ARTIFACTS_ABSENT_BEFORE_NPM_CI=YES'

      - name: Install validation dependencies and prove no artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          git status --porcelain --untracked-files=normal
          if test -e artifacts; then echo 'ARTIFACTS_PRESENT_AFTER_NPM_CI=YES'; exit 1; fi
          echo 'ARTIFACTS_ABSENT_AFTER_NPM_CI=YES'

      - name: Extract canonical historical Gate C 1-27 scripts
        shell: bash
        run: |
          set -euo pipefail
          git show "$VALIDATION_BASE:.github/workflows/a33-gate-c-final.yml" > "$RUNNER_TEMP/a33-gate-c-final.yml"
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each { |number, script| File.write(File.join(out, format('gate-%02d.sh', number)), script) }
          puts 'CANONICAL_GATE_COUNT=27'
          RUBY
          echo '=== CANONICAL_GATE_27 ==='
          cat "$RUNNER_TEMP/gate-27.sh"
          if test -e artifacts; then echo 'ARTIFACTS_PRESENT_AFTER_HARNESS_EXTRACTION=YES'; exit 1; fi
          echo 'ARTIFACTS_ABSENT_AFTER_HARNESS_EXTRACTION=YES'

      - name: Execute canonical Gates 1-26 with external artifacts observability
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL

          observe() {
            phase="$1"
            n="$2"
            echo "=== ${phase}_GATE_${n} ==="
            git status --porcelain --untracked-files=normal
            if test -e artifacts; then
              echo "ARTIFACTS_${phase}_GATE_${n}=PRESENT"
            else
              echo "ARTIFACTS_${phase}_GATE_${n}=ABSENT"
            fi
          }

          capture_artifacts() {
            echo '=== ARTIFACTS_FIRST_CONTENTS_BEGIN ==='
            find artifacts -maxdepth 5 -type f -printf '%p\t%s bytes\n' | sort
            file_count="$(find artifacts -type f | wc -l | tr -d ' ')"
            total_bytes="$(find artifacts -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
            echo "ARTIFACTS_FILE_COUNT=$file_count"
            echo "ARTIFACTS_TOTAL_BYTES=$total_bytes"
            while IFS= read -r -d '' f; do
              size="$(stat -c '%s' "$f")"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              mime="$(file -b --mime-type "$f" || true)"
              echo "ARTIFACT_FILE=$f SIZE=$size SHA256=$sha MIME=$mime"
              case "$mime" in
                text/*|application/json|application/xml|application/javascript)
                  echo "--- TEXT_PREVIEW $f ---"
                  head -n 200 "$f" | sed -E 's/((access|refresh)[_-]?token|authorization|api[_-]?key|secret|password)[[:space:]]*[:=][[:space:]]*[^,[:space:]]+/\1=[REDACTED]/Ig'
                  echo "--- END_TEXT_PREVIEW $f ---"
                  ;;
              esac
            done < <(find artifacts -maxdepth 5 -type f -print0 | sort -z)
            echo '=== ARTIFACTS_FIRST_CONTENTS_END ==='
          }

          FIRST_GATE=''
          for n in $(seq 1 26); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            observe BEFORE "$n"
            if test "$n" = '3'; then
              rm -rf /tmp/a35-gate3-historical
              git worktree add --detach /tmp/a35-gate3-historical "$PRE_A34"
              (
                cd /tmp/a35-gate3-historical
                bash "$script"
              )
              git worktree remove --force /tmp/a35-gate3-historical
            else
              bash "$script"
            fi
            observe AFTER "$n"
            if test -z "$FIRST_GATE" && test -e artifacts; then
              FIRST_GATE="$n"
              echo "ARTIFACTS_FIRST_PRESENT_AFTER_GATE=$FIRST_GATE"
              capture_artifacts
            fi
          done
          echo "ARTIFACTS_FIRST_GATE_FINAL=$FIRST_GATE"
          test -n "$FIRST_GATE"
          printf '%s\n' "$FIRST_GATE" > /tmp/artifacts-first-gate

      - name: Isolate creator within first Gate
        shell: bash
        run: |
          set -euo pipefail
          first="$(cat /tmp/artifacts-first-gate)"
          printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$first"
          echo "ARTIFACTS_CREATOR_GATE=$first"
          echo '=== FIRST_GATE_SCRIPT ==='
          cat "$script"
          mapfile -t entrypoints < <(grep -oE 'dist/tests/[A-Za-z0-9._/-]+\.test\.js' "$script" | awk '!seen[$0]++')
          printf 'FIRST_GATE_TEST_ENTRYPOINTS=%s\n' "${entrypoints[*]:-NONE}"

          if test "${#entrypoints[@]}" -eq 0; then
            echo 'ARTIFACTS_CREATOR_ENTRYPOINT=NO_TEST_ENTRYPOINTS_IN_GATE'
            exit 0
          fi

          creator=''
          index=0
          for ep in "${entrypoints[@]}"; do
            index=$((index+1))
            wt="/tmp/a35-artifacts-isolate-$index"
            rm -rf "$wt"
            git worktree add --detach "$wt" "$CANDIDATE"
            (
              cd "$wt"
              npm ci --silent
              npm run build >/tmp/a35-isolate-build-$index.log 2>&1
              if test -e artifacts; then
                echo "ISOLATION_BASELINE_ARTIFACTS_PRESENT_BEFORE_ENTRYPOINT=$ep"
                exit 91
              fi
              echo "ISOLATION_BEFORE_ENTRYPOINT=$ep ABSENT"
              set +e
              node --test --test-concurrency=1 "$ep" > "/tmp/a35-isolate-test-$index.log" 2>&1
              rc=$?
              set -e
              cat "/tmp/a35-isolate-test-$index.log"
              echo "ISOLATION_ENTRYPOINT_RC=$rc ENTRYPOINT=$ep"
              if test -e artifacts; then
                echo "ARTIFACTS_CREATED_BY_ENTRYPOINT=$ep"
                find artifacts -maxdepth 5 -type f -printf '%p\t%s bytes\n' | sort
                while IFS= read -r -d '' f; do
                  echo "ISOLATED_ARTIFACT_FILE=$f SHA256=$(sha256sum "$f" | awk '{print $1}') SIZE=$(stat -c '%s' "$f")"
                done < <(find artifacts -maxdepth 5 -type f -print0 | sort -z)
                printf '%s\n' "$ep" > "/tmp/a35-creator-entrypoint-$index"
              else
                echo "ARTIFACTS_AFTER_ENTRYPOINT=$ep ABSENT"
              fi
            )
            if test -f "/tmp/a35-creator-entrypoint-$index"; then
              creator="$ep"
              cp "/tmp/a35-creator-entrypoint-$index" /tmp/a35-creator-entrypoint
            fi
            git worktree remove --force "$wt"
          done

          if test -n "$creator"; then
            echo "ARTIFACTS_CREATOR_ENTRYPOINT=$creator"
          else
            echo 'ARTIFACTS_CREATOR_ENTRYPOINT=NOT_ISOLATED_BY_ENTRYPOINT'
          fi

      - name: Static causal context and historical comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/a35-creator-entrypoint; then
            ep="$(cat /tmp/a35-creator-entrypoint)"
            source_path="src/tests/${ep#dist/tests/}"
            source_path="${source_path%.js}.ts"
            echo "CREATOR_SOURCE_PATH=$source_path"
            echo '=== CREATOR_SOURCE_FS_CONTEXT ==='
            grep -n -C 12 -E 'artifacts/?|mkdirSync|mkdir\(|writeFileSync|writeFile\(|copyFileSync|copyFile\(|spawnSync|spawn\(|execSync|exec\(|process\.cwd\(\)' "$source_path" || true
            echo "CANDIDATE_CREATOR_BLOB=$(git rev-parse "$CANDIDATE:$source_path")"
            if git cat-file -e "$RELEASE_SHA:$source_path" 2>/dev/null; then
              echo "RELEASE_CREATOR_BLOB=$(git rev-parse "$RELEASE_SHA:$source_path")"
              echo '=== RELEASE_CREATOR_FS_CONTEXT ==='
              git show "$RELEASE_SHA:$source_path" | grep -n -C 12 -E 'artifacts/?|mkdirSync|mkdir\(|writeFileSync|writeFile\(|copyFileSync|copyFile\(|spawnSync|spawn\(|execSync|exec\(|process\.cwd\(\)' || true
            else
              echo 'RELEASE_CREATOR_SOURCE=ABSENT'
            fi
            if git cat-file -e "$VALIDATION_BASE:$source_path" 2>/dev/null; then
              echo "VALIDATION_BASE_CREATOR_BLOB=$(git rev-parse "$VALIDATION_BASE:$source_path")"
              echo '=== VALIDATION_BASE_CREATOR_FS_CONTEXT ==='
              git show "$VALIDATION_BASE:$source_path" | grep -n -C 12 -E 'artifacts/?|mkdirSync|mkdir\(|writeFileSync|writeFile\(|copyFileSync|copyFile\(|spawnSync|spawn\(|execSync|exec\(|process\.cwd\(\)' || true
            else
              echo 'VALIDATION_BASE_CREATOR_SOURCE=ABSENT'
            fi
          else
            echo 'CREATOR_SOURCE_PATH=UNKNOWN'
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/agent/sec-fix-a3-5-stale-role-fallback-fence | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          echo 'NO_PRODUCT_MUTATION=PASS'
