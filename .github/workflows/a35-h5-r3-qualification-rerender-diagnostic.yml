name: A3.5 H5 R3 Qualification Rerender Diagnostic
on:
  push:
    branches:
      - validation/a35-h5-r3-test-harness-fixes
    paths:
      - scripts/a35-h5-r3-qualification-rerender-diagnostic.mjs
      - .github/workflows/a35-h5-r3-qualification-rerender-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - run: npm run build --silent
      - run: node scripts/a35-h5-r3-qualification-rerender-diagnostic.mjs
      - name: Run instrumented test preserving current assertion
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 dist/tests/b1-2-3-compact-leads-real-app.r3diag.test.js | tee "$RUNNER_TEMP/r3-qualification.tap"
          code=${PIPESTATUS[0]}
          echo "R3_DIAGNOSTIC_EXIT=$code"
          grep 'R3_QUALIFICATION_NODE_BEFORE=' "$RUNNER_TEMP/r3-qualification.tap"
          grep 'R3_QUALIFICATION_NODE_AFTER_OLD=' "$RUNNER_TEMP/r3-qualification.tap"
          grep 'R3_QUALIFICATION_NODE_AFTER_CURRENT=' "$RUNNER_TEMP/r3-qualification.tap"
          grep 'R3_QUALIFICATION_SAME_NODE=' "$RUNNER_TEMP/r3-qualification.tap"
          grep 'OLD_NODE_REPLACED_BY_VALID_RERENDER=' "$RUNNER_TEMP/r3-qualification.tap"
          exit 0
