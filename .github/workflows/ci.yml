name: TRV CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-2-3-compact-prioritized-leads
      - name: Alinear pruebas relacionadas
        run: |
          python scripts/b1-2-3-align-tests.py
          python scripts/b1-2-3-zindex-fix.py
          git config user.name "PropControl CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/mvp-leads-ui.ts src/lead-list-compact.css src/tests/b1-2-1-essential-qualification.test.ts src/tests/b1-2-lead-qualification.test.ts src/tests/mobile-leads-polish.test.ts src/tests/mvp-leads-heading.test.ts src/tests/b1-2-3-compact-leads-real-app.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Asegurar acciones de seguimiento accesibles"
            git push origin HEAD:agent/b1-2-3-compact-prioritized-leads
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar prueba aislada B1.2.3
        run: |
          set +e
          node --test --test-concurrency=1 dist/tests/b1-2-3-compact-leads-real-app.test.js > b1-2-3-isolated.log 2>&1
          code=$?
          cat b1-2-3-isolated.log
          exit $code
      - name: Ejecutar suite completa
        run: |
          set +e
          npm test --silent > full-suite.log 2>&1
          code=$?
          cat full-suite.log
          exit $code
      - name: Guardar prueba aislada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-3-isolated-diagnostics
          path: b1-2-3-isolated.log
          retention-days: 1
      - name: Guardar suite completa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-3-full-suite-diagnostics
          path: full-suite.log
          retention-days: 1
      - name: Guardar screenshots B1.2.3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-3-compact-leads-screenshots
          path: artifacts/b1-2-3-compact-leads/*.png
          if-no-files-found: error
          retention-days: 7
