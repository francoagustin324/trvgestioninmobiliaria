name: TRV CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/b1-2-3-leads-compact-priority]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-2-3-leads-compact-priority
      - name: Aplicar B1.2.3
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/b1-2-3-apply.py')
          text = path.read_text()
          text = text.replace('text = re.sub(r"function card\\(client: Client\\): string \\{.*?\\n\\}", card, text, count=1, flags=re.S)', 'text = re.sub(r"function card\\(client: Client\\): string \\{.*?\\n\\}", lambda _match: card, text, count=1, flags=re.S)')
          text = text.replace('text = re.sub(r"function filterPanel\\(\\): string \\{.*?\\n\\}", panel, text, count=1, flags=re.S)', 'text = re.sub(r"function filterPanel\\(\\): string \\{.*?\\n\\}", lambda _match: panel, text, count=1, flags=re.S)')
          path.write_text(text)
          PY
          python scripts/b1-2-3-apply.py
          git config user.name "PropControl CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src docs
          if ! git diff --cached --quiet; then
            git commit -m "Implementar Leads compactos y priorizados B1.2.3"
            git push origin HEAD:agent/b1-2-3-leads-compact-priority
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar pruebas
        run: npm test --silent
