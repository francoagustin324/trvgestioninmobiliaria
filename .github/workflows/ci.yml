name: TRV CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr140-migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-phase1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leads-zero-training-ux-phase1
          fetch-depth: 0
      - name: Verificar base autorizada
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "06ffe54075e8b1b0fd11eed09bffa5a83f2dfc68"
      - name: Migrar pruebas históricas al contrato FASE 1
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/document.querySelector<HTMLElement>.*data-whatsapp-manual-register/s/replace_once/replace_all/' .github/pr140_migrate.py
          python3 .github/pr140_migrate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/tests/followup-cloud-persistence-browser.test.ts')
          text = p.read_text()
          old = "    assert.equal((await crmFromStorage(page)).clients[0]?.nextFollowUp, FOLLOW_UP_DATE);"
          new = "    assert.equal(await page.evaluate((key) => (JSON.parse(localStorage.getItem(key) || '{}') as CrmData).clients[0]?.nextFollowUp, STORAGE_KEY), FOLLOW_UP_DATE);"
          if text.count(old) != 1:
              raise SystemExit(f'followup cloud local read: esperado 1, encontrado {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Validar compilación del árbol migrado
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent
          npm run build --silent
      - name: Guardar sólo pruebas migradas en la rama
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "06ffe54075e8b1b0fd11eed09bffa5a83f2dfc68"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests
          git diff --cached --check
          git commit -m "Migrar regresiones a UX cero capacitación"
          git push origin HEAD:agent/leads-zero-training-ux-phase1
