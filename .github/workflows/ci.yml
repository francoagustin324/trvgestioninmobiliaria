name: PR 137 finalización técnica

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr137-finalizacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-correcciones:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leads-ux-ui-professional-redesign
          fetch-depth: 0
      - name: Aplicar correcciones finales verificadas
        run: bash scripts/apply-pr137-final.sh
