name: PR 137 finalización técnica

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr137-finalizacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-correcciones:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leads-ux-ui-professional-redesign
          fetch-depth: 0
      - name: Aplicar correcciones finales verificadas
        run: |
          set +e
          bash -x scripts/apply-pr137-final.sh > apply-pr137.log 2>&1
          code=$?
          cat apply-pr137.log
          exit $code
      - name: Adjuntar diagnóstico de finalización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr137-finalizacion-diagnostico
          path: apply-pr137.log
          if-no-files-found: error
          retention-days: 1
