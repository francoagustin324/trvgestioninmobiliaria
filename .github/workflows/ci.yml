name: TRV CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-2-2-mobile-leads-critical-fix
      - name: Medir foco sin intervenir el scroll
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tests/b1-2-2-mobile-leads-real-app.test.ts')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'element.scrollIntoView' in line and 'textarea.evaluate' in line]
          if len(matches) != 1:
              raise SystemExit(f'Cantidad inesperada de scrollIntoView del textarea: {len(matches)}')
          index = matches[0]
          if index + 1 >= len(lines) or 'page.waitForTimeout(50)' not in lines[index + 1]:
              raise SystemExit('La espera esperada no sigue a scrollIntoView.')
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index:index + 2] = [f'{indent}await page.waitForTimeout(550);']
          path.write_text('\n'.join(lines) + '\n')
          PY
          git config user.name "PropControl CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/tests/b1-2-2-mobile-leads-real-app.test.ts
          git commit -m "Medir foco móvil sin scroll artificial B1.2.2"
          git push origin HEAD:agent/b1-2-2-mobile-leads-critical-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        id: build
        run: |
          set +e
          npm run build --silent > build.log 2>&1
          code=$?
          cat build.log
          exit $code
      - name: Guardar diagnóstico de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 1
      - name: Ejecutar pruebas
        run: |
          set +e
          npm test --silent > test.log 2>&1
          code=$?
          cat test.log
          exit $code
      - name: Guardar diagnóstico B1.2.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-2-test-diagnostics
          path: test.log
          retention-days: 1
      - name: Guardar screenshots B1.2.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-2-mobile-leads-screenshots
          path: artifacts/b1-2-2-mobile-leads/*.png
          if-no-files-found: ignore
          retention-days: 7
