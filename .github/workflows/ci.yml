name: TRV CI

on:
  push:
    branches:
      - feature/ordenbroker-block2g-daily-operations-zero-training
  workflow_dispatch:

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verificar source SHA
        run: |
          set -euo pipefail
          echo "BLOCK2G_FOCAL_HEAD=$(git rev-parse HEAD)"
          git diff --check HEAD^..HEAD
      - name: Verificar cache-busting
        run: node scripts/verify-direct-asset-cache-bust.mjs --ci
      - name: Instalar dependencias
        run: npm ci --silent
      - name: Provisionar WebKit Playwright
        run: |
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          npx playwright install --with-deps webkit
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Focal Block 2G + contratos ejecutables en modo focal
        run: |
          node --test --test-concurrency=1 \
            dist/tests/block2g-daily-operations.test.js \
            dist/tests/b1-4-1-supervised-attention-queue.test.js \
            dist/tests/property-matching-ui.test.js
      - name: Diagnóstico focal geometría real
        run: node --test --test-concurrency=1 dist/tests/leads-desktop-zero-training.test.js
      - name: Regresión concurrencia 2F
        run: node --test --test-concurrency=1 dist/tests/block2f-concurrency-static.test.js
