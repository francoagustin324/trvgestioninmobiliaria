name: TRV CI

on:
  push:
    branches:
      - security/ordenbroker-block2f-multidevice-concurrency-cas
  workflow_dispatch:

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verificar source SHA
        run: |
          set -euo pipefail
          echo "FOCAL_CI_HEAD=$(git rev-parse HEAD)"
      - name: Verificar cache-busting
        run: node scripts/verify-direct-asset-cache-bust.mjs --ci
      - name: Instalar dependencias
        run: npm ci --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar rollback 2D aislado
        run: node --test --test-concurrency=1 --test-name-pattern='2D fallos de persistencia revierten Visita Oferta Reserva y Cierre sin éxito falso' dist/tests/block2d-commercial-e2e-browser.test.js
