name: TRV CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar integración causal PR #137
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/leads-ux-ui-professional-redesign'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          node scripts/apply-pr137-render-integration.mjs
          git checkout "origin/$BRANCH" -- .github/workflows/ci.yml scripts/apply-pr137-render-integration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/leads-professional-redesign.ts src/leads-professional-redesign-blocking-fix.ts src/leads-professional-redesign-final-fix.css src/mvp-leads-ui.ts src/tests/leads-professional-redesign.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integrar render determinístico y corregir regresiones de Leads"
          git push origin HEAD:"$BRANCH"
      - name: Adjuntar snapshot temporal del PR
        uses: actions/upload-artifact@v4
        with:
          name: pr-source-snapshot
          path: |
            src
            index.html
            package.json
            package-lock.json
            tsconfig.json
            .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        id: build
        run: |
          set +e
          npm run build --silent > build.log 2>&1
          code=$?
          cat build.log
          exit $code
      - name: Guardar diagnóstico de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 1
      - name: Ejecutar pruebas
        run: |
          set +e
          npm test --silent > test.log 2>&1
          code=$?
          cat test.log
          exit $code
      - name: Guardar diagnóstico de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          retention-days: 3
      - name: Adjuntar capturas reales B1.3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-3-capturas-reales
          path: artifacts/b1-3
          if-no-files-found: ignore
          retention-days: 14
      - name: Adjuntar capturas reales B1.3.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-3-1-capturas-reales
          path: artifacts/b1-3-1
          if-no-files-found: ignore
          retention-days: 14
      - name: Adjuntar capturas reales B1.3.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-3-2-capturas-reales
          path: artifacts/b1-3-2
          if-no-files-found: ignore
          retention-days: 14
      - name: Adjuntar capturas reales B1.3.3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-3-3-capturas-reales
          path: artifacts/b1-3-3
          if-no-files-found: ignore
          retention-days: 14
      - name: Verificar capturas rediseño profesional de Leads
        if: always()
        run: |
          test -d artifacts/leads-redesign
          test "$(find artifacts/leads-redesign -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
      - name: Adjuntar capturas rediseño profesional de Leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-professional-redesign-capturas
          path: artifacts/leads-redesign
          if-no-files-found: error
          retention-days: 14
