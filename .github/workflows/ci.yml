name: TRV CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/b1-2-3-leads-compact-priority]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-2-3-leads-compact-priority
      - name: Limpiar aplicación B1.2.3
        run: |
          python scripts/b1-2-3-clean.py
          git config user.name "PropControl CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/mvp-leads-ui.ts
          if ! git diff --cached --quiet; then
            git commit -m "Corregir aplicación idempotente B1.2.3"
            git push origin HEAD:agent/b1-2-3-leads-compact-priority
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar pruebas
        run: npm test --silent
