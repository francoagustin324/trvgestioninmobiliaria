name: TRV CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar suite completa
        run: |
          set +e
          npm test --silent > full-suite.log 2>&1
          code=$?
          cat full-suite.log
          exit $code
      - name: Guardar diagnóstico completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-2-full-suite-diagnostics
          path: full-suite.log
          retention-days: 1
      - name: Guardar screenshots completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-2-mobile-leads-screenshots
          path: artifacts/b1-2-2-mobile-leads/*.png
          if-no-files-found: ignore
          retention-days: 7
