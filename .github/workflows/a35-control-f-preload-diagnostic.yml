name: A3.5 Control F Preload Diagnostic

on:
  push:
    branches: [validation/a35-control-f-post-causal-characterization]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE: beb8876c4fd72f9c73f0a01b8022970a720d4581
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Exact immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
      - name: Install dependencies
        run: npm ci --silent
      - name: Inspect Playwright BrowserType hook surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const own = Object.getOwnPropertyDescriptor(chromium, 'launch');
          const proto = Object.getPrototypeOf(chromium);
          const inherited = Object.getOwnPropertyDescriptor(proto, 'launch');
          console.log('OWN_LAUNCH_DESCRIPTOR=' + JSON.stringify(own, (k,v) => typeof v === 'function' ? `[Function ${v.name}]` : v));
          console.log('PROTO_NAME=' + proto?.constructor?.name);
          console.log('PROTO_LAUNCH_DESCRIPTOR=' + JSON.stringify(inherited, (k,v) => typeof v === 'function' ? `[Function ${v.name}]` : v));
          console.log('OWN_EXTENSIBLE=' + Object.isExtensible(chromium));
          console.log('PROTO_EXTENSIBLE=' + Object.isExtensible(proto));
          EOF
      - name: Reproduce original preload failure visibly
        shell: bash
        run: |
          set +e
          cat > "$RUNNER_TEMP/original-preload.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const realLaunch = chromium.launch.bind(chromium);
          Object.defineProperty(chromium, 'launch', {
            configurable: true,
            value: async (...args) => realLaunch(...args),
          });
          EOF
          NODE_OPTIONS="--import=$RUNNER_TEMP/original-preload.mjs" node -e "console.log('ORIGINAL_PRELOAD_OK')" >"$RUNNER_TEMP/original.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/original.log"
          echo "ORIGINAL_PRELOAD_RC=$rc"
          set -e
      - name: Validate prototype hook alternative
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proto-preload.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const proto = Object.getPrototypeOf(chromium);
          const original = proto.launch;
          if (typeof original !== 'function') throw new Error('BrowserType prototype launch unavailable');
          async function a35WrappedLaunch(...args) {
            return original.apply(this, args);
          }
          a35WrappedLaunch.__a35Wrapped = true;
          proto.launch = a35WrappedLaunch;
          EOF
          NODE_OPTIONS="--import=$RUNNER_TEMP/proto-preload.mjs" node --input-type=module -e "import { chromium } from 'playwright'; console.log('PROTO_HOOK_ACTIVE=' + String(chromium.launch.__a35Wrapped === true));"
      - name: Final immutable proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          echo 'RUNTIME_DELTA=0'
