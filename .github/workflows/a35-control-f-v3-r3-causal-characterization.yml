name: A3.5 Control F V3 R3 Causal Characterization

on:
  push:
    branches: [validation/a35-control-f-post-causal-characterization]

permissions:
  contents: read

env:
  CANDIDATE: beb8876c4fd72f9c73f0a01b8022970a720d4581
  PARENT: 295fd37f1b0a6229176b66ed25a74ca45c52b291
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence
  VALIDATION_BRANCH: validation/a35-control-f-post-causal-characterization
  V2_SOURCE_PATH: .github/validation/a35-control-f-v2-source.yml

jobs:
  causal-v3-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Phase 0 immutable proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          ! git symbolic-ref -q HEAD >/dev/null 2>&1
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          echo "VALIDATION_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PHASE0_HEAD=$CANDIDATE"
          echo "PHASE0_PRODUCT_BRANCH_IMMUTABLE=YES"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          npx playwright install --with-deps chromium
          npm run build --silent

      - name: Prepare V2 instrumentation in runner temp
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/a35-evidence"
          TRACE="$RUNNER_TEMP/a35-v3-traces"
          PRELOAD="$RUNNER_TEMP/a35-control-f-v3-preload.mjs"
          SOURCE="$RUNNER_TEMP/a35-control-f-v2-source.yml"
          mkdir -p "$EVIDENCE" "$TRACE"
          echo "A35_EVIDENCE_DIR=$EVIDENCE" >> "$GITHUB_ENV"
          echo "A35_TRACE_DIR=$TRACE" >> "$GITHUB_ENV"
          echo "A35_PRELOAD=$PRELOAD" >> "$GITHUB_ENV"
          git fetch --quiet origin "$VALIDATION_BRANCH"
          git show "origin/$VALIDATION_BRANCH:$V2_SOURCE_PATH" > "$SOURCE"
          python - "$SOURCE" "$PRELOAD" <<'PY'
          import pathlib,re,sys,textwrap
          source=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          marker='          cat > "$PRELOAD" <<\'EOF\'\n'
          start=source.find(marker)
          if start < 0: raise SystemExit('V2 preload start marker not found')
          start += len(marker)
          end=source.find('          EOF\n', start)
          if end < 0: raise SystemExit('V2 preload end marker not found')
          body=textwrap.dedent(source[start:end])
          old="import { chromium } from 'playwright';"
          new="import { createRequire } from 'node:module';\nconst { chromium } = createRequire(process.cwd() + '/package.json')('playwright');"
          if old not in body: raise SystemExit('playwright import marker missing')
          body=body.replace(old,new,1)
          old="record('fetch-end', { requestId: id, method, url, status: response.status, dirtyAfter: dirty(), snapshot: snapshot() });"
          new="let responseBody = null;\n        try { responseBody = await response.clone().text(); } catch {}\n        record('fetch-end', { requestId: id, method, url, status: response.status, responseBody, dirtyAfter: dirty(), snapshot: snapshot() });"
          if old not in body: raise SystemExit('fetch-end line marker missing')
          body=body.replace(old,new,1)
          old="const ends = new Map(events.filter((e) => e.type === 'fetch-end').map((e) => [e.requestId, e]));"
          new="""const ends = new Map(events.filter((e) => e.type === 'fetch-end').map((e) => [e.requestId, e]));
        const recordsGet = starts.find((e) => e.method === 'GET' && String(e.url).includes('/rest/v1/propcontrol_records'));
        let cloudAfterProbe = null;
        if (recordsGet?.url) {
          try {
            cloudAfterProbe = await page.evaluate(async (url) => {
              const response = await fetch(url, { headers: { 'x-a35-v3-probe': 'cloud-after' } });
              const text = await response.text();
              let json = null;
              try { json = JSON.parse(text); } catch {}
              return { url, status: response.status, body: text, json };
            }, recordsGet.url);
          } catch (error) { cloudAfterProbe = { error: String(error) }; }
        }"""
          if old not in body: raise SystemExit('ends marker missing')
          body=body.replace(old,new,1)
          old="const result = {\n          label: LABEL,"
          new="const result = {\n          label: LABEL,\n          processPid: process.pid,\n          cloudAfterProbe,"
          if old not in body:
            m=re.search(r"const result = \{\s*label: LABEL,",body)
            if not m: raise SystemExit('result marker missing')
            body=body[:m.start()]+"const result = {\n          label: LABEL,\n          processPid: process.pid,\n          cloudAfterProbe,"+body[m.end():]
          else:
            body=body.replace(old,new,1)
          pathlib.Path(sys.argv[2]).write_text(body,encoding='utf-8')
          PY
          echo "V3_PRELOAD_SHA256=$(sha256sum "$PRELOAD" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Instrumentation smoke
        shell: bash
        run: |
          set -euo pipefail
          NODE_OPTIONS="--import=$A35_PRELOAD" node --input-type=module -e "import { chromium } from 'playwright'; console.log('PRELOAD_SMOKE_OK=' + String(Object.prototype.hasOwnProperty.call(chromium,'launch')));"

      - name: Run exact 25-observation matrix
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local label="$1" scenario="$2" runnum="$3" processmode="$4" browsermode="$5" contextmode="$6" fresh="$7" pattern="$8"; shift 8
            local out="$A35_TRACE_DIR/$label.jsonl" log="$A35_TRACE_DIR/$label.log" rc=0
            local args=(--test --test-concurrency=1)
            if [ -n "$pattern" ]; then args+=(--test-name-pattern="$pattern"); fi
            set +e
            A35_PROBE_LABEL="$label" A35_PROBE_OUTPUT="$out" A35_PROBE_FRESH_BROWSER_PER_CONTEXT="$fresh" \
              NODE_OPTIONS="--import=$A35_PRELOAD" node "${args[@]}" "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf '{"label":"%s","scenario":"%s","run":%s,"processMode":"%s","browserMode":"%s","contextMode":"%s","rc":%s}\n' \
              "$label" "$scenario" "$runnum" "$processmode" "$browsermode" "$contextmode" "$rc" >> "$A35_TRACE_DIR/run-meta.jsonl"
            if [ ! -s "$out" ]; then
              echo "HARNESS_NO_TRACE=$label RC=$rc" | tee -a "$A35_EVIDENCE_DIR/harness-errors.txt"
              cat "$log" >> "$A35_EVIDENCE_DIR/harness-errors.txt"
              return 2
            fi
            python - "$out" "$A35_EVIDENCE_DIR/STOP" <<'PY'
          import json,pathlib,sys
          reasons=[]
          rows=[json.loads(x) for x in pathlib.Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          for row in rows:
            for p in row.get('posts',[]):
              body=p.get('body') or ''
              if p.get('payloadClass')=='STALE_LOCAL': reasons.append('STALE_LOCAL_SENT')
              if 'A35_STALE_OWNER_LOCAL_DATA' in body: reasons.append('STALE_OWNER_PAYLOAD')
              try:
                parsed=json.loads(body) if isinstance(body,str) else body
                items=parsed if isinstance(parsed,list) else [parsed]
                ids={str(x.get('organization_id','')) for x in items if isinstance(x,dict) and x.get('organization_id') is not None}
                if ids and ids != {'a35-downgrade-org'}: reasons.append('WRONG_OR_CROSS_TENANT')
              except Exception: pass
              if p.get('dirtyBefore') is False and p.get('payloadClass')=='STALE_LOCAL': reasons.append('DIRTY_FALSE_EXPLICIT_STALE_SAVE')
          if reasons: pathlib.Path(sys.argv[2]).write_text('\n'.join(sorted(set(reasons)))+'\n')
          PY
            grep -E 'CONTROL_F_|A35_CONTROL_F_CAUSAL_RESULT=' "$log" || true
          }

          authority="dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js"
          ownerless="dist/tests/sec-fix-a3-5-ownerless-normalization.test.js"
          for n in $(seq 1 10); do [ -f "$A35_EVIDENCE_DIR/STOP" ] && break; run_one "case1-isolated-$n" "F isolated / fresh process-browser-context" "$n" "fresh node process" "fresh browser" "fresh context" "0" 'A3\.5 F:' "$authority" || break; done
          for n in $(seq 1 5); do [ -f "$A35_EVIDENCE_DIR/STOP" ] && break; run_one "case2-ae-then-f-$n" "A-E -> F / shared architecture" "$n" "fresh node process per observation" "shared browser within A-F invocation" "fresh context per control" "0" "" "$authority" || break; done
          for n in $(seq 1 5); do [ -f "$A35_EVIDENCE_DIR/STOP" ] && break; run_one "case3-fresh-browser-$n" "A-E -> F / fresh browser-context" "$n" "fresh node process per observation" "fresh browser per context" "fresh context per control" "1" "" "$authority" || break; done
          for n in $(seq 1 5); do [ -f "$A35_EVIDENCE_DIR/STOP" ] && break; run_one "case4-full-closure-$n" "Full Closure relevant architecture" "$n" "fresh node process per observation" "validation full-closure architecture" "fresh contexts" "0" "" "$authority" "$ownerless" || break; done

      - name: Build durable evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          A35_EVIDENCE_DIR="${A35_EVIDENCE_DIR:-$RUNNER_TEMP/a35-evidence}"
          A35_TRACE_DIR="${A35_TRACE_DIR:-$RUNNER_TEMP/a35-v3-traces}"
          mkdir -p "$A35_EVIDENCE_DIR" "$A35_TRACE_DIR"
          python - "$A35_TRACE_DIR" "$A35_EVIDENCE_DIR" <<'PY'
          import json,os,pathlib,sys
          from collections import Counter
          trace=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          def read(path):
            p=pathlib.Path(path); rows=[]
            if not p.exists(): return rows
            for line in p.read_text(encoding='utf-8',errors='replace').splitlines():
              if not line.strip(): continue
              try: rows.append(json.loads(line))
              except Exception as e: rows.append({'parseError':str(e),'raw':line})
            return rows
          meta={r.get('label'):r for r in read(trace/'run-meta.jsonl') if r.get('label')}
          raw=[]
          for p in sorted(trace.glob('case*.jsonl')): raw += read(p)
          def parse(v):
            if not isinstance(v,str): return v
            try:return json.loads(v)
            except:return v
          def orgs(body):
            v=parse(body); xs=v if isinstance(v,list) else [v]
            return sorted({str(x.get('organization_id')) for x in xs if isinstance(x,dict) and x.get('organization_id') is not None})
          per=[]; posts=[]; stops=[]
          for row in sorted(raw,key=lambda r:r.get('label','')):
            label=row.get('label',''); m=meta.get(label,{})
            events=row.get('fullTrace',[]); starts=[e for e in events if e.get('type')=='fetch-start']; ends={e.get('requestId'):e for e in events if e.get('type')=='fetch-end'}
            gets=[e for e in starts if e.get('method')=='GET' and '/rest/v1/propcontrol_records' in str(e.get('url',''))]
            first=gets[0] if gets else None
            before=parse((ends.get(first.get('requestId')) or {}).get('responseBody')) if first else None
            after=row.get('cloudAfterProbe') or {}; after_json=after.get('json') if isinstance(after,dict) else None
            if after_json is None and isinstance(after,dict): after_json=parse(after.get('body'))
            per.append({'scenario':m.get('scenario'),'run':m.get('run'),'label':label,'candidateSha':os.environ.get('CANDIDATE',''),'validationSha':os.environ.get('VALIDATION_SHA',os.environ.get('GITHUB_SHA','')),'processBrowserContextMode':{'process':m.get('processMode'),'browser':m.get('browserMode'),'context':m.get('contextMode'),'processPid':row.get('processPid')},'testReturnCode':m.get('rc'),'postCount':row.get('postCount',0),'eventSequence':events,'timer700':row.get('timerEvents',[]),'syncDirtyReads':row.get('syncReads',[]),'bootstrapEvents':row.get('bootstrapEvents',[]),'serviceWorkers':row.get('serviceWorkers',[]),'finalSync':row.get('finalSync'),'runtimeFinal':row.get('runtime'),'cloudFixtureBefore':before,'cloudFixtureAfter':after_json,'cloudAfterProbe':after})
            for i,p in enumerate(row.get('posts',[]),1):
              ids=orgs(p.get('body')); body=str(p.get('body') or '')
              q={'run':m.get('run'),'scenario':m.get('scenario'),'label':label,'postIndex':i,'candidateSha':os.environ.get('CANDIDATE',''),'eventOrigin':'fetch-start','requestMethod':p.get('method'),'requestUrl':p.get('url'),'requestBody':p.get('body'),'organization_id':ids,'payloadClass':p.get('payloadClass'),'payloadStructuralDifferences':p.get('payloadDifferences',[]),'semanticIdempotent':p.get('semanticIdempotent'),'dirtyBefore':p.get('dirtyBefore'),'localSnapshotBeforePost':p.get('snapshot'),'cloudFixtureBefore':before,'cloudFixtureAfter':after_json,'replaceRelation':p.get('replaceRelation'),'precedingReplace':p.get('precedingReplace'),'followingReplace':p.get('followingReplace'),'jsStack':p.get('stack'),'cdpInitiator':p.get('cdpInitiator'),'responseStatus':p.get('responseStatus'),'monoMs':p.get('monoMs'),'timer700':row.get('timerEvents',[]),'syncDirtyReads':row.get('syncReads',[]),'bootstrapEvents':row.get('bootstrapEvents',[]),'serviceWorkers':row.get('serviceWorkers',[]),'finalSync':row.get('finalSync'),'runtimeFinal':row.get('runtime'),'fullEventSequence':events,'cloudEffect':'UNCHANGED' if before is not None and after_json is not None and before==after_json else ('CHANGED' if before is not None and after_json is not None else 'NOT_PROVEN')}
              posts.append(q)
              if p.get('payloadClass')=='STALE_LOCAL':stops.append('STALE_LOCAL_SENT')
              if 'A35_STALE_OWNER_LOCAL_DATA' in body:stops.append('STALE_OWNER_PAYLOAD')
              if ids and ids != ['a35-downgrade-org']:stops.append('WRONG_OR_CROSS_TENANT')
          scenarios=['F isolated / fresh process-browser-context','A-E -> F / shared architecture','A-E -> F / fresh browser-context','Full Closure relevant architecture']
          matrix=[]
          for s in scenarios:
            rr=[r for r in per if r.get('scenario')==s]; pp=[p for p in posts if p.get('scenario')==s]; origins=[]
            for p in pp:
              stack=str(p.get('jsStack') or '').splitlines()[1:]; origins.append(next((x.strip() for x in stack if x.strip()),'UNKNOWN'))
            matrix.append({'scenario':s,'runs':len(rr),'POST=0':sum(r['postCount']==0 for r in rr),'POST=1+':sum(r['postCount']>0 for r in rr),'payloadClasses':sorted({p.get('payloadClass') for p in pp if p.get('payloadClass')}),'origins':sorted(set(origins))})
          (out/'reproduction-matrix.json').write_text(json.dumps(matrix,indent=2,ensure_ascii=False)+'\n')
          with (out/'per-run.jsonl').open('w') as f:
            for r in per:f.write(json.dumps(r,ensure_ascii=False)+'\n')
          with (out/'post-traces.jsonl').open('w') as f:
            for r in posts:f.write(json.dumps(r,ensure_ascii=False)+'\n')
          env={'candidateSha':os.environ.get('CANDIDATE',''),'validationSha':os.environ.get('VALIDATION_SHA',os.environ.get('GITHUB_SHA','')),'productBranch':os.environ.get('PRODUCT_BRANCH',''),'validationBranch':os.environ.get('VALIDATION_BRANCH',''),'nodeVersion':os.popen('node --version').read().strip(),'v3PreloadSha256':os.environ.get('V3_PRELOAD_SHA256',''),'stopReasons':sorted(set(stops))}
          (out/'environment.json').write_text(json.dumps(env,indent=2,ensure_ascii=False)+'\n')
          classes=Counter(p.get('payloadClass') for p in posts); wrong=sum(bool(p.get('organization_id')) and p.get('organization_id')!=['a35-downgrade-org'] for p in posts); mutation=sum(p.get('cloudEffect')=='CHANGED' for p in posts); complete=sum(all(p.get(k) is not None for k in ('requestBody','dirtyBefore','replaceRelation','jsStack','cloudFixtureBefore','cloudFixtureAfter')) for p in posts)
          summary=[f'CANDIDATE={os.environ.get("CANDIDATE","")}',f'VALIDATION_SHA={os.environ.get("VALIDATION_SHA",os.environ.get("GITHUB_SHA",""))}',f'TOTAL_RUNS={len(per)}',f'TOTAL_POSTS={len(posts)}',f'COMPLETE_CAUSAL_CHAINS={complete}','PAYLOAD_CLASSES='+json.dumps(dict(classes),sort_keys=True),f'STALE_POST_COUNT={sum(p.get("payloadClass")=="STALE_LOCAL" for p in posts)}',f'WRONG_TENANT_COUNT={wrong}',f'CLOUD_MUTATION_COUNT={mutation}',f'STOP_REASONS={json.dumps(sorted(set(stops)))}','CAUSE=NOT PROVEN']
          (out/'final-summary.txt').write_text('\n'.join(summary)+'\n')
          PY
          [ -f "$A35_TRACE_DIR/run-meta.jsonl" ] && cp "$A35_TRACE_DIR/run-meta.jsonl" "$A35_EVIDENCE_DIR/run-meta.jsonl" || true
          mkdir -p "$A35_EVIDENCE_DIR/run-logs"
          cp "$A35_TRACE_DIR"/*.log "$A35_EVIDENCE_DIR/run-logs/" 2>/dev/null || true
          (
            cd "$A35_EVIDENCE_DIR"
            rm -f SHA256SUMS
            sha256sum reproduction-matrix.json per-run.jsonl post-traces.jsonl environment.json final-summary.txt > SHA256SUMS
          )
          cat "$A35_EVIDENCE_DIR/final-summary.txt"
          cat "$A35_EVIDENCE_DIR/SHA256SUMS"

      - name: Upload durable causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a35-control-f-v3-causal-evidence
          path: ${{ runner.temp }}/a35-evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Step Summary
        if: always()
        shell: bash
        run: |
          A35_EVIDENCE_DIR="${A35_EVIDENCE_DIR:-$RUNNER_TEMP/a35-evidence}"
          {
            echo "## A3.5 Control F V3 R3 causal evidence"
            echo "- candidate SHA: \`$CANDIDATE\`"
            echo "- validation SHA: \`${VALIDATION_SHA:-$GITHUB_SHA}\`"
            [ -f "$A35_EVIDENCE_DIR/final-summary.txt" ] && { echo '```text'; cat "$A35_EVIDENCE_DIR/final-summary.txt"; echo '```'; }
            [ -f "$A35_EVIDENCE_DIR/reproduction-matrix.json" ] && { echo '```json'; cat "$A35_EVIDENCE_DIR/reproduction-matrix.json"; echo '```'; }
            [ -f "$A35_EVIDENCE_DIR/SHA256SUMS" ] && { echo '```text'; cat "$A35_EVIDENCE_DIR/SHA256SUMS"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final worktree and immutable refs proof
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$PWD/.a35-control-f-preload.mjs" "$PWD/extension/trv-fichas-chrome.zip"
          rm -rf "$PWD/dist" "$PWD/node_modules"
          set -euo pipefail
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          remote_product="$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')"
          echo "FINAL_PRODUCT_BRANCH=$remote_product"
          test "$remote_product" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then echo "FINAL_DIRTINESS=STATUS"; printf '%s\n' "$status"; exit 1; fi
          echo "FINAL_WORKTREE=CLEAN"
