name: SEC-FIX A3.3 Gate C Final Validation R2

on:
  push:
    branches:
      - validation/a33-gate-c-final-r2

permissions:
  contents: read

concurrency:
  group: sec-fix-a3-3-gate-c-final-r2
  cancel-in-progress: false

jobs:
  gate-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE: 6fbea368b5d0e80d36c0f8171f26be495798f904
      VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
      A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
      A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
      A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
      ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v4
        with:
          ref: 6fbea368b5d0e80d36c0f8171f26be495798f904
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch canonical Gate C infrastructure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/a33-gate-c-final.yml?ref=${VALIDATION_BASE}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url" > "$RUNNER_TEMP/a33-gate-c-final-canonical.yml"
          grep -F 'name: SEC-FIX A3.3 Gate C Final Validation' "$RUNNER_TEMP/a33-gate-c-final-canonical.yml"
          echo "CANONICAL_VALIDATION_BASE=${VALIDATION_BASE}"
          echo "CANONICAL_WORKFLOW=.github/workflows/a33-gate-c-final.yml"

      - name: Execute Gate C 1 through 27 fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a33_gate_c_r2.py" <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          CANONICAL = Path(os.environ["RUNNER_TEMP"]) / "a33-gate-c-final-canonical.yml"
          CANDIDATE = os.environ["CANDIDATE"]

          EXPECTED_BASELINE = sorted([
              "?? dist/",
              "?? extension/trv-fichas-chrome.zip",
              "?? node_modules/",
          ])
          EXPECTED_GATE19 = sorted([
              "?? artifacts/",
              "?? dist/",
              "?? extension/trv-fichas-chrome.zip",
              "?? node_modules/",
          ])
          EXPECTED_ARTIFACTS = [
              "01-mobile-panel-contacto.png",
              "02-mobile-confirmacion-regreso.png",
              "03-mobile-proximo-seguimiento.png",
              "04-escritorio-contacto.png",
              "05-seguimiento-vencido.png",
              "06-numero-invalido.png",
          ]

          def run(argv, *, check=True, capture=False, cwd=ROOT, env=None):
              if isinstance(argv, str):
                  result = subprocess.run(
                      ["bash", "-c", "set -euo pipefail\n" + argv],
                      cwd=cwd,
                      env=env or os.environ.copy(),
                      text=True,
                      capture_output=capture,
                  )
              else:
                  result = subprocess.run(
                      argv,
                      cwd=cwd,
                      env=env or os.environ.copy(),
                      text=True,
                      capture_output=capture,
                  )
              if check and result.returncode != 0:
                  if capture:
                      sys.stdout.write(result.stdout)
                      sys.stderr.write(result.stderr)
                  raise subprocess.CalledProcessError(result.returncode, argv)
              return result

          def capture(argv):
              return run(argv, capture=True).stdout.rstrip("\n")

          def extract_gates(text):
              lines = text.splitlines()
              gates = {}
              i = 0
              while i < len(lines):
                  match = re.match(r"^\s{6}- name: Gate (\d+) -", lines[i])
                  if not match:
                      i += 1
                      continue
                  number = int(match.group(1))
                  j = i + 1
                  run_idx = None
                  while j < len(lines):
                      if re.match(r"^\s{6}- name:", lines[j]):
                          break
                      if re.match(r"^\s{8}run:", lines[j]):
                          run_idx = j
                          break
                      j += 1
                  if run_idx is None:
                      raise RuntimeError(f"Gate {number} has no run block")
                  raw = lines[run_idx].strip()[4:].strip()
                  if raw == "|":
                      body = []
                      k = run_idx + 1
                      while k < len(lines):
                          line = lines[k]
                          if line and not line.startswith("          "):
                              break
                          if line.startswith("          "):
                              body.append(line[10:])
                          else:
                              body.append("")
                          k += 1
                      gates[number] = "\n".join(body).rstrip() + "\n"
                  else:
                      gates[number] = raw + "\n"
                  i = run_idx + 1
              missing = [n for n in range(1, 28) if n not in gates]
              if missing:
                  raise RuntimeError(f"Missing canonical gates: {missing}")
              return gates

          def git_status():
              return capture(["git", "status", "--porcelain=v1", "--untracked-files=normal"])

          def git_diff_names():
              return capture(["git", "diff", "--name-only"])

          def git_cached_names():
              return capture(["git", "diff", "--cached", "--name-only"])

          def assert_exact_sha():
              actual = capture(["git", "rev-parse", "HEAD"])
              if actual != CANDIDATE:
                  raise RuntimeError(f"SHA_MISMATCH expected={CANDIDATE} actual={actual}")

          def assert_no_tracked_mutation():
              diff = git_diff_names()
              cached = git_cached_names()
              if diff:
                  raise RuntimeError(f"TRACKED_DIFF_UNEXPECTED\n{diff}")
              if cached:
                  raise RuntimeError(f"CACHED_DIFF_UNEXPECTED\n{cached}")

          def status_lines():
              value = git_status()
              return sorted([line for line in value.splitlines() if line])

          def print_gate19_status():
              print("GATE19_GENERATED_STATUS_BEGIN", flush=True)
              print(git_status(), flush=True)
              print("GIT_DIFF_NAME_ONLY_BEGIN", flush=True)
              print(git_diff_names(), flush=True)
              print("GIT_DIFF_NAME_ONLY_END", flush=True)
              print("GIT_DIFF_CACHED_NAME_ONLY_BEGIN", flush=True)
              print(git_cached_names(), flush=True)
              print("GIT_DIFF_CACHED_NAME_ONLY_END", flush=True)
              print("GATE19_GENERATED_STATUS_END", flush=True)

          def fail_gate19_provenance(reason):
              print("GATE19_GENERATED_ARTIFACT_PROVENANCE=FAIL", flush=True)
              print(f"REASON={reason}", flush=True)
              raise SystemExit(91)

          def validate_and_cleanup_gate19_artifacts():
              print_gate19_status()
              try:
                  assert_exact_sha()
                  assert_no_tracked_mutation()
              except Exception as exc:
                  fail_gate19_provenance(str(exc))

              if status_lines() != EXPECTED_GATE19:
                  fail_gate19_provenance(
                      "STATUS_MISMATCH actual=" + repr(status_lines()) +
                      " expected=" + repr(EXPECTED_GATE19)
                  )

              artifacts = ROOT / "artifacts"
              b13 = artifacts / "b1-3"

              if artifacts.is_symlink() or not artifacts.is_dir():
                  fail_gate19_provenance("artifacts must be a normal directory")
              if b13.is_symlink() or not b13.is_dir():
                  fail_gate19_provenance("artifacts/b1-3 must be a normal directory")

              artifact_children = sorted(p.name for p in artifacts.iterdir())
              if artifact_children != ["b1-3"]:
                  fail_gate19_provenance(
                      "unexpected subtree under artifacts: " + repr(artifact_children)
                  )

              children = sorted(p.name for p in b13.iterdir())
              if children != sorted(EXPECTED_ARTIFACTS):
                  fail_gate19_provenance(
                      "artifact file inventory mismatch: " + repr(children)
                  )

              for name in EXPECTED_ARTIFACTS:
                  path = b13 / name
                  if path.is_symlink() or not path.is_file():
                      fail_gate19_provenance(f"{path} must be a regular non-symlink file")

              extras = []
              for path in artifacts.rglob("*"):
                  rel = path.relative_to(artifacts).as_posix()
                  if rel == "b1-3":
                      continue
                  if rel.startswith("b1-3/") and rel.split("/", 1)[1] in EXPECTED_ARTIFACTS:
                      continue
                  extras.append(rel)
              if extras:
                  fail_gate19_provenance("unexpected artifact entries: " + repr(sorted(extras)))

              print("GATE19_GENERATED_ARTIFACT_PROVENANCE=CONFIRMED", flush=True)
              print("PRODUCER=b1-3-whatsapp-contact-real-app.test.js", flush=True)
              print("GENERATED_FILES=6", flush=True)

              for name in EXPECTED_ARTIFACTS:
                  run(["rm", "--", str(b13 / name)])
              run(["rmdir", str(b13)])
              run(["rmdir", str(artifacts)])

              if artifacts.exists() or artifacts.is_symlink():
                  raise RuntimeError("artifacts still exists after surgical cleanup")

              print("GATE19_GENERATED_ARTIFACT_CLEANUP=PASS", flush=True)

              assert_exact_sha()
              assert_no_tracked_mutation()
              actual = status_lines()
              if actual != EXPECTED_BASELINE:
                  raise RuntimeError(
                      "POST_GATE19_BASELINE_MISMATCH actual=" + repr(actual) +
                      " expected=" + repr(EXPECTED_BASELINE)
                  )
              print("POST_GATE19_BASELINE_RESTORED=PASS", flush=True)

          def tap_total(log_path, key):
              text = Path(log_path).read_text(encoding="utf-8", errors="replace")
              tag = {
                  "TOTAL": "tests",
                  "PASS": "pass",
                  "FAIL": "fail",
                  "SKIP": "skipped",
                  "CANCELLED": "cancelled",
                  "TODO": "todo",
              }[key]
              values = re.findall(rf"^# {tag} (\d+)\s*$", text, flags=re.MULTILINE)
              if not values:
                  raise RuntimeError(f"{log_path}: missing TAP field {tag}")
              return int(values[-1])

          def print_dynamic_totals(gate):
              log_path = f"/tmp/g{gate:02d}.log"
              total = tap_total(log_path, "TOTAL")
              passed = tap_total(log_path, "PASS")
              failed = tap_total(log_path, "FAIL")
              skipped = tap_total(log_path, "SKIP")
              cancelled = tap_total(log_path, "CANCELLED")
              todo = tap_total(log_path, "TODO")
              if failed != 0:
                  raise RuntimeError(f"GATE{gate}_FAIL={failed}")
              if cancelled != 0:
                  raise RuntimeError(f"GATE{gate}_CANCELLED={cancelled}")
              if todo != 0:
                  raise RuntimeError(f"GATE{gate}_TODO={todo}")
              if passed + failed + skipped != total:
                  raise RuntimeError(
                      f"GATE{gate}_TOTAL_MISMATCH total={total} pass={passed} "
                      f"fail={failed} skip={skipped}"
                  )
              print(f"GATE{gate}_TOTAL={total}", flush=True)
              print(f"GATE{gate}_PASS={passed}", flush=True)
              print(f"GATE{gate}_FAIL={failed}", flush=True)
              print(f"GATE{gate}_SKIP={skipped}", flush=True)

          def browser_prerequisite():
              script = r'''
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; exit 0; fi
          if command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; exit 0; fi
          if command -v chromium >/dev/null 2>&1; then chromium --version; exit 0; fi
          if command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version; exit 0; fi
          echo "No supported browser executable available for real-app gates."
          exit 1
          '''
              run(script)

          def run_gate(number, script):
              print(f"GATE_{number:02d}_BEGIN", flush=True)
              rc = run(script, check=False).returncode
              if rc != 0:
                  print(f"GATE_{number:02d}=FAIL_RC_{rc}", flush=True)
                  raise SystemExit(rc)
              if number == 7:
                  print("GATE_07=PASS", flush=True)
              if number == 26:
                  print("GATE_26=PASS", flush=True)
              print(f"GATE_{number:02d}_END", flush=True)

          def final_gate_27():
              print("GATE_27_BEGIN", flush=True)
              assert_exact_sha()
              assert_no_tracked_mutation()

              status = git_status()
              print("POST_VALIDATION_STATUS_BEGIN", flush=True)
              print(status, flush=True)
              print("POST_VALIDATION_STATUS_END", flush=True)

              if (ROOT / "artifacts").exists() or (ROOT / "artifacts").is_symlink():
                  raise RuntimeError("artifacts/ must not exist at Gate 27")

              actual = status_lines()
              if actual != EXPECTED_BASELINE:
                  raise RuntimeError(
                      "FINAL_GENERATED_STATUS_MISMATCH actual=" + repr(actual) +
                      " expected=" + repr(EXPECTED_BASELINE)
                  )

              dist = ROOT / "dist"
              node_modules = ROOT / "node_modules"
              zip_path = ROOT / "extension" / "trv-fichas-chrome.zip"

              if dist.is_symlink() or not dist.is_dir():
                  raise RuntimeError("dist/ must be a normal directory")
              if node_modules.is_symlink() or not node_modules.is_dir():
                  raise RuntimeError("node_modules/ must be a normal directory")
              if zip_path.is_symlink() or not zip_path.is_file():
                  raise RuntimeError("extension/trv-fichas-chrome.zip must be a regular file")

              shutil.rmtree(dist)
              shutil.rmtree(node_modules)
              zip_path.unlink()

              assert_exact_sha()
              assert_no_tracked_mutation()
              if git_status():
                  raise RuntimeError("FINAL_WORKTREE_NOT_CLEAN\n" + git_status())

              print(f"FINAL_EXACT_CHECKOUT_SHA={capture(['git', 'rev-parse', 'HEAD'])}", flush=True)
              print("FINAL_WORKTREE_CLEAN=PASS", flush=True)
              print("GATE_27=PASS", flush=True)
              print("GATE_C_SEQUENCE=1-27_COMPLETE", flush=True)
              print("GATE_27_END", flush=True)

          gates = extract_gates(CANONICAL.read_text(encoding="utf-8"))
          print("CANONICAL_GATE_COUNT=27", flush=True)
          print(f"CANONICAL_VALIDATION_BASE={os.environ['VALIDATION_BASE']}", flush=True)
          print(f"EXACT_CANDIDATE={CANDIDATE}", flush=True)

          assert_exact_sha()
          assert_no_tracked_mutation()

          for number in (1, 2, 3):
              run_gate(number, gates[number])

          run(["npm", "ci"])

          for number in range(4, 27):
              if number == 8:
                  browser_prerequisite()
              run_gate(number, gates[number])
              if number == 19:
                  validate_and_cleanup_gate19_artifacts()
              if number in (21, 22, 23):
                  print_dynamic_totals(number)

          final_gate_27()
          PY
          python3 "$RUNNER_TEMP/a33_gate_c_r2.py"
