name: PR 137 ajustar aserción causal del menú

on:
  push:
    branches: [agent/leads-ux-ui-professional-redesign]

permissions:
  contents: write

concurrency:
  group: pr137-account-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ajustar-asercion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leads-ux-ui-professional-redesign
          fetch-depth: 0
      - name: Separar estado abierto y bloqueo responsive
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tests/b1-2-8-account-menu-responsive-real-app.test.ts')
          text = path.read_text(encoding='utf-8')
          old_geometry = "      bodyLocked: document.body.classList.contains('account-menu-open'),\n      nameWordBreak:"
          new_geometry = "      bodyMenuOpen: document.body.classList.contains('account-menu-open'),\n      bodyOverflowY: getComputedStyle(document.body).overflowY,\n      nameWordBreak:"
          old_assertion = "  assert.equal(geometry.bodyLocked, viewport.width <= 520);\n  if (viewport.width === 320)"
          new_assertion = "  assert.equal(geometry.bodyMenuOpen, true);\n  assert.equal(geometry.bodyOverflowY === 'hidden', viewport.width <= 520);\n  if (viewport.width === 320)"
          if text.count(old_geometry) != 1 or text.count(old_assertion) != 1:
              raise SystemExit('No se encontraron exactamente las aserciones geométricas esperadas.')
          text = text.replace(old_geometry, new_geometry)
          text = text.replace(old_assertion, new_assertion)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/tests/b1-2-8-account-menu-responsive-real-app.test.ts
      - name: Publicar aserción fortalecida
        run: |
          git config user.name "francoagustin324"
          git config user.email "francoagustinsolis@gmail.com"
          git add src/tests/b1-2-8-account-menu-responsive-real-app.test.ts
          git commit -m "Separar estado abierto y bloqueo responsive del menú"
          git push origin HEAD:agent/leads-ux-ui-professional-redesign
