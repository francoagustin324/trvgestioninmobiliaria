name: A3.5-R14 Focused Validation

on:
  push:
    branches:
      - validation/a35-r14-authoritative-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Registrar source SHA
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > r14-source-sha.txt
          echo "R14_FOCUSED_HEAD=$GITHUB_SHA"

      - name: Instalar dependencias
        run: npm ci --silent

      - name: Verificar Chromium del runner
        shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$executable"
          echo "R14_CHROMIUM=$executable"

      - name: Compilar TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run build --silent 2>&1 | tee r14-build.log

      - name: Ejecutar validación focalizada R14
        id: focused_tests
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/p1-1-a7-r2-2c-visit-transaction-cutover.test.js \
            dist/tests/p1-2-a1-commercial-close-browser.test.js \
            dist/tests/sec-fix-a1-2-d-org-aware-visit-cutover.test.js \
            dist/tests/sec-fix-a1-dr03-stale-sync-metadata.test.js \
            2>&1 | tee r14-focused.log

      - name: Subir evidencia focalizada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a35-r14-focused-${{ github.sha }}
          path: |
            r14-source-sha.txt
            r14-build.log
            r14-focused.log
          if-no-files-found: error
          retention-days: 14
