name: A3.4 Reproducer Validation

on:
  push:
    branches: [validation/a34-reproducer-red]

jobs:
  reproducer:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --silent
      - name: Install Chromium
        run: |
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          npx playwright install --with-deps chromium
      - name: Build must pass
        run: npm run build --silent
      - name: Run A3.4 reproducer R1-R4 (expected RED)
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js
