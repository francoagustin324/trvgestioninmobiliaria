name: SEC-FIX A2.4 exact SHA validation R2
on:
  push:
    branches:
      - validation/sec-fix-a2-4-r2
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propcontrol_a2_4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propcontrol_a2_4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      A2_3_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propcontrol_a2_4
      A2_2_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propcontrol_a2_4
      A2_1_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propcontrol_a2_4
      CANDIDATE_SHA: b8e9b3d37b37adf321af5bb0903bd804cb331a6e
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: b8e9b3d37b37adf321af5bb0903bd804cb331a6e
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Build
        run: npm run build --silent
      - name: A2.4 PostgreSQL 17 V2 alignment
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.js
      - name: A2.3 ACL regression
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a2-3-minimal-acl-hardening.test.js
      - name: A2.2 active-only regression
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a2-2-active-only-membership-authority.test.js
      - name: A2.1 status regression
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a2-1-canonical-membership-status.test.js
      - name: A1.1 org-aware DB compatibility
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a1-1-org-aware-db-compat.test.js
      - name: Visit transaction backend and CAS regressions
        run: node --test --test-concurrency=1 dist/tests/p1-1-a7-r2-2-visit-transaction-backend.test.js dist/tests/p1-1-a7-r2-2c-visit-transaction-cutover.test.js dist/tests/p1-1-a7-r2-2d-client-reassignment-cas.test.js
      - name: Membership and RLS regressions
        run: node --test --test-concurrency=1 dist/tests/b0-1-membership-security.test.js dist/tests/multiuser-rls-migration.test.js dist/tests/restrictive-organization-isolation.test.js dist/tests/suspended-member-lockout.test.js
      - name: A1 org-aware visit cutover regression
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a1-2-d-org-aware-visit-cutover.test.js
