name: SEC-FIX A3.5 Full Closure Final Exact FIX3

on:
  push:
    branches:
      - validation/a35-full-closure-final-exact-fix3

permissions:
  contents: read

concurrency:
  group: sec-fix-a3-5-full-closure-final-exact-fix3
  cancel-in-progress: false

env:
  CANDIDATE: f82bc3bad74450322c5e85c92ca5577059012145
  OFFICIAL_A35: fdff36785e90197c9ef384394ad474d9787af72a
  PRODUCT_BRANCH: agent/sec-fix-a3-5-stale-role-fallback-fence
  MAIN_SHA: 68034c60f606326a1d75fc3d448c7e99de49b492
  RELEASE_BRANCH: release/a34-webkit-572-reconciliation
  RELEASE_SHA: de091b9c98c33a31682cc77ede03313a8a66cb30
  VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
  PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
  A31_FINAL: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
  A32_FINAL: 349e9ba9e456ef79c3c740a9458290f408c651e6
  A33_RUNTIME: f2ed74d622aa873822a704c6fe3cc28d194d7691
  A33_GATE_A_ALIGNMENT: 68baba54ec5db00f14445336b436e3b484c6c0a6
  ACCIDENTAL: fa5ff40c41996bf56ee89b5dca964f4b6bcdf426

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact detached A3.5 candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Exact refs and cumulative three-test scope precheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo 'DETACHED_HEAD=NO'
            exit 1
          fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"

          git diff --name-only "$OFFICIAL_A35..$CANDIDATE" | LC_ALL=C sort > "$RUNNER_TEMP/a35-actual-delta.txt"
          cat > "$RUNNER_TEMP/a35-expected-delta.txt" <<'EOF'
          src/tests/followup-cloud-persistence-browser.test.ts
          src/tests/followup-cloud-persistence.test.ts
          src/tests/sync-conflict-ui.test.ts
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/a35-expected-delta.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/a35-expected-delta.txt" "$RUNNER_TEMP/a35-expected-delta.txt"
          diff -u "$RUNNER_TEMP/a35-expected-delta.txt" "$RUNNER_TEMP/a35-actual-delta.txt"

          grep '^src/' "$RUNNER_TEMP/a35-actual-delta.txt" | grep -v '^src/tests/' > "$RUNNER_TEMP/product-runtime-delta.txt" || true
          grep -E '\.sql$' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-sql-delta.txt" || true
          grep '^supabase/migrations/' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-migration-delta.txt" || true
          grep '^\.github/workflows/' "$RUNNER_TEMP/a35-actual-delta.txt" > "$RUNNER_TEMP/product-workflow-delta.txt" || true
          test ! -s "$RUNNER_TEMP/product-runtime-delta.txt"
          test ! -s "$RUNNER_TEMP/product-sql-delta.txt"
          test ! -s "$RUNNER_TEMP/product-migration-delta.txt"
          test ! -s "$RUNNER_TEMP/product-workflow-delta.txt"

          echo "EXECUTION_SHA=$(git rev-parse HEAD)"
          echo 'CANDIDATE_SCOPE_EXACT_THREE_TESTS=YES'
          echo 'PRODUCT_RUNTIME_DELTA=0'
          echo 'PRODUCT_SQL_DELTA=0'
          echo 'PRODUCT_MIGRATION_DELTA=0'
          echo 'PRODUCT_WORKFLOW_DELTA=0'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Install Chromium for real-app security suites
        run: npx playwright install --with-deps chromium

      - name: Build exact candidate
        run: npm run build --silent

      - name: A3.5 A-G strict Control F and ownerless
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/sec-fix-a3-5-stale-role-fallback-authority.test.js \
            dist/tests/sec-fix-a3-5-ownerless-normalization.test.js \
            2>&1 | tee "$RUNNER_TEMP/a35.tap"
          grep -q '^# tests 9$' "$RUNNER_TEMP/a35.tap"
          grep -q '^# pass 9$' "$RUNNER_TEMP/a35.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_A_NORMAL_DOWNGRADE=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_B_TEAM_VIEW_TAMPER_SYNC=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'IDENTITY_SPOOF_AFTER_SYNC=NO' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_C1_PRE_PROJECTION_AUTHORITY_FENCE=PASS' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_C2_PRE_PROJECTION_AUTHORITY_FENCE=PASS' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_D_SYNTHETIC_503_REACHED=YES' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_D_SAME_AUTHORITY_OFFLINE_FALLBACK=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_E_MISSING=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_E_MEMBER_ID_MISMATCH=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_E_ROLE_MISMATCH=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_E=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_VALID_TELEMETRY=ALLOWED' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_STALE_CRM=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_TENANT=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_ACTOR=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_MEMBER=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_CREATOR=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_WRONG_CLIENT=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_GENERIC_ACTIVITY=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CLASSIFIER_MIXED_ROWS=FORBIDDEN' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_CRM_SNAPSHOT_POSTS=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F_FORBIDDEN_RECORD_POSTS=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CONTROL_F=PASS_SAFE' "$RUNNER_TEMP/a35.tap"
          grep -q 'NORMALIZED_ROLE=Corredor' "$RUNNER_TEMP/a35.tap"
          grep -q 'OWNER_COUNT=0' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_VIEW_ALL=NO' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_ACCESS_SETTINGS=NO' "$RUNNER_TEMP/a35.tap"
          grep -q 'CAN_ADMINISTER_TEAM=NO' "$RUNNER_TEMP/a35.tap"
          echo 'CONTROL_F_CLASSIFIER=GREEN'
          echo 'CONTROL_F_RUNTIME=GREEN'
          echo 'OWNERLESS_G=GREEN'
          echo 'A35_A_G=GREEN'

      - name: A3.5 H-I real-owner preservation and fresh empty-roster compatibility
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/tests/a35-owner-preservation-final-fix3.mjs <<'EOF'
          import './sec-fix-a1-2-c2-test-setup.js';
          import assert from 'node:assert/strict';
          import { initialData } from '../models.js';
          import { activateStorageForTenant, state } from '../store.js';
          import { canAccessSettings, canAdministerTeam, canViewAll } from '../team-access.js';
          import { writeTenantSnapshot } from '../tenant-storage.js';
          const ORG='00000000-0000-0000-0000-00000000a351';
          const AUTH='a35-preservation-auth';
          const OWNER='a35-preservation-owner';
          const scope=Object.freeze({userId:AUTH,organizationId:ORG});
          const member=(id,userId,role)=>({id,userId,name:userId,email:`${userId}@example.test`,role,status:'Activo',createdAt:'2026-09-14T00:00:00.000Z'});
          function crm(members){const v=structuredClone(initialData);v.organization={id:ORG,name:'A3.5 Preservation',seatLimit:null,planLabel:'validation'};v.teamMembers=members;v.activityLog=[];v.clients=[];v.properties=[];v.visits=[];v.offers=[];v.reservations=[];v.contacts=[];v.reminders=[];v.fichas=[];v.conversations=[];return v;}
          function seed(members){localStorage.clear();writeTenantSnapshot(scope,crm(members),{markDirty:false,reason:'a35-preservation',backup:false});activateStorageForTenant(scope);}
          seed([member(351,AUTH,'Corredor'),member(352,OWNER,'Dueño')]);
          const hAuth=state.crm.teamMembers.find(x=>x.userId===AUTH),hOwner=state.crm.teamMembers.find(x=>x.userId===OWNER);
          assert.equal(hAuth?.role,'Corredor');assert.equal(hOwner?.role,'Dueño');assert.equal(state.crm.teamMembers.filter(x=>x.role==='Dueño').length,1);
          console.log('CONTROL_H_REAL_OWNER_PRESERVED=PASS_SAFE');
          seed([member(351,AUTH,'Dueño'),member(352,OWNER,'Corredor')]);
          const iAuth=state.crm.teamMembers.find(x=>x.userId===AUTH);
          assert.equal(iAuth?.role,'Dueño');assert.equal(state.crm.teamMembers.filter(x=>x.role==='Dueño').length,1);assert.equal(state.activeMemberId,351);assert.equal(canViewAll(),true);assert.equal(canAccessSettings(),true);assert.equal(canAdministerTeam(),true);
          console.log('CONTROL_I_REAL_OWNER_PRESERVED=PASS_SAFE');
          localStorage.clear();writeTenantSnapshot(scope,crm([]),{markDirty:false,reason:'a35-empty-roster',backup:false});activateStorageForTenant(scope);
          assert.equal(state.crm.teamMembers.length,initialData.teamMembers.length);assert.equal(state.crm.teamMembers[0]?.role,'Dueño');assert.equal(state.crm.teamMembers[0]?.userId,undefined);
          console.log('FRESH_EMPTY_ROSTER_INITIALDATA_COMPATIBILITY=PASS_SAFE');
          EOF
          node dist/tests/a35-owner-preservation-final-fix3.mjs 2>&1 | tee "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'CONTROL_H_REAL_OWNER_PRESERVED=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'CONTROL_I_REAL_OWNER_PRESERVED=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          grep -q 'FRESH_EMPTY_ROSTER_INITIALDATA_COMPATIBILITY=PASS_SAFE' "$RUNNER_TEMP/a35-hi.tap"
          echo 'A35_H_I_AND_EMPTY_ROSTER=GREEN'

      - name: A3.4 R1-R12 complete including R10
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js 2>&1 | tee "$RUNNER_TEMP/a34.tap"
          grep -q '^# tests 12$' "$RUNNER_TEMP/a34.tap"
          grep -q '^# pass 12$' "$RUNNER_TEMP/a34.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/a34.tap"
          grep -Eq '^ok [0-9]+ - A3\.4 R10:' "$RUNNER_TEMP/a34.tap"
          echo 'R10=PASS'
          echo 'A34_R1_R12=12/12 PASS'

      - name: A3.4 R11 x10 fresh Node processes
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            log="$RUNNER_TEMP/a34-r11-$n.tap"
            node --test --test-concurrency=1 --test-name-pattern='A3.4 R11:' dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js >"$log" 2>&1
            grep -q '^# pass 1$' "$log"
            grep -q '^# fail 0$' "$log"
            grep -Eq '^ok [0-9]+ - A3\.4 R11:' "$log"
            echo "R11_REPLAY=$n PASS"
          done
          echo 'R11=10/10 PASS'

      - name: Auth session generation regressions
        run: >-
          node --test --test-concurrency=1
          dist/tests/sec-fix-a1-fdr02-cross-tab-auth-generation.test.js
          dist/tests/sec-fix-a1-dr04-auth-refresh-epoch.test.js

      - name: Tenant hydration storage and async regressions
        run: >-
          node --test --test-concurrency=1
          dist/tests/sec-fix-a1-2-c1-tenant-hydration.test.js
          dist/tests/sec-fix-a1-2-b-tenant-storage.test.js
          dist/tests/sec-fix-a1-2-b-2-tenant-storage-boundary.test.js
          dist/tests/sec-fix-a1-2-c2-tenant-async.test.js
          dist/tests/sec-fix-a1-2-c3-stale-async.test.js

      - name: Tenant cloud context data DR02 DR03 regressions
        run: >-
          node --test --test-concurrency=1
          dist/tests/cloud-api-compatible.test.js
          dist/tests/cloud-records.test.js
          dist/tests/cloud-remote-verification.test.js
          dist/tests/cloud-save-serial.test.js
          dist/tests/sec-fix-a1-dr02-cloud-writer-lease.test.js
          dist/tests/sec-fix-a1-dr03-stale-sync-metadata.test.js
          dist/tests/sec-fix-a3-2-authenticated-write-identity.test.js
          dist/tests/sec-fix-a3-2-runtime-wiring.test.js

      - name: Sync safety reconciliation recovery aggregate
        run: >-
          node --test --test-concurrency=1
          dist/tests/sync-safety.test.js
          dist/tests/sync-reconciliation.test.js
          dist/tests/sync-recovery-bootstrap.test.js
          dist/tests/sync-conflict-ui.test.js
          dist/tests/sec-fix-a1-2-f-recovery-async.test.js
          dist/tests/sec-fix-a1-2-f-tenant-recovery-cutover.test.js
          dist/tests/sec-fix-a1-fdr01-recovery-authority.test.js

      - name: Sync conflict UI exact and adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sync-conflict-ui.test.js 2>&1 | tee "$RUNNER_TEMP/sync-conflict-ui.tap"
          grep -q '^# tests 4$' "$RUNNER_TEMP/sync-conflict-ui.tap"
          grep -q '^# pass 4$' "$RUNNER_TEMP/sync-conflict-ui.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/sync-conflict-ui.tap"
          grep -q 'el contrato estático tenant-aware rechaza regresiones legacy y pérdida de protecciones' "$RUNNER_TEMP/sync-conflict-ui.tap"
          echo 'SYNC_CONFLICT_UI_EXACT_ADVERSARIAL=4/4 PASS'

      - name: A1.2-F exact F1-F24
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a1-2-f-tenant-recovery-cutover.test.js 2>&1 | tee "$RUNNER_TEMP/a12-f.tap"
          grep -q '^# tests 24$' "$RUNNER_TEMP/a12-f.tap"
          grep -q '^# pass 24$' "$RUNNER_TEMP/a12-f.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/a12-f.tap"
          grep -q 'F1 backup A sólo puede restaurarse bajo A' "$RUNNER_TEMP/a12-f.tap"
          grep -q 'F24 disponibilidad y restore validan tenant' "$RUNNER_TEMP/a12-f.tap"
          echo 'A1_2_F=F1-F24 PASS'

      - name: FDR01 recovery authority exact
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a1-fdr01-recovery-authority.test.js

      - name: Team tenant authority regressions
        run: >-
          node --test --test-concurrency=1
          dist/tests/team-management.test.js
          dist/tests/team-policy.test.js
          dist/tests/sec-fix-a1-2-e-team-tenant-authority.test.js

      - name: Gate A exact 113 of 113
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/b1-4-2-supervised-recommendation-instrumentation.test.js \
            dist/tests/b1-4-2-r3-recommendation-lifecycle.test.js \
            dist/tests/b1-4-2-r4-exactly-once-coalescing.test.js \
            dist/tests/b1-4-2-r5-canonical-telemetry.test.js \
            dist/tests/sec-fix-a3-3-recommendation-telemetry-tenant-authority.test.js \
            2>&1 | tee "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# tests 113$' "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# pass 113$' "$RUNNER_TEMP/gate-a.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/gate-a.tap"
          echo 'GATE_A=113/113 PASS'

      - name: Static anti-bypass firewall exact
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/sec-fix-a3-3-anti-bypass-static-guards.test.js 2>&1 | tee "$RUNNER_TEMP/firewall.tap"
          grep -q '^# tests 12$' "$RUNNER_TEMP/firewall.tap"
          grep -q '^# pass 12$' "$RUNNER_TEMP/firewall.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/firewall.tap"
          echo 'STATIC_ANTI_BYPASS_FIREWALL=12/12 PASS'

      - name: Gate B
        run: >-
          node --test --test-concurrency=1
          dist/tests/team-management.test.js
          dist/tests/team-policy.test.js
          dist/tests/sec-fix-a1-2-e-team-tenant-authority.test.js

      - name: FIX3 #528 focal closure evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts
          log="$RUNNER_TEMP/528-full-closure.tap"
          node --test --test-concurrency=1 dist/tests/followup-cloud-persistence-browser.test.js 2>&1 | tee "$log"
          grep -q '^# pass 1$' "$log"
          grep -q '^# fail 0$' "$log"
          grep -q 'FIRST_POST_CLASSIFICATION=CONTACT_PLUS_FOLLOWUP' "$log"
          grep -q 'FIRST_POST_NEXT_FOLLOWUP=2026-08-10' "$log"
          grep -q 'FIRST_RELEASE_PENDING_WHILE_LATEST_LOCAL_SAVED=YES' "$log"
          grep -q 'CRM_POST_COUNT_BEFORE_RELEASE=1' "$log"
          grep -q 'LOCAL_LATEST_NEXT_FOLLOWUP=2026-08-14' "$log"
          grep -q 'REMOTE_FINAL_NEXT_FOLLOWUP=2026-08-14' "$log"
          grep -q 'REMOTE_FINAL_NEXT_ACTION=Volver a contactar por WhatsApp' "$log"
          grep -q 'CONTACT_ACTIVITY_COUNT=1' "$log"
          grep -q 'FOLLOWUP_ACTIVITY_COUNT=1' "$log"
          grep -q 'FINAL_DIRTY=false' "$log"
          grep -q 'FIRST_RELEASE_FORCED=NO' "$log"
          artifact_dir="$(grep 'TEST_528_ARTIFACT_DIR=' "$log" | tail -1 | cut -d= -f2-)"
          test -n "$artifact_dir"
          case "$artifact_dir" in "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) echo "repo-local artifact dir: $artifact_dir"; exit 1;; esac
          test ! -e artifacts
          echo 'REPO_LOCAL_ARTIFACTS_FROM_528=NO'
          echo 'TEST_528_FIX3_FOCAL=GREEN'

      - name: Security matrix exact candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"
          git diff --name-only "$OFFICIAL_A35..$CANDIDATE" | LC_ALL=C sort > "$RUNNER_TEMP/a35-security-final-delta.txt"
          diff -u "$RUNNER_TEMP/a35-expected-delta.txt" "$RUNNER_TEMP/a35-security-final-delta.txt"
          echo 'SECURITY_MATRIX_EXACT_CANDIDATE_PROOF=PASS'
          echo 'FULL_CLOSURE_SECURITY_REGRESSIONS=GREEN'

  gate-c:
    needs: security-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout exact detached candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Prove immutable candidate and refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          test ! -e artifacts
          echo 'ARTIFACTS_BEFORE_GATES=ABSENT'

      - name: Extract and prove canonical Gate C scripts 1-27 unchanged
        shell: bash
        run: |
          set -euo pipefail
          git show "$VALIDATION_BASE:.github/workflows/a33-gate-c-final.yml" > "$RUNNER_TEMP/a33-gate-c-final.yml"
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          require 'digest'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each do |number, script|
            target = File.join(out, format('gate-%02d.sh', number))
            File.binwrite(target, script)
            raise "GATE_#{number}_BYTE_DRIFT" unless File.binread(target).b == script.b
            puts format('GATE_%02d_CANONICAL_SHA256=%s', number, Digest::SHA256.hexdigest(script))
          end
          puts 'CANONICAL_GATE_COUNT=27'
          puts 'CANONICAL_GATE_SCRIPTS_UNMODIFIED=YES'
          RUBY

      - name: Execute canonical Gates 1-19 with pre-Gate19 artifact fence
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          passed=0
          for n in $(seq 1 19); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            test ! -e artifacts
            echo "=== EXECUTE_CANONICAL_GATE_${n} ==="
            if test "$n" = '3'; then
              rm -rf /tmp/a35-gate3-historical
              git worktree add --detach /tmp/a35-gate3-historical "$PRE_A34"
              (
                cd /tmp/a35-gate3-historical
                bash "$script"
              )
              git worktree remove --force /tmp/a35-gate3-historical
              echo 'GATE_03_HISTORICAL_CONTROL=PASS'
            else
              bash "$script"
            fi
            passed=$((passed+1))
            echo "GATE_$(printf '%02d' "$n")_EXECUTION=PASS"
            if test "$n" -le 18; then
              test ! -e artifacts
              echo "ARTIFACTS_AFTER_GATE_$(printf '%02d' "$n")=ABSENT"
            fi
          done
          test "$passed" = '19'
          printf '%s\n' "$passed" > "$RUNNER_TEMP/gate-c-pass-count"
          echo 'GATES_01_TO_19=PASS'

      - name: Strictly validate and normalize known Gate 19 visual side-output
        shell: bash
        run: |
          set -euo pipefail
          expected_files=(
            'artifacts/b1-3/01-mobile-panel-contacto.png'
            'artifacts/b1-3/02-mobile-confirmacion-regreso.png'
            'artifacts/b1-3/03-mobile-proximo-seguimiento.png'
            'artifacts/b1-3/04-escritorio-contacto.png'
            'artifacts/b1-3/05-seguimiento-vencido.png'
            'artifacts/b1-3/06-numero-invalido.png'
          )
          refuse() {
            echo 'ARTIFACT_NORMALIZATION=REFUSED_UNEXPECTED_CONTENT'
            exit 1
          }
          test -d artifacts || refuse
          test ! -L artifacts || refuse
          test -d artifacts/b1-3 || refuse
          test ! -L artifacts/b1-3 || refuse
          {
            echo 'd artifacts/b1-3'
            for f in "${expected_files[@]}"; do echo "f $f"; done
          } | LC_ALL=C sort > "$RUNNER_TEMP/gate19-expected-entries.txt"
          find artifacts -mindepth 1 -printf '%y %p\n' | LC_ALL=C sort > "$RUNNER_TEMP/gate19-actual-entries.txt"
          if ! diff -u "$RUNNER_TEMP/gate19-expected-entries.txt" "$RUNNER_TEMP/gate19-actual-entries.txt"; then refuse; fi
          file_count="$(find artifacts -type f | wc -l | tr -d ' ')"
          test "$file_count" = '6' || refuse
          echo "ARTIFACT_FILE_COUNT=$file_count"
          : > "$RUNNER_TEMP/gate19-visual-sha256.txt"
          for f in "${expected_files[@]}"; do
            test -f "$f" || refuse
            test ! -L "$f" || refuse
            test -s "$f" || refuse
            signature="$(od -An -tx1 -N8 "$f" | tr -d ' \n')"
            test "$signature" = '89504e470d0a1a0a' || refuse
            size="$(stat -c '%s' "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$f" | tee -a "$RUNNER_TEMP/gate19-visual-sha256.txt"
            echo "GATE19_VISUAL_FILE=$f SIZE=$size PNG_SIGNATURE=$signature SHA256=$sha"
          done
          echo 'KNOWN_GATE19_VISUAL_OUTPUT_VALIDATED=YES'
          echo 'UNEXPECTED_ARTIFACTS=0'
          for f in "${expected_files[@]}"; do rm -- "$f"; done
          rmdir artifacts/b1-3
          rmdir artifacts
          test ! -e artifacts
          echo 'KNOWN_GATE19_VISUAL_OUTPUT_NORMALIZED=YES'
          echo 'ARTIFACT_NORMALIZATION=STRICT_KNOWN_OUTPUT_ONLY'
          echo 'UNEXPECTED_ARTIFACTS=0'

      - name: Execute canonical Gates 20-27
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE A31_FINAL A32_FINAL A33_RUNTIME A33_GATE_A_ALIGNMENT ACCIDENTAL
          passed="$(cat "$RUNNER_TEMP/gate-c-pass-count")"
          test "$passed" = '19'
          for n in $(seq 20 27); do
            printf -v script '%s/gate-%02d.sh' "$RUNNER_TEMP" "$n"
            bash "$script"
            passed=$((passed+1))
            echo "GATE_$(printf '%02d' "$n")_EXECUTION=PASS"
          done
          test "$passed" = '27'
          printf '%s\n' "$passed" > "$RUNNER_TEMP/gate-c-pass-count"
          echo 'GATE_C_TESTS_EXACT=27/27'
          echo 'GATE_C_RESULT=GREEN'

      - name: Prove canonical scripts unchanged after Gate C
        shell: bash
        run: |
          set -euo pipefail
          ruby - "$RUNNER_TEMP/a33-gate-c-final.yml" "$RUNNER_TEMP" <<'RUBY'
          require 'yaml'
          path, out = ARGV
          doc = YAML.load_file(path, aliases: true)
          steps = doc.fetch('jobs').fetch('gate-c').fetch('steps')
          gates = steps.filter_map do |step|
            name = step['name'].to_s
            match = name.match(/^Gate (\d+) - /)
            next unless match
            [Integer(match[1]), step.fetch('run')]
          end
          raise "CANONICAL_GATE_COUNT=#{gates.length}" unless gates.map(&:first) == (1..27).to_a
          gates.each do |number, script|
            target = File.join(out, format('gate-%02d.sh', number))
            raise "GATE_#{number}_MODIFIED" unless File.binread(target).b == script.b
          end
          puts 'CANONICAL_GATE_SCRIPTS_UNMODIFIED=YES'
          RUBY
          test "$(cat "$RUNNER_TEMP/gate-c-pass-count")" = '27'
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          echo 'FULL_CLOSURE_GATE_C=GREEN_27_27'

  full-ci-browsers-evidence:
    needs: gate-c
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout exact detached A3.5 candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Assert exact detached candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Direct asset cache-bust CI check
        run: node scripts/verify-direct-asset-cache-bust.mjs --ci

      - name: Install dependencies
        run: npm ci --silent

      - name: Provision Chromium and WebKit
        shell: bash
        run: |
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          npx playwright install --with-deps chromium webkit

      - name: Build exact candidate
        run: npm run build --silent

      - name: Full CI test suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ci --silent 2>&1 | tee "$RUNNER_TEMP/full-ci.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/full-ci.tap"
          echo 'FULL_CI=PASS'

      - name: Explicit WebKit and Leads reconciliation replay
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/leads-mobile-priority-webkit.test.js \
            dist/tests/leads-desktop-zero-training.test.js \
            dist/tests/leads-professional-redesign.test.js \
            dist/tests/direct-asset-cache-bust.test.js \
            2>&1 | tee "$RUNNER_TEMP/webkit-leads.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/webkit-leads.tap"
          echo 'WEBKIT_LEADS_RECONCILIATION=PASS'

      - name: Verify critical generated browser evidence
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            artifacts/leads-mobile-webkit-validation \
            artifacts/leads-redesign \
            artifacts/leads-zero-training-phase1 \
            artifacts/leads-mobile-real-validation \
            artifacts/leads-desktop-zero-training \
            artifacts/leads-desktop-zero-training-webkit; do
            test -d "$directory"
            test "$(find "$directory" -maxdepth 1 -type f -name '*.png' | wc -l)" -gt 0
          done
          echo 'LEADS_EVIDENCE_ARTIFACTS=PASS'
          echo 'RESPONSIVE_FINAL=PASS'

      - name: Assert candidate tracked state and refs unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')" = "$OFFICIAL_A35"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')" = "$RELEASE_SHA"
          echo 'FULL_CI_BROWSERS_EVIDENCE=GREEN'

  final-proof:
    needs: full-ci-browsers-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact detached A3.5 candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - name: Final exact scope and immutable remote refs proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"

          product_live="$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')"
          main_live="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          release_live="$(git ls-remote origin refs/heads/$RELEASE_BRANCH | awk '{print $1}')"
          test "$product_live" = "$OFFICIAL_A35"
          test "$main_live" = "$MAIN_SHA"
          test "$release_live" = "$RELEASE_SHA"

          git diff --name-only "$OFFICIAL_A35..$CANDIDATE" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual-delta.txt"
          cat > "$RUNNER_TEMP/final-expected-delta.txt" <<'EOF'
          src/tests/followup-cloud-persistence-browser.test.ts
          src/tests/followup-cloud-persistence.test.ts
          src/tests/sync-conflict-ui.test.ts
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/final-expected-delta.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/final-expected-delta.txt" "$RUNNER_TEMP/final-expected-delta.txt"
          diff -u "$RUNNER_TEMP/final-expected-delta.txt" "$RUNNER_TEMP/final-actual-delta.txt"

          grep '^src/' "$RUNNER_TEMP/final-actual-delta.txt" | grep -v '^src/tests/' > "$RUNNER_TEMP/final-runtime-delta.txt" || true
          grep -E '\.sql$' "$RUNNER_TEMP/final-actual-delta.txt" > "$RUNNER_TEMP/final-sql-delta.txt" || true
          grep '^supabase/migrations/' "$RUNNER_TEMP/final-actual-delta.txt" > "$RUNNER_TEMP/final-migration-delta.txt" || true
          grep '^\.github/workflows/' "$RUNNER_TEMP/final-actual-delta.txt" > "$RUNNER_TEMP/final-workflow-delta.txt" || true
          test ! -s "$RUNNER_TEMP/final-runtime-delta.txt"
          test ! -s "$RUNNER_TEMP/final-sql-delta.txt"
          test ! -s "$RUNNER_TEMP/final-migration-delta.txt"
          test ! -s "$RUNNER_TEMP/final-workflow-delta.txt"

          echo "CANDIDATE=$CANDIDATE"
          echo "OFFICIAL_A3_5=$product_live"
          echo "MAIN=$main_live"
          echo "RELEASE=$release_live"
          echo 'PRODUCT_RUNTIME_DELTA=0'
          echo 'PRODUCT_SQL_DELTA=0'
          echo 'PRODUCT_MIGRATION_DELTA=0'
          echo 'PRODUCT_WORKFLOW_DELTA=0'
          echo 'CANDIDATE_UNCHANGED=YES'
          echo 'MAIN_UNCHANGED=YES'
          echo 'OFFICIAL_A3_5_UNCHANGED=YES'
          echo 'RELEASE_UNCHANGED=YES'
          echo 'NO_PRODUCT_MUTATION=YES'
          echo 'FULL_CLOSURE_SECURITY_REGRESSIONS=GREEN'
          echo 'FULL_CLOSURE_GATE_C=GREEN_27_27'
          echo 'FULL_CLOSURE_CI_BROWSERS_EVIDENCE=GREEN'
          echo 'FULL_CLOSURE_FINAL_PROOF=GREEN'
          echo 'FULL_CLOSURE=GREEN'
          echo 'NO_FAST_FORWARD=YES'
          echo 'NO_MERGE=YES'
          echo 'NO_DEPLOY=YES'
          echo 'NO_SUPABASE_CHANGE=YES'
          echo 'NO_RAILWAY_CHANGE=YES'
          echo 'NO_CLAUDE=YES'
          echo 'A3.5=CANDIDATE_FULLY_GREEN_PENDING_CEREBRO_LIVE_VERIFICATION'
