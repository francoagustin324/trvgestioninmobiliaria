name: Release WebKit Targeted Validation

on:
  push:
    branches:
      - validation/release-webkit-authority-characterization
    paths:
      - .github/workflows/release-webkit-targeted-validation.yml

permissions:
  contents: write

env:
  RELEASE_BRANCH: release/a34-webkit-572-reconciliation
  VALIDATION_BRANCH: validation/release-webkit-authority-characterization
  BASE_SHA: 159a5146edfb295b74a674c922cc1bac91c242e7

jobs:
  roster-fix-targeted-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact release detached
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Prove exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$BASE_SHA"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "BASE_RELEASE_SHA=$BASE_SHA"

      - name: Apply one-path Desktop roster alignment
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$VALIDATION_BRANCH:.github/validation/align-leads-browser-a34.py" > "$RUNNER_TEMP/fix-desktop-roster-a34.py"
          python "$RUNNER_TEMP/fix-desktop-roster-a34.py"
          mapfile -t paths < <(git diff --name-only)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "src/tests/leads-desktop-zero-training.test.ts"
          echo "FIX_PATHS=1"
          echo "RUNTIME_PATHS=0"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Precommit compile guard
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent
          npm run build --silent
          mapfile -t paths < <(git diff --name-only)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "src/tests/leads-desktop-zero-training.test.ts"

      - name: Create exactly one TEST-ONLY roster commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/leads-desktop-zero-training.test.ts
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "src/tests/leads-desktop-zero-training.test.ts"
          git commit -m 'TEST-ONLY: preserve multi-member roster in Desktop authority fixture'
          NEW_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#committed[@]}" -eq 1
          test "${committed[0]}" = "src/tests/leads-desktop-zero-training.test.ts"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$NEW_SHA"
          echo "NEW_RELEASE_SHA=$NEW_SHA" | tee -a "$GITHUB_ENV"
          echo "FIX_PATHS=1"
          echo "RUNTIME_PATHS=0"

      - name: Checkout new exact release detached
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$NEW_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$NEW_RELEASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$NEW_RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          echo "EXECUTION_SHA=$NEW_RELEASE_SHA"

      - name: Provision Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Browser prerequisite for Chromium contracts
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; exit 0; fi
          if command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; exit 0; fi
          if command -v chromium >/dev/null 2>&1; then chromium --version; exit 0; fi
          if command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version; exit 0; fi
          exit 1

      - name: Fresh build new exact release
        run: npm run build --silent

      - name: WebKit 572 regression remains 4 of 4
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/webkit-572.tap"
          node --test --test-concurrency=1 dist/tests/leads-mobile-priority-webkit.test.js | tee "$log"
          grep -Eq '^# tests 4$' "$log"
          grep -Eq '^# pass 4$' "$log"
          grep -Eq '^# fail 0$' "$log"
          grep -Fq 'WebKit regression \#572:' "$log"
          grep -Eq '^ok [0-9]+ - Chromium: prioridad accionable' "$log"
          grep -Eq '^ok [0-9]+ - WebKit automatizado:' "$log"
          echo "WEBKIT_572=4/4 PASS"

      - name: Desktop zero-training and professional redesign 5 of 5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/leads-browser-fixtures.tap"
          node --test --test-concurrency=1 \
            dist/tests/leads-desktop-zero-training.test.js \
            dist/tests/leads-professional-redesign.test.js | tee "$log"
          grep -Eq '^# tests 5$' "$log"
          grep -Eq '^# pass 5$' "$log"
          grep -Eq '^# fail 0$' "$log"
          grep -Eq '^ok [0-9]+ - PR143 desktop cero capacitación Chromium \+ regresión móvil$' "$log"
          grep -Eq '^ok [0-9]+ - PR143 WebKit desktop 1280/1440$' "$log"
          grep -Eq '^ok [0-9]+ - PR143 cache bust: todo runtime modificado cambia URL servida$' "$log"
          grep -Eq '^ok [0-9]+ - rediseño de Leads permanece aislado de la lógica comercial aprobada$' "$log"
          grep -Eq '^ok [0-9]+ - rediseño profesional valida desktop, laptop, tablet, Motorola y teclado reducido$' "$log"
          grep -Fq 'PR143_ASSIGNEE_OPTIONS=' "$log"
          grep -F 'PR143_ASSIGNEE_OPTIONS=' "$log" | grep -Fq '"value":"1"'
          grep -F 'PR143_ASSIGNEE_OPTIONS=' "$log" | grep -Fq '"value":"2"'
          echo "DESKTOP_ZERO_TRAINING_CHROMIUM=PASS"
          echo "DESKTOP_ZERO_TRAINING_WEBKIT=PASS"
          echo "ASSIGNEE_FILTER_PRESENT=PASS"
          echo "ASSIGNEE_OPTIONS_INCLUDE_MEMBER_1_AND_2=PASS"
          echo "CACHE_BUST_SPECIFIC_ASSERTION=PASS"
          echo "PROFESSIONAL_REDESIGN_ISOLATION=PASS"
          echo "PROFESSIONAL_REDESIGN_RESPONSIVE=PASS"
          echo "LEADS_DESKTOP_AND_REDESIGN=5/5 PASS"

      - name: Targeted exact-scope integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_RELEASE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$NEW_RELEASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "src/tests/leads-desktop-zero-training.test.ts"
          git diff --quiet
          git diff --cached --quiet
          echo "TARGETED_ROSTER_ALIGNMENT=GREEN"
          echo "NEW_RELEASE_SHA=$NEW_RELEASE_SHA"
          echo "FIX_PATHS=1"
          echo "RUNTIME_PATHS=0"
          echo "TRACKED_DIFF=EMPTY"
          echo "CACHED_DIFF=EMPTY"
