name: SEC-FIX A2.4 construction
on:
  push:
    branches:
      - validation/sec-fix-a2-4-construction
permissions:
  contents: write
jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sec-fix-a2-4-org-aware-rpc-v2-alignment
          fetch-depth: 0
      - name: Generate A2.4 test from frozen A1.1 executable contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/tests/sec-fix-a1-1-org-aware-db-compat.test.ts')
          target_path = Path('src/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.ts')
          text = source_path.read_text()
          text = text.replace(
            "const migrationPath = 'supabase/migrations/20260907224500_sec_fix_a1_1_org_aware_db_compat.sql';",
            "const migrationPath = 'supabase/migrations/20260910140000_sec_fix_a2_4_org_aware_rpc_v2_alignment.sql';\nconst tenantV2Path = 'src/tenant-visit-v2.ts';"
          )
          text = text.replace("const migration = readFileSync(migrationPath, 'utf8');", "const migration = readFileSync(migrationPath, 'utf8');\nconst tenantV2 = readFileSync(tenantV2Path, 'utf8');")
          text = text.replace("test('SEC-FIX-A1.1 migration es aditiva, V2 explícita y conserva archivos legacy'", "test('SEC-FIX A2.4 conserva contrato A1.1, explicita tenant y no toca legacy'")
          text = text.replace("test('SEC-FIX-A1.1 ejecuta V2 y coexistencia legacy en PostgreSQL 17 efímero'", "test('SEC-FIX A2.4 ejecuta V2 org-aware y drift alignment en PostgreSQL 17 efímero'")
          text = text.replace("/create function public\\.visit_transaction_authority_active_v2", "/create or replace function public\\.visit_transaction_authority_active_v2")
          text = text.replace("/create function public\\.client_snapshot_cas_v2", "/create or replace function public\\.client_snapshot_cas_v2")
          text = text.replace("/create function public\\.commercial_visit_mutation_v2", "/create or replace function public\\.commercial_visit_mutation_v2")
          text = text.replace("    create role authenticated nologin;", "    create role authenticated nologin;\n      create role service_role nologin;")
          text = text.replace("and pg_catalog.lower(status)='active'", "and status='active'")
          text = text.replace("  const noMember = 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee';", "  const noMember = 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee';\n  const unknownUser = 'abababab-abab-4bab-8bab-abababababab';")
          text = text.replace("        ('${orgA}','${suspendedUser}',4,'admin','suspended'),", "        ('${orgA}','${suspendedUser}',4,'admin','suspended'),\n        ('${orgA}','${unknownUser}',6,'admin','unknown'),")
          text = text.replace("for (const actor of [noMember, invitedUser, suspendedUser])", "for (const actor of [noMember, invitedUser, suspendedUser, unknownUser])")

          static_marker = "  assert.doesNotMatch(migration, /insert\\s+into\\s+private\\.commercial_entity_authority/i);"
          static_extra = r'''
          assert.match(migration, /and member\.status = 'active'/);
          assert.match(migration, /and target_member\.status = 'active'/);
          assert.doesNotMatch(migration, /visit_normalized\(member\.status\)/);
          assert.match(migration, /firma\/overload incompatible/);
          assert.match(tenantV2, /'visit_transaction_authority_active_v2'[\s\S]*p_organization_id: scope\.organizationId/);
          assert.match(tenantV2, /'client_snapshot_cas_v2'[\s\S]*p_organization_id: scope\.organizationId/);
          assert.match(tenantV2, /'commercial_visit_mutation_v2'[\s\S]*p_organization_id: scope\.organizationId/);
          assert.doesNotMatch(migration, /public\.commercial_visit_mutation\s*\(/);
          assert.doesNotMatch(migration, /public\.client_snapshot_cas\s*\(/);
          assert.doesNotMatch(migration, /public\.visit_transaction_authority_active\s*\(\s*\)/);
          '''
          text = text.replace(static_marker, static_marker + static_extra)

          acl_marker = "    assert.equal(psql(`select has_function_privilege('anon','public.commercial_visit_mutation_v2(uuid,uuid,text,jsonb,boolean)','execute');`), 'f');"
          acl_extra = r'''
              assert.equal(psql(`select has_function_privilege('public','public.visit_transaction_authority_active_v2(uuid)','execute');`), 'f');
              assert.equal(psql(`select has_function_privilege('public','public.client_snapshot_cas_v2(uuid,jsonb,boolean)','execute');`), 'f');
              assert.equal(psql(`select has_function_privilege('public','public.commercial_visit_mutation_v2(uuid,uuid,text,jsonb,boolean)','execute');`), 'f');
              assert.equal(psql(`select has_function_privilege('service_role','public.visit_transaction_authority_active_v2(uuid)','execute');`), 'f');
              assert.equal(psql(`select has_function_privilege('service_role','public.client_snapshot_cas_v2(uuid,jsonb,boolean)','execute');`), 'f');
              assert.equal(psql(`select has_function_privilege('service_role','public.commercial_visit_mutation_v2(uuid,uuid,text,jsonb,boolean)','execute');`), 'f');
          '''
          text = text.replace(acl_marker, acl_marker + acl_extra)

          cas_marker = "    assert.match(crossClient, /NOT_FOUND/);"
          cas_extra = r'''

              for (const actor of [invitedUser, suspendedUser, unknownUser]) {
                const denied = asUserError(actor, casV2(orgA, {
                  action: 'update', client: { legacyId: 2 }, expectedRevision: 0,
                  payload: readyClient(2),
                }));
                assert.match(denied, /42501/);
                assert.match(denied, /PERMISSION_DENIED/);
              }
              assert.match(asUserError(singleOwner, casV2(orgB, {
                action: 'update', client: { legacyId: 200 }, expectedRevision: 0,
                payload: readyClient(200),
              })), /PERMISSION_DENIED/);
          '''
          text = text.replace(cas_marker, cas_marker + cas_extra)

          visit_marker = "    assert.match(asUserError(multiOwner, visitV2(orgA, randomUUID(), 'VISIT_CREATE', createRequest(11, 200))), /NOT_FOUND/);"
          visit_extra = r'''
              for (const actor of [invitedUser, suspendedUser, unknownUser]) {
                const denied = asUserError(actor, visitV2(orgA, randomUUID(), 'VISIT_CREATE', createRequest(11, 1)));
                assert.match(denied, /42501/);
                assert.match(denied, /PERMISSION_DENIED/);
              }
          '''
          text = text.replace(visit_marker, visit_marker + visit_extra)

          end_marker = "    assert.equal(psql(`select count(*) from public.propcontrol_records where organization_id='${orgA}' and entity_type='activity' and payload->>'operationId'='${coexistOp}';`), '1');"
          end_extra = r'''

              // Schema/drift 23-25: absent fue creado arriba; rerun correcto es estable; drift reconciliable vuelve al contrato.
              const definitionsBeforeRerun = psql(`select pg_catalog.jsonb_object_agg(p.proname, pg_catalog.md5(pg_catalog.pg_get_functiondef(p.oid)))
                from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname in ('visit_transaction_authority_active_v2','client_snapshot_cas_v2','commercial_visit_mutation_v2');`);
              psql(migration);
              const definitionsAfterRerun = psql(`select pg_catalog.jsonb_object_agg(p.proname, pg_catalog.md5(pg_catalog.pg_get_functiondef(p.oid)))
                from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname in ('visit_transaction_authority_active_v2','client_snapshot_cas_v2','commercial_visit_mutation_v2');`);
              assert.equal(definitionsAfterRerun, definitionsBeforeRerun);

              psql(`
                create or replace function public.visit_transaction_authority_active_v2(p_organization_id uuid)
                returns boolean language sql stable security definer set search_path=public
                as $drift$ select false $drift$;
                grant execute on function public.visit_transaction_authority_active_v2(uuid) to service_role;
              `);
              assert.equal(psql(`select p.prosecdef from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), 't');
              psql(migration);
              assert.equal(psql(`select p.prosecdef from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), 'f');
              assert.equal(psql(`select p.proconfig::text from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), '{search_path=""}');
              assert.equal(psql(`select has_function_privilege('service_role','public.visit_transaction_authority_active_v2(uuid)','execute');`), 'f');
              assert.equal(asUser(multiOwner, authorityV2(orgA)), 't');

              // 26. dependencia crítica faltante: ABORT transaccional antes de reconciliar cualquier V2.
              psql(`
                create or replace function public.visit_transaction_authority_active_v2(p_organization_id uuid)
                returns boolean language sql stable security definer set search_path=public
                as $drift$ select false $drift$;
                alter function private.visit_qualification_missing(jsonb) rename to visit_qualification_missing_missing;
              `);
              const missingDependency = rawPsql(migration);
              assert.notEqual(missingDependency.status, 0);
              assert.match(`${missingDependency.stderr}\n${missingDependency.stdout}`, /falta dependencia private\.visit_qualification_missing\(jsonb\)/);
              assert.equal(psql(`select p.prosecdef from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), 't');
          '''
          text = text.replace(end_marker, end_marker + end_extra)

          target_path.write_text(text)
          PY
          git diff --check
          git add src/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='PropControl Validation' -c user.email='actions@users.noreply.github.com' commit -m 'SEC-FIX A2.4 — Add org-aware V2 alignment coverage'
            git push origin HEAD:agent/sec-fix-a2-4-org-aware-rpc-v2-alignment
          fi
