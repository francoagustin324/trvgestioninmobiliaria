name: SEC-FIX A3.2 Page Load Commit Bisect
on:
  push:
    branches: [validation/sec-fix-a3-2-inventory]
permissions:
  contents: read
jobs:
  bisect-page-load:
    if: contains(github.event.head_commit.message, 'bisect a3.2 page load effect')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A_SHA: d097a1cc9432e7233f4f6968083319aa2a13f623
      B_SHA: aa91b36121b315cf910146fa5fa64b3b88fd37da
      CANDIDATE_SHA: e7fb056b6ad90bfc54db896cb682e9697f656784
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert environment
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Prepare exact worktrees
        shell: bash
        run: |
          set -euo pipefail
          for spec in "base:$BASE_SHA" "a:$A_SHA" "b:$B_SHA" "candidate:$CANDIDATE_SHA"; do
            label="${spec%%:*}"; sha="${spec#*:}"; dir="/tmp/a32-${label}"
            rm -rf "$dir"
            git worktree add --detach "$dir" "$sha"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            (cd "$dir" && npm ci >/dev/null && npm run build >/dev/null)
            echo "$label=$sha"
          done
      - name: Probe Chrome DOMContentLoaded proxy by dump-dom
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; dir="$2"; port="$3"
            out="/tmp/${label}-server.out"; err="/tmp/${label}-server.err"
            (
              cd "$dir"
              env PORT="$port" SUPABASE_URL='' SUPABASE_PUBLISHABLE_KEY='' SUPABASE_SECRET_KEY='' SUPABASE_SERVICE_ROLE_KEY='' LEAD_QUALIFICATION_AI_ENDPOINT='' LEAD_QUALIFICATION_AI_KEY='' LEAD_QUALIFICATION_AI_MODEL='' node dist/server.js
            ) >"$out" 2>"$err" &
            pid=$!
            start=$(date +%s%3N)
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS --max-time 1 "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 0.25
            done
            test "$ok" -eq 1
            health_ms=$(( $(date +%s%3N) - start ))
            root_meta=$(curl -sS --max-time 5 -o /tmp/${label}-root.html -w 'HTTP=%{http_code} TIME=%{time_total}' "http://127.0.0.1:${port}/")
            chrome_start=$(date +%s%3N)
            set +e
            timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:${port}/" >/tmp/${label}-dom.out 2>/tmp/${label}-chrome.err
            rc=$?
            set -e
            chrome_ms=$(( $(date +%s%3N) - chrome_start ))
            alive=0; kill -0 "$pid" 2>/dev/null && alive=1 || true
            echo "RESULT label=$label sha=$(git -C "$dir" rev-parse HEAD) port=$port health_ms=$health_ms root=[$root_meta] chrome_rc=$rc chrome_ms=$chrome_ms dom_bytes=$(wc -c </tmp/${label}-dom.out) server_alive=$alive"
            echo "SERVER_STDOUT[$label]=$(tr '\n' ' ' < "$out")"
            echo "SERVER_STDERR[$label]=$(tr '\n' ' ' < "$err")"
            if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; set +e; wait "$pid"; set -e; fi
          }
          probe base /tmp/a32-base 64201
          probe a /tmp/a32-a 64202
          probe b /tmp/a32-b 64203
          probe candidate /tmp/a32-candidate 64204
      - name: Classify introducing commit
        shell: bash
        run: |
          set -euo pipefail
          extract_rc(){ grep "RESULT label=$1 " "$GITHUB_STEP_SUMMARY" 2>/dev/null || true; }
          echo "Review RESULT lines above. Expected discriminator: rc=0 loads; rc=124 hangs."
