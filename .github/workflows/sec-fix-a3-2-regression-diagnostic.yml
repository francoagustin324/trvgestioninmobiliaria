name: SEC-FIX A3.2 WhatsApp Contact Sufficiency Control
on:
  push:
    branches: [validation/sec-fix-a3-2-inventory]
permissions:
  contents: read
jobs:
  whatsapp-contact-sufficiency:
    if: contains(github.event.head_commit.message, 'confirm whatsapp-contact page-load causality')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_SHA: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A_SHA: d097a1cc9432e7233f4f6968083319aa2a13f623
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert environment
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Prepare exact control variants
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base-only-wa /tmp/a-revert-wa
          git worktree add --detach /tmp/base-only-wa "$BASE_SHA"
          git -C /tmp/base-only-wa checkout "$A_SHA" -- src/whatsapp-contact.ts
          (cd /tmp/base-only-wa && npm ci >/dev/null && npm run build >/dev/null)
          git worktree add --detach /tmp/a-revert-wa "$A_SHA"
          git -C /tmp/a-revert-wa checkout "$BASE_SHA" -- src/whatsapp-contact.ts
          (cd /tmp/a-revert-wa && npm ci >/dev/null && npm run build >/dev/null)
          echo "BASE_PLUS_ONLY_WA=$(git -C /tmp/base-only-wa rev-parse HEAD) working-tree-file-from=$A_SHA"
          echo "A_MINUS_WA=$(git -C /tmp/a-revert-wa rev-parse HEAD) working-tree-file-from=$BASE_SHA"
      - name: Probe both variants
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; dir="$2"; port="$3"
            out="/tmp/${label}-server.out"; err="/tmp/${label}-server.err"
            (
              cd "$dir"
              env PORT="$port" SUPABASE_URL='' SUPABASE_PUBLISHABLE_KEY='' SUPABASE_SECRET_KEY='' SUPABASE_SERVICE_ROLE_KEY='' LEAD_QUALIFICATION_AI_ENDPOINT='' LEAD_QUALIFICATION_AI_KEY='' LEAD_QUALIFICATION_AI_MODEL='' node dist/server.js
            ) >"$out" 2>"$err" &
            pid=$!
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS --max-time 1 "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 0.25
            done
            test "$ok" -eq 1
            root_meta=$(curl -sS --max-time 5 -o /tmp/${label}-root.html -w 'HTTP=%{http_code} TIME=%{time_total}' "http://127.0.0.1:${port}/")
            start=$(date +%s%3N)
            set +e
            timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:${port}/" >/tmp/${label}-dom.out 2>/tmp/${label}-chrome.err
            rc=$?
            set -e
            ms=$(( $(date +%s%3N) - start ))
            alive=0; kill -0 "$pid" 2>/dev/null && alive=1 || true
            echo "RESULT label=$label chrome_rc=$rc chrome_ms=$ms dom_bytes=$(wc -c </tmp/${label}-dom.out) root=[$root_meta] server_alive=$alive"
            echo "SERVER_STDOUT[$label]=$(tr '\n' ' ' < "$out")"
            echo "SERVER_STDERR[$label]=$(tr '\n' ' ' < "$err")"
            if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; set +e; wait "$pid"; set -e; fi
          }
          probe base-only-wa /tmp/base-only-wa 64501
          probe a-revert-wa /tmp/a-revert-wa 64502
      - name: Assert causal direction
        shell: bash
        run: |
          set -euo pipefail
          echo 'Expected: base+only A3.2-A whatsapp-contact hangs (rc=124); A3.2-A with whatsapp-contact reverted loads (rc=0).'
