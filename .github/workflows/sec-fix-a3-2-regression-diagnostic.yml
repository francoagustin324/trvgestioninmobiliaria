name: SEC-FIX A3.2 A G2 Single File Isolation
on:
  push:
    branches: [validation/sec-fix-a3-2-inventory]
permissions:
  contents: read
jobs:
  isolate-g2-single-file:
    if: contains(github.event.head_commit.message, 'isolate a3.2-a g2 single file')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_SHA: 23f428a87fcc9382ec6ab8489ae8132776bb6d85
      A_SHA: d097a1cc9432e7233f4f6968083319aa2a13f623
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert environment
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Prepare exact A variants with one G2 file reverted each
        shell: bash
        run: |
          set -euo pipefail
          make_variant() {
            label="$1"; file="$2"
            dir="/tmp/a32-${label}"
            rm -rf "$dir"
            git worktree add --detach "$dir" "$A_SHA"
            test "$(git -C "$dir" rev-parse HEAD)" = "$A_SHA"
            git -C "$dir" checkout "$BASE_SHA" -- "$file"
            (cd "$dir" && npm ci >/dev/null && npm run build >/dev/null)
            echo "VARIANT=$label REVERTED=$file"
          }
          make_variant offer src/offer-workflow-ui.ts
          make_variant reservation src/reservation-workflow-ui.ts
          make_variant visit src/visit-workflow-cutover.ts
          make_variant wa-contact src/whatsapp-contact.ts
          make_variant wa-identity src/whatsapp-human-identity.ts
      - name: Probe single-file variants
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; dir="$2"; port="$3"
            out="/tmp/${label}-server.out"; err="/tmp/${label}-server.err"
            (
              cd "$dir"
              env PORT="$port" SUPABASE_URL='' SUPABASE_PUBLISHABLE_KEY='' SUPABASE_SECRET_KEY='' SUPABASE_SERVICE_ROLE_KEY='' LEAD_QUALIFICATION_AI_ENDPOINT='' LEAD_QUALIFICATION_AI_KEY='' LEAD_QUALIFICATION_AI_MODEL='' node dist/server.js
            ) >"$out" 2>"$err" &
            pid=$!
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS --max-time 1 "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 0.25
            done
            test "$ok" -eq 1
            root_meta=$(curl -sS --max-time 5 -o /tmp/${label}-root.html -w 'HTTP=%{http_code} TIME=%{time_total}' "http://127.0.0.1:${port}/")
            start=$(date +%s%3N)
            set +e
            timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:${port}/" >/tmp/${label}-dom.out 2>/tmp/${label}-chrome.err
            rc=$?
            set -e
            ms=$(( $(date +%s%3N) - start ))
            alive=0; kill -0 "$pid" 2>/dev/null && alive=1 || true
            echo "RESULT label=$label chrome_rc=$rc chrome_ms=$ms dom_bytes=$(wc -c </tmp/${label}-dom.out) root=[$root_meta] server_alive=$alive"
            echo "SERVER_STDOUT[$label]=$(tr '\n' ' ' < "$out")"
            echo "SERVER_STDERR[$label]=$(tr '\n' ' ' < "$err")"
            if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; set +e; wait "$pid"; set -e; fi
          }
          probe offer /tmp/a32-offer 64401
          probe reservation /tmp/a32-reservation 64402
          probe visit /tmp/a32-visit 64403
          probe wa-contact /tmp/a32-wa-contact 64404
          probe wa-identity /tmp/a32-wa-identity 64405
      - name: Isolation rule
        shell: bash
        run: |
          set -euo pipefail
          echo 'A single-file reversion returning rc=0 identifies that file as necessary for the page-load regression. If none returns rc=0, investigate interaction between G2 files.'
