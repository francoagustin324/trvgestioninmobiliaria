name: SEC-FIX A3.2 Specific Diagnostic Matrix
on:
  push:
    branches: [validation/sec-fix-a3-2-inventory]
permissions:
  contents: read
jobs:
  behavior:
    if: contains(github.event.head_commit.message, 'run a3.2 specific diagnostic matrix')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: owner-visual-tampering
            pattern: 'TEAM_VIEW_KEY y activeMemberId'
          - case: agent-no-escalation
            pattern: 'agent autenticado mirando owner/admin'
          - case: offers-authenticated-actor
            pattern: 'Offers create/accept/reject'
          - case: reservations-authenticated-actor
            pattern: 'Reservations reserve/cancel'
          - case: multi-org-storage
            pattern: 'mismo usuario y mismo legacy entity id'
          - case: qualification-multi-org
            pattern: 'Qualification session usa userId'
          - case: whatsapp-human-identity
            pattern: 'WhatsApp human identity deriva'
    name: behavior / ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f52d34ff37eaa9b8f0c3566b3753650b3fa7d010
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run exact behavior case
        run: node --test --test-concurrency=1 --test-name-pattern="${{ matrix.pattern }}" dist/tests/sec-fix-a3-2-authenticated-write-identity.test.js

  static-wiring:
    if: contains(github.event.head_commit.message, 'run a3.2 specific diagnostic matrix')
    runs-on: ubuntu-24.04
    name: static-wiring / all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f52d34ff37eaa9b8f0c3566b3753650b3fa7d010
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 dist/tests/sec-fix-a3-2-runtime-wiring.test.js
