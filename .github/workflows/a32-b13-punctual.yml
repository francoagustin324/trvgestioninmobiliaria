name: A3.3 Team Quarantine Static Commit

on:
  push:
    branches:
      - validation/a32-b13-punctual-c143

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sec-fix-a3-3-gate-a-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Create exact static-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "389d164e2de199a25db820b473d9b2968722ebba"
          git show origin/validation/a32-b13-punctual-c143:scripts/validation-a33-team-quarantine-static-align.py > /tmp/a33-static-align.py
          python3 /tmp/a33-static-align.py
          test "$(git diff --name-only)" = "src/tests/sec-fix-a3-3-anti-bypass-static-guards.test.ts"
          git diff --check
          git config user.name "francoagustin324"
          git config user.email "francoagustinsolis@gmail.com"
          git add src/tests/sec-fix-a3-3-anti-bypass-static-guards.test.ts
          git commit -m "TEST-ONLY: fence quarantined legacy team cluster"
          test "$(git rev-parse HEAD^)" = "389d164e2de199a25db820b473d9b2968722ebba"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "src/tests/sec-fix-a3-3-anti-bypass-static-guards.test.ts"
          git push origin HEAD:agent/sec-fix-a3-3-gate-a-clean
          echo "STATIC_ALIGN_SHA=$(git rev-parse HEAD)"
