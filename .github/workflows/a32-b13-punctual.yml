name: A3.2 B1.3 Candidate Control

on:
  push:
    branches:
      - validation/a32-b13-punctual-c143

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact A3.2 candidate
        uses: actions/checkout@v4
        with:
          ref: 349e9ba9e456ef79c3c740a9458290f408c651e6
          fetch-depth: 0

      - name: Assert exact candidate identity and TEST-ONLY scope
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=349e9ba9e456ef79c3c740a9458290f408c651e6
          PARENT=7ded1ab3f43577853b6178a1edcee93361655a40
          EXPECTED_BLOB=7a94fa46e43761d7d96c5eb7258632762eb65a67
          FILE=src/tests/b1-3-whatsapp-contact-real-app.test.ts
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git diff --name-only "$PARENT"..HEAD)" = "$FILE"
          test "$(git rev-parse "HEAD:$FILE")" = "$EXPECTED_BLOB"
          forbidden="$(git diff --name-only "$PARENT"..HEAD -- 'src/**/*.css' 'supabase/**' '*.sql' 'docs/SEC_FIX_A2_5_BASELINE.md' 'docs/SUPABASE_PRODUCTION_BASELINE.md' '.github/workflows/**')"
          test -z "$forbidden"
          echo "B13_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "B13_PARENT_SHA=$(git rev-parse HEAD^)"
          echo "B13_FILE_BLOB=$(git rev-parse "HEAD:$FILE")"
          echo "B13_SCOPE=$FILE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact candidate
        run: npm run build

      - name: Run complete B1.3 control
        run: >-
          node --test --test-concurrency=1
          dist/tests/b1-3-whatsapp-architecture.test.js
          dist/tests/b1-3-whatsapp-contact.test.js
          dist/tests/b1-3-whatsapp-contact-real-app.test.js

      - name: Final exact SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "349e9ba9e456ef79c3c740a9458290f408c651e6"
          echo "FINAL_B13_EXACT_SHA=$(git rev-parse HEAD)"
