name: A3.2 B1.3 Punctual Validation

on:
  push:
    branches:
      - validation/a32-b13-punctual-c143

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact CSS visibility audit
        shell: bash
        run: |
          set -euo pipefail
          SHA=fcc4487782ac820473fda18aa48d3c7fc513e955
          rm -rf /tmp/b13-candidate
          git worktree add --detach /tmp/b13-candidate "$SHA"
          cd /tmp/b13-candidate
          test "$(git rev-parse HEAD)" = "$SHA"
          echo "EXACT_SHA=$(git rev-parse HEAD)"
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const hrefs = [...html.matchAll(/<link\b[^>]*rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi)]
            .map((match) => match[1].split('?')[0].replace(/^\//, ''));
          console.log(`LOADED_CSS_COUNT=${hrefs.length}`);
          hrefs.forEach((href) => console.log(`LOADED_CSS ${href}`));

          const specific = [
            '.whatsapp-message-field',
            '[data-whatsapp-message]',
            '.whatsapp-contact-field',
            '.whatsapp-contact-panel',
            '#propcontrol-whatsapp-contact',
          ];
          const riskyProperty = /^(display|visibility|opacity|height|max-height|min-height|overflow|overflow-x|overflow-y|position|transform|content-visibility|pointer-events)\s*:/i;
          const selectorRelevant = (selector) => specific.some((needle) => selector.includes(needle))
            || /(^|[^\w-])(textarea|label)(?=$|[\s.#:\[>,+~])/i.test(selector);

          function matchingClose(text, open) {
            let depth = 0;
            let quote = '';
            for (let i = open; i < text.length; i += 1) {
              const ch = text[i];
              if (quote) {
                if (ch === '\\') i += 1;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '{') depth += 1;
              if (ch === '}') {
                depth -= 1;
                if (depth === 0) return i;
              }
            }
            return -1;
          }

          function walk(text, file, contexts = []) {
            let cursor = 0;
            while (cursor < text.length) {
              const open = text.indexOf('{', cursor);
              if (open < 0) break;
              const close = matchingClose(text, open);
              if (close < 0) break;
              const prelude = text.slice(cursor, open).trim();
              const body = text.slice(open + 1, close);
              if (prelude.startsWith('@media') || prelude.startsWith('@supports') || prelude.startsWith('@layer')) {
                walk(body, file, [...contexts, prelude.replace(/\s+/g, ' ')]);
              } else if (selectorRelevant(prelude)) {
                const props = body
                  .split(';')
                  .map((line) => line.trim().replace(/\s+/g, ' '))
                  .filter(Boolean)
                  .filter((line) => riskyProperty.test(line));
                console.log('CSS_MATCH');
                console.log(`FILE=${file}`);
                console.log(`CONTEXT=${contexts.length ? contexts.join(' > ') : 'GLOBAL'}`);
                console.log(`SELECTOR=${prelude.replace(/\s+/g, ' ')}`);
                console.log(`RISKY=${props.length ? props.join(' | ') : 'NONE_OF_TARGETED_PROPERTIES'}`);
              }
              cursor = close + 1;
            }
          }

          for (const href of hrefs) {
            if (!fs.existsSync(href)) {
              console.log(`MISSING_CSS ${href}`);
              continue;
            }
            const css = fs.readFileSync(href, 'utf8').replace(/\/\*[\s\S]*?\*\//g, '');
            walk(css, href);
          }
          NODE
