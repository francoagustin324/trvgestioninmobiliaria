name: A3.2 B1.3 Punctual Validation

on:
  push:
    branches:
      - validation/a32-b13-punctual-c143

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Exact mobile visibility diagnostic
        shell: bash
        run: |
          set -euo pipefail
          SHA=fcc4487782ac820473fda18aa48d3c7fc513e955
          rm -rf /tmp/b13-candidate
          git worktree add --detach /tmp/b13-candidate "$SHA"
          cd /tmp/b13-candidate
          test "$(git rev-parse HEAD)" = "$SHA"
          echo "EXACT_SHA=$(git rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/.github/diagnostics/b13-mobile-visibility.py" /tmp/b13-candidate
          npm ci
          npm run build
          node --test --test-concurrency=1 --test-name-pattern='B1.3 DIAGNOSTIC' \
            dist/tests/b1-3-whatsapp-contact-real-app.test.js
