name: A3.3 Gate B Quarantine Validation

on:
  push:
    branches:
      - validation/a32-b13-punctual-c143

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Gate B candidate
        uses: actions/checkout@v4
        with:
          ref: cca85c36a11cc06f52b1663ea23dcbe60092b620
          fetch-depth: 0

      - name: Assert exact history and scopes
        shell: bash
        run: |
          set -euo pipefail
          BASE=c79a50e92bdfcfa1f85f4d2dd9e0995bb6cd50c8
          Q=b5cb9a8fd9d15ca263fcda222cd293775b230fe9
          CANDIDATE=cca85c36a11cc06f52b1663ea23dcbe60092b620
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$Q"
          test "$(git rev-parse HEAD^^)" = "$BASE"
          test -z "$(git status --porcelain)"

          printf '%s\n' \
            src/legacy-quarantine/team-scope.ts \
            src/legacy-quarantine/visit-authority-sync-version.ts \
            src/team-scope.ts \
            src/tests/mvp-scope.test.ts \
            src/visit-authority-sync-version.ts | sort > /tmp/expected-q
          git diff --name-only "$BASE".."$Q" | sort > /tmp/actual-q
          diff -u /tmp/expected-q /tmp/actual-q

          test "$(git diff --name-only "$Q".."$CANDIDATE")" = "src/tests/sec-fix-a3-3-anti-bypass-static-guards.test.ts"
          if git diff --name-only "$BASE".."$CANDIDATE" | grep -E '(^|/)(supabase|migrations?|baseline)(/|$)|\.sql$' >/dev/null; then
            echo 'Forbidden SQL/migration/baseline change'
            exit 1
          fi

          test ! -e src/team-scope.ts
          test ! -e src/visit-authority-sync-version.ts
          test -f src/legacy-quarantine/team-scope.ts
          test -f src/legacy-quarantine/visit-authority-sync-version.ts
          echo "A33_GATE_B_BASE=$BASE"
          echo "A33_GATE_B_QUARANTINE=$Q"
          echo "A33_GATE_B_CANDIDATE=$CANDIDATE"

      - name: Verify quarantine modules are byte-equivalent except required relative imports
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const base = 'c79a50e92bdfcfa1f85f4d2dd9e0995bb6cd50c8';
          const oldVisit = execFileSync('git', ['show', `${base}:src/visit-authority-sync-version.ts`], { encoding: 'utf8' });
          const newVisit = fs.readFileSync('src/legacy-quarantine/visit-authority-sync-version.ts', 'utf8')
            .replaceAll("from '../cloud-records.js'", "from './cloud-records.js'")
            .replaceAll("from '../cloud-api.js'", "from './cloud-api.js'")
            .replaceAll("from '../sync-safety.js'", "from './sync-safety.js'");
          if (oldVisit !== newVisit) throw new Error('visit-authority quarantine changed beyond required import paths');

          const oldTeam = execFileSync('git', ['show', `${base}:src/team-scope.ts`], { encoding: 'utf8' });
          const newTeam = fs.readFileSync('src/legacy-quarantine/team-scope.ts', 'utf8')
            .replaceAll("from '../store.js'", "from './store.js'")
            .replaceAll("from '../team-access.js'", "from './team-access.js'");
          if (oldTeam !== newTeam) throw new Error('team-scope quarantine changed beyond required import paths');
          console.log('QUARANTINE_BYTE_EQUIVALENT_EXCEPT_IMPORT_PATHS=PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Quarantine regression - mvp scope
        run: node --test --test-concurrency=1 dist/tests/mvp-scope.test.js

      - name: Gate B - static anti-bypass firewall
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a3-3-anti-bypass-static-guards.test.js

      - name: Gate A regression - targeted tenant authority
        run: node --test --test-concurrency=1 dist/tests/sec-fix-a3-3-recommendation-telemetry-tenant-authority.test.js

      - name: Gate A regression - supervised recommendation instrumentation
        run: node --test --test-concurrency=1 dist/tests/b1-4-2-supervised-recommendation-instrumentation.test.js

      - name: Gate A regression - R3 recommendation lifecycle
        run: node --test --test-concurrency=1 dist/tests/b1-4-2-r3-recommendation-lifecycle.test.js

      - name: Gate A regression - R4 exactly-once coalescing
        run: node --test --test-concurrency=1 dist/tests/b1-4-2-r4-exactly-once-coalescing.test.js

      - name: Gate A regression - R5 canonical telemetry
        run: node --test --test-concurrency=1 dist/tests/b1-4-2-r5-canonical-telemetry.test.js

      - name: Final exact SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cca85c36a11cc06f52b1663ea23dcbe60092b620"
          echo "FINAL_A33_GATE_B_SHA=$(git rev-parse HEAD)"
