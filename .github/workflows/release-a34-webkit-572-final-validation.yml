name: Release A3.4 + WebKit-572 Final Validation

on:
  push:
    branches: [validation/release-a34-webkit-572-actions]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SHA: a5bfaedc0a51f856c8dda08d74b1bab397bc9660
  RELEASE_BRANCH: release/a34-webkit-572-reconciliation
  A34: 7bb3bdadbe34717cdc8f4d9a6646f8a0b47db1cc
  REPRODUCER: 8fcf454f9ebbc600f205c4494a85fb73db73d1f8
  PRE_A34: 6fbea368b5d0e80d36c0f8171f26be495798f904
  VALIDATION_BASE: 7ecbc8cb50513ea79cd4913ee2a6f821b756c009
  MAIN_EXPECTED: 68034c60f606326a1d75fc3d448c7e99de49b492
  HOTFIX_1: 90d07123d743eb390318b1998786417efebae0ef
  HOTFIX_2: 2aa927f0f6ecde65cfcebba3deeb54b801b68de9
  HOTFIX_3: a96347733c856e13039939d407d83fa49b88cf64

jobs:
  hotfix-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Exact release checkout preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^^^)" = "$A34"
          test "$(git rev-list --count "$A34..$RELEASE_SHA")" = "3"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$RELEASE_SHA"
          echo "EXACT_RELEASE_SHA=PASS"
          echo "INITIAL_WORKTREE_CLEAN=PASS"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Provision WebKit Playwright
        run: npx playwright install --with-deps webkit
      - name: Build
        run: npm run build --silent
      - name: WebKit 572 contract
        run: node --test --test-concurrency=1 dist/tests/leads-mobile-priority-webkit.test.js
      - name: Cache-bust contracts
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/leads-desktop-zero-training.test.js
          node --test --test-concurrency=1 dist/tests/leads-professional-redesign.test.js
          echo "WEBKIT_572=PASS"
          echo "CACHE_BUST_CONTRACT=PASS"
      - name: A3.4 R1-R12 exact release
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/a34-release.tap"
          node --test --test-concurrency=1 dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js | tee "$log"
          grep -Eq '^# tests 12$' "$log"
          grep -Eq '^# pass 12$' "$log"
          grep -Eq '^# fail 0$' "$log"
          echo "A34_R1_R12=12/12 PASS"
      - name: R11 release stability 10 fresh Node processes
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            log="$RUNNER_TEMP/r11-release-$n.tap"
            set +e
            node --test --test-concurrency=1 dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js >"$log" 2>&1
            rc=$?
            set -e
            total="$(grep -E '^# tests [0-9]+' "$log" | tail -1 | awk '{print $3}')"
            pass="$(grep -E '^# pass [0-9]+' "$log" | tail -1 | awk '{print $3}')"
            fail="$(grep -E '^# fail [0-9]+' "$log" | tail -1 | awk '{print $3}')"
            if grep -Eq '^ok [0-9]+ - A3\.4 R11:' "$log"; then r11=PASS; else r11=FAIL; fi
            echo "REPLAY=$n TOTAL=${total:-unknown} PASS=${pass:-unknown} FAIL=${fail:-unknown} R11=$r11"
            test "$rc" -eq 0
            test "$fail" = "0"
            test "$r11" = "PASS"
          done
          echo "R11_RELEASE_STABILITY=10/10 PASS"

