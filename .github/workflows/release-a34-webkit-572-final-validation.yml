  gate-c-integrated:
    needs: regression-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch canonical historical Gate C
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/a33-gate-c-final.yml?ref=${VALIDATION_BASE}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" "$url" > "$RUNNER_TEMP/a33-gate-c-final-canonical.yml"
          grep -F 'name: SEC-FIX A3.3 Gate C Final Validation' "$RUNNER_TEMP/a33-gate-c-final-canonical.yml"
      - name: Execute 27 historical gates plus release reconciliation contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release_gate_c.py" <<'PY'
          import os, re, shutil, subprocess, sys
          from pathlib import Path
          ROOT=Path.cwd(); CANONICAL=Path(os.environ['RUNNER_TEMP'])/'a33-gate-c-final-canonical.yml'
          RELEASE=os.environ['RELEASE_SHA']; A34=os.environ['A34']; PRE=os.environ['PRE_A34']; REPRO=os.environ['REPRODUCER']
          EXPECTED_BASELINE=sorted(['?? dist/','?? extension/trv-fichas-chrome.zip','?? node_modules/'])
          EXPECTED_GATE19=sorted(['?? artifacts/','?? dist/','?? extension/trv-fichas-chrome.zip','?? node_modules/'])
          EXPECTED_ARTIFACTS=['01-mobile-panel-contacto.png','02-mobile-confirmacion-regreso.png','03-mobile-proximo-seguimiento.png','04-escritorio-contacto.png','05-seguimiento-vencido.png','06-numero-invalido.png']
          RELEASE_FILES=sorted(['index.html','src/leads-mobile-priority-ux.ts','src/leads-professional-redesign.ts','src/tests/leads-desktop-zero-training.test.ts','src/tests/leads-mobile-priority-webkit.test.ts','src/tests/leads-professional-redesign.test.ts'])
          A34_FILES=sorted(['src/membership-catalog.ts','src/mvp-main.ts','src/tenant-cloud-context.ts','src/tenant-hydration.ts','src/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.ts'])
          def run(argv,check=True,capture=False,cwd=ROOT):
              if isinstance(argv,str): r=subprocess.run(['bash','-c','set -euo pipefail\n'+argv],cwd=cwd,text=True,capture_output=capture)
              else: r=subprocess.run(argv,cwd=cwd,text=True,capture_output=capture)
              if check and r.returncode:
                  if capture: sys.stdout.write(r.stdout); sys.stderr.write(r.stderr)
                  raise subprocess.CalledProcessError(r.returncode,argv)
              return r
          def cap(argv,cwd=ROOT): return run(argv,capture=True,cwd=cwd).stdout.rstrip('\n')
          def status(): return sorted(x for x in cap(['git','status','--porcelain=v1','--untracked-files=normal']).splitlines() if x)
          def assert_sha():
              if cap(['git','rev-parse','HEAD'])!=RELEASE: raise RuntimeError('RELEASE_SHA_MISMATCH')
          def assert_no_tracked():
              if cap(['git','diff','--name-only']) or cap(['git','diff','--cached','--name-only']): raise RuntimeError('TRACKED_MUTATION')
          def extract(text):
              lines=text.splitlines(); gates={}; i=0
              while i<len(lines):
                  m=re.match(r'^\s{6}- name: Gate (\d+) -',lines[i])
                  if not m: i+=1; continue
                  n=int(m.group(1)); j=i+1; ri=None
                  while j<len(lines):
                      if re.match(r'^\s{6}- name:',lines[j]): break
                      if re.match(r'^\s{8}run:',lines[j]): ri=j; break
                      j+=1
                  if ri is None: raise RuntimeError(f'Gate {n} no run')
                  raw=lines[ri].strip()[4:].strip()
                  if raw=='|':
                      body=[]; k=ri+1
                      while k<len(lines):
                          line=lines[k]
                          if line and not line.startswith('          '): break
                          body.append(line[10:] if line.startswith('          ') else ''); k+=1
                      gates[n]='\n'.join(body).rstrip()+'\n'
                  else: gates[n]=raw+'\n'
                  i=ri+1
              missing=[n for n in range(1,28) if n not in gates]
              if missing: raise RuntimeError(f'MISSING_GATES {missing}')
              return gates
          def gate(n,script,cwd=ROOT):
              print(f'GATE_{n:02d}_BEGIN',flush=True); r=run(script,check=False,cwd=cwd)
              if r.returncode: raise SystemExit(r.returncode)
              print(f'GATE_{n:02d}=PASS',flush=True)
          def release_scope():
              assert_sha(); assert_no_tracked()
              if cap(['git','rev-parse','HEAD^^^'])!=A34: raise RuntimeError('A34_BASE_NOT_ANCESTOR_3')
              if cap(['git','rev-list','--count',f'{A34}..{RELEASE}'])!='3': raise RuntimeError('COMMIT_COUNT_NOT_3')
              if cap(['git','rev-parse',f'{A34}^'])!=REPRO or cap(['git','rev-parse',f'{A34}^^'])!=PRE: raise RuntimeError('A34_LINEAGE_LOST')
              rf=sorted(filter(None,cap(['git','diff','--name-only',f'{A34}..{RELEASE}']).splitlines()))
              af=sorted(filter(None,cap(['git','diff','--name-only',f'{PRE}..{A34}']).splitlines()))
              if rf!=RELEASE_FILES: raise RuntimeError(f'RELEASE_SCOPE {rf}')
              if af!=A34_FILES: raise RuntimeError(f'A34_SCOPE {af}')
              forbidden=cap(['git','diff','--name-only',f'{A34}..{RELEASE}','--','*.sql','supabase/migrations/**','supabase/baselines/**','.github/workflows/**'])
              if forbidden: raise RuntimeError('FORBIDDEN_RELEASE_SCOPE\n'+forbidden)
              print('RECONCILIATION_SCOPE=PASS',flush=True); print('A34_PATH_OVERLAP=0',flush=True)
          def browser():
              run('if command -v google-chrome >/dev/null; then google-chrome --version; elif command -v chromium >/dev/null; then chromium --version; else exit 1; fi')
          def hotfix_contracts():
              for path in ['dist/tests/leads-mobile-priority-webkit.test.js','dist/tests/leads-desktop-zero-training.test.js','dist/tests/leads-professional-redesign.test.js']:
                  r=run(['node','--test','--test-concurrency=1',path],check=False)
                  if r.returncode: raise SystemExit(r.returncode)
              art=ROOT/'artifacts'
              allowed={'leads-mobile-webkit-validation','leads-desktop-zero-training','leads-desktop-zero-training-webkit','leads-redesign'}
              if art.exists():
                  actual={p.name for p in art.iterdir()}
                  if not actual.issubset(allowed): raise RuntimeError(f'UNEXPECTED_HOTFIX_ARTIFACTS {actual}')
                  for p in list(art.iterdir()): shutil.rmtree(p)
                  art.rmdir()
              print('WEBKIT_572=PASS',flush=True); print('CACHE_BUST_CONTRACT=PASS',flush=True)
          def a34():
              r=run(['node','--test','--test-concurrency=1','dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js'],check=False,capture=True)
              sys.stdout.write(r.stdout); sys.stderr.write(r.stderr)
              if r.returncode: raise SystemExit(r.returncode)
              txt=r.stdout+r.stderr
              for key,val in [('tests',12),('pass',12),('fail',0),('skipped',0)]:
                  m=re.findall(rf'^# {key} (\d+)\s*$',txt,re.M)
                  if not m or int(m[-1])!=val: raise RuntimeError(f'A34_{key}')
              print('A34_R1_R12=12/12 PASS',flush=True)
          def r11_10():
              for n in range(1,11):
                  r=run(['node','--test','--test-concurrency=1','dist/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.js'],check=False,capture=True)
                  txt=r.stdout+r.stderr
                  if r.returncode or not re.search(r'^ok \d+ - A3\.4 R11:',txt,re.M) or re.search(r'^# fail [1-9]',txt,re.M):
                      sys.stdout.write(txt); raise RuntimeError(f'R11_RELEASE_RED_{n}')
                  print(f'R11_REPLAY={n} PASS',flush=True)
              print('R11_RELEASE_STABILITY=10/10 PASS',flush=True)
          def gate19_cleanup():
              assert_sha(); assert_no_tracked()
              if status()!=EXPECTED_GATE19: raise RuntimeError(f'G19_STATUS {status()}')
              b13=ROOT/'artifacts'/'b1-3'
              if not b13.is_dir() or b13.is_symlink(): raise RuntimeError('G19_ARTIFACT_DIR')
              if sorted(p.name for p in b13.iterdir())!=sorted(EXPECTED_ARTIFACTS): raise RuntimeError('G19_FILES')
              for p in b13.iterdir():
                  if p.is_symlink() or not p.is_file(): raise RuntimeError('G19_NONFILE')
                  p.unlink()
              b13.rmdir(); (ROOT/'artifacts').rmdir()
              if status()!=EXPECTED_BASELINE: raise RuntimeError(f'G19_POST {status()}')
              print('GATE19_GENERATED_ARTIFACT_CLEANUP=PASS',flush=True)
          def gate_b():
              for path in ['dist/tests/mvp-scope.test.js','dist/tests/sec-fix-a1-2-e-team-tenant-authority.test.js']:
                  r=run(['node','--test','--test-concurrency=1',path],check=False)
                  if r.returncode: raise SystemExit(r.returncode)
              print('GATE_B_INTEGRATED=PASS',flush=True)
          def final27():
              assert_sha(); assert_no_tracked()
              if (ROOT/'artifacts').exists(): raise RuntimeError('ARTIFACTS_REMAIN')
              if status()!=EXPECTED_BASELINE: raise RuntimeError(f'FINAL_STATUS {status()}')
              shutil.rmtree(ROOT/'dist'); shutil.rmtree(ROOT/'node_modules'); (ROOT/'extension'/'trv-fichas-chrome.zip').unlink()
              if cap(['git','status','--porcelain=v1','--untracked-files=normal']): raise RuntimeError('FINAL_NOT_CLEAN')
              print(f'FINAL_EXACT_CHECKOUT_SHA={RELEASE}',flush=True); print('FINAL_WORKTREE_CLEAN=PASS',flush=True); print('GATE_27=PASS',flush=True); print('GATE_C_SEQUENCE=1-27_COMPLETE',flush=True)
          gates=extract(CANONICAL.read_text())
          print('CANONICAL_GATE_COUNT=27',flush=True); release_scope()
          gate(1,gates[1]); gate(2,gates[2])
          historical=Path('/tmp/release-a33-boundary')
          if historical.exists(): shutil.rmtree(historical)
          run(['git','worktree','add','--detach',str(historical),PRE])
          try: gate(3,gates[3],cwd=historical)
          finally: run(['git','worktree','remove','--force',str(historical)])
          run(['npm','ci']); run(['npm','run','build','--silent']); browser(); run(['npx','playwright','install','--with-deps','webkit']); hotfix_contracts()
          for n in range(4,27):
              gate(n,gates[n])
              if n==7: a34(); r11_10()
              if n==19: gate19_cleanup()
              if n==24: gate_b()
          final27(); print('RELEASE_INTEGRATED_GATE_C=GREEN',flush=True)
          PY
          python3 "$RUNNER_TEMP/release_gate_c.py"

  responsive-final:
    needs: gate-c-integrated
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx playwright install --with-deps webkit
      - run: npm run build --silent
      - name: Canonical responsive tests
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 dist/tests/leads-mobile-priority-webkit.test.js
          node --test --test-concurrency=1 dist/tests/leads-desktop-zero-training.test.js
          test -s artifacts/leads-desktop-zero-training/desktop-1366-top-leads.png
          test -s artifacts/leads-desktop-zero-training/desktop-1440-top-leads.png
          echo "RESPONSIVE_1366x768=PASS"
          echo "RESPONSIVE_1440x900=PASS"
      - name: Exact 360x800 and 390x844 validation-only harness
        shell: bash
        run: |
          set -euo pipefail
          cp dist/tests/leads-mobile-priority-webkit.test.js dist/tests/release-responsive-exact.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/tests/release-responsive-exact.test.js')
          s=p.read_text()
          s=s.replace('for (const width of [320, 390, 430])','for (const width of [360, 390])')
          s=s.replace('width === 320 ? 800 : 844','width === 360 ? 800 : 844')
          s=s.replace('await page.setViewportSize({ width: 320, height: 800 });','await page.setViewportSize({ width: 360, height: 800 });')
          s=s.replace('for (const width of [375, 390, 430])','for (const width of [360, 390])')
          s=s.replace('viewport: { width, height: 844 },','viewport: { width, height: width === 360 ? 800 : 844 },')
          s=s.replace('screen: { width, height: 844 },','screen: { width, height: width === 360 ? 800 : 844 },')
          needle='await load(page, `http://127.0.0.1:${port}`);'
          injection=needle+'\n        assert.equal(await page.locator(\'nav:visible, [role="navigation"]:visible\').count() > 0, true, \'navegación visible\');'
          s=s.replace(needle,injection)
          p.write_text(s)
          PY
          node --test --test-concurrency=1 dist/tests/release-responsive-exact.test.js
          test -s artifacts/leads-mobile-webkit-validation/webkit-360-top-leads.png
          test -s artifacts/leads-mobile-webkit-validation/webkit-390-top-leads.png
          echo "RESPONSIVE_360x800=PASS"
          echo "RESPONSIVE_390x844=PASS"
          echo "RESPONSIVE_PRIORITY_CTA_PIPELINE_CARDS_OVERFLOW_NAVIGATION=PASS"

  final-proof:
    needs: responsive-final
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Final exact proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then exit 1; fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git rev-parse HEAD^^^)" = "$A34"
          test "$(git rev-list --count "$A34..HEAD")" = "3"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/agent/sec-fix-a3-4-hydration-auth-fence | awk '{print $1}')" = "$A34"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_EXPECTED"
          messages="$RUNNER_TEMP/messages.txt"; git log -3 --format='%B' > "$messages"
          grep -F "(cherry picked from commit $HOTFIX_1)" "$messages"
          grep -F "(cherry picked from commit $HOTFIX_2)" "$messages"
          grep -F "(cherry picked from commit $HOTFIX_3)" "$messages"
          expected="$RUNNER_TEMP/expected.txt"; actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' index.html src/leads-mobile-priority-ux.ts src/leads-professional-redesign.ts src/tests/leads-desktop-zero-training.test.ts src/tests/leads-mobile-priority-webkit.test.ts src/tests/leads-professional-redesign.test.ts | sort > "$expected"
          git diff --name-only "$A34..HEAD" | sort > "$actual"; diff -u "$expected" "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "6"
          test -z "$(git diff --name-only "$A34..HEAD" -- src/membership-catalog.ts src/mvp-main.ts src/tenant-cloud-context.ts src/tenant-hydration.ts src/tests/sec-fix-a3-4-pre-runtime-hydration-authority.test.ts)"
          test -z "$(git diff --name-only "$A34..HEAD" -- '*.sql' 'supabase/migrations/**' 'supabase/baselines/**' '.github/workflows/**')"
          echo "FINAL_RELEASE_SHA=$RELEASE_SHA"
          echo "FINAL_RELEASE_BRANCH=$RELEASE_BRANCH"
          echo "FINAL_WORKTREE_CLEAN=PASS"
          echo "TRACKED_DIFF=EMPTY"
          echo "CACHED_DIFF=EMPTY"
          echo "COMMITS_ADDED=3"
          echo "PATHS_CHANGED=6"
          echo "A3.4_PATH_OVERLAP=0"
          echo "SQL=0"
          echo "MIGRATIONS=0"
          echo "BASELINE=0"
          echo "PRODUCTIVE_WORKFLOW=0"
          echo "UNRELATED=0"
          echo "RELEASE A3.4 + HOTFIX-WEBKIT-572 = GREEN CANDIDATE / VALIDATED"
          echo "MERGE=NO"
          echo "MAIN=UNTOUCHED"
          echo "DEPLOY=NO"
          echo "SUPABASE=UNTOUCHED"
          echo "RAILWAY=UNTOUCHED"
