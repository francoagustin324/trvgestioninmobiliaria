          edit('src/mvp-leads-ui.ts', "    addActivity(result.activity);", "    addActivityForAuthenticatedTenant(requireCurrentTenantScope(), result.activity);", 2)
          # Add runtime import if not already present.
          p=Path('src/mvp-leads-ui.ts'); s=p.read_text()
          if "from './tenant-runtime.js'" not in s:
              anchor="import { escapeHtml"
