          edit('src/lead-recommendation-instrumentation.ts', "import { state } from './store.js';\nimport { activeMember, visibleClients } from './team-access.js';", "import { authenticatedTenantMember, state } from './store.js';\nimport { visibleClients } from './team-access.js';\nimport { requireCurrentTenantScope } from './tenant-runtime.js';")
          edit('src/lead-recommendation-instrumentation.ts', "  const visible = visibleClients();\n  return {\n    organizationId: state.crm.organization.id,\n    actorId: activeMember().id,", "  const visible = visibleClients();\n  const scope = requireCurrentTenantScope();\n  const member = authenticatedTenantMember(scope);\n  if (!member) throw new Error('AUTHENTICATED_TENANT_MEMBER_REQUIRED');\n  return {\n    organizationId: scope.organizationId,\n    actorId: member.id,")

          # WhatsApp human identity + pending attempt storage: canonical tenant/member, no activeMemberId.
