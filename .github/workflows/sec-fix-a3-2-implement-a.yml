          edit('src/lead-source-reactivation-ui.ts', "  addActivity(pending.activity);", "  addActivityForAuthenticatedTenant(pending.scope, pending.activity);")
          edit('src/lead-source-reactivation-ui.ts', "  activitiesForClientSave(previous, client).forEach((activity) => addActivity(activity));", "  const scope = requireCurrentTenantScope();\n  activitiesForClientSave(previous, client).forEach((activity) => addActivityForAuthenticatedTenant(scope, activity));")
          edit('src/lead-source-reactivation-ui.ts', "  addActivity(result.activity);", "  addActivityForAuthenticatedTenant(requireCurrentTenantScope(), result.activity);")

          edit('src/lead-qualification-ui.ts', "import { addActivity, visibleClients, visibleConversations } from './team-access.js';", "import { addActivityForAuthenticatedTenant, visibleClients, visibleConversations } from './team-access.js';\nimport { assertTenantRuntimeLeaseCurrent, captureTenantRuntimeLease, requireCurrentTenantScope } from './tenant-runtime.js';")
          edit('src/lead-qualification-ui.ts', "  const deterministic = analyzeLeadQualification(client, text, session.source);", "  const scope = requireCurrentTenantScope();\n  const runtimeLease = captureTenantRuntimeLease(scope);\n  assertTenantRuntimeLeaseCurrent(runtimeLease);\n  const deterministic = analyzeLeadQualification(client, text, session.source);")
          edit('src/lead-qualification-ui.ts', "  qualificationActivities(client.id, deterministic).forEach(addActivity);", "  qualificationActivities(client.id, deterministic).forEach((activity) => addActivityForAuthenticatedTenant(scope, activity));")
