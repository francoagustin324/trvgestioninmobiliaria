          edit('src/lead-qualification-ui.ts', "    saveData(`Calificación aplicada: ${current.name}`);", "    assertTenantRuntimeLeaseCurrent(runtimeLease);\n    saveData(`Calificación aplicada: ${current.name}`);")

          edit('src/mvp-leads-ui.ts', "import { addActivity,", "import { addActivityForAuthenticatedTenant,")
