name: SEC-FIX-A1.2-E Patch

on:
  push:
    branches:
      - validation/sec-fix-a1-2-e-patch

permissions:
  contents: write

jobs:
  patch-e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sec-fix-a1-2-e-team-tenant-authority
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch patch script
        shell: bash
        run: |
          git show origin/validation/sec-fix-a1-2-e-patch:.github/scripts/sec_fix_a1_2_e_patch.py > /tmp/sec_fix_a1_2_e_patch.py
      - name: Apply E production patch
        shell: bash
        run: |
          python /tmp/sec_fix_a1_2_e_patch.py
          git diff --check
          files="$(git diff --name-only)"
          printf '%s\n' "$files"
          expected=$'src/cloud-api.ts\nsrc/server/team-management.ts\nsrc/team-ui.ts'
          test "$files" = "$expected"
      - name: Commit E production patch
        shell: bash
        run: |
          git config user.name 'francoagustin324'
          git config user.email 'francoagustinsolis@gmail.com'
          git add src/cloud-api.ts src/server/team-management.ts src/team-ui.ts
          git commit -m 'SEC-FIX A1.2-E — Scope Team authority to active organization'
          git push origin HEAD:agent/sec-fix-a1-2-e-team-tenant-authority
