name: OrdenBroker Block 2H Focal

on:
  push:
    branches:
      - feature/ordenbroker-block2h-commercial-alerts-automation
  workflow_dispatch:

concurrency:
  group: block2h-focal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --silent
      - name: Compilar TypeScript
        run: npm run build --silent
      - name: Ejecutar focal Block 2H
        run: node --test --test-concurrency=1 dist/tests/block2h-commercial-alerts.test.js
