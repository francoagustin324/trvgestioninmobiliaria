name: SEC-FIX A2.4 R1 test-only fix
on:
  push:
    branches:
      - validation/sec-fix-a2-4-r1-test-fix
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sec-fix-a2-4-org-aware-rpc-v2-alignment
          fetch-depth: 0
      - name: Replace brittle proconfig rendering assertion only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.ts')
          text = path.read_text()
          old = '''    assert.equal(psql(`select p.proconfig::text from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), '{search_path=""}');'''
          new = '''    assert.equal(psql(`select p.proconfig = ARRAY['search_path=""']::text[] from pg_catalog.pg_proc p where p.oid='public.visit_transaction_authority_active_v2(uuid)'::pg_catalog.regprocedure;`), 't');'''
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.ts
          git add src/tests/sec-fix-a2-4-org-aware-rpc-v2-alignment.test.ts
          git -c user.name='PropControl Validation' -c user.email='actions@users.noreply.github.com' commit -m 'SEC-FIX A2.4 — Fix proconfig catalog assertion'
          git push origin HEAD:agent/sec-fix-a2-4-org-aware-rpc-v2-alignment
